],"sourceIds":["IN01","IN03"]},{"id":"10c","title":"Describe policy as dated information","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["An official Government of India statement dated 13 March 2026 reported support of up to ₹50 lakh per patient for identified rare diseases through designated Centres of Excellence under the National Policy for Rare Diseases. This is a dated policy statement, not proof that an individual child will receive that amount.","The MoHFW policy index also records later amendments and centre-designation notices, including a July 2026 AIIMS Nagpur notice. Therefore, do not treat an older centre count as a current directory. Confirm the operative policy, eligible condition, assessment process and available services with the designated centre before advising a family about access."],"points":[],"sourceIds":["CP03","CP04"]},{"id":"10d","title":"Make a referral usable for the family","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["The DBT UMMID programme document describes capacity in genetic diagnosis, counselling, screening and training through NIDAN Kendras. Its 2020 programme description is useful context, but is not a current emergency-contact or service-availability directory.","Proposed referral practice: verify a destination, appointment route, required records and available clinical services before travel. Give the family copies of results and a plain-language purpose for the referral. Identify local support for paperwork and follow-up where available. Recheck arrangements after a missed visit; a long journey, lost wages or an unavailable test can interrupt an otherwise sound plan."],"points":[],"sourceIds":["CP05"]},{"id":"10e","title":"Build an institutional pathway and test it","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Proposed faculty implementation task: agree a locally approved pathway with paediatrics, emergency care, laboratory medicine, metabolic or genetics expertise, dietetics and administration. Assign responsibility for urgent advice, sample dispatch, result review, family communication and continuing care. Record actual service hours and a process for keeping details current.","Test the pathway with a fictional night-time referral and a screen-positive infant who appears well. Identify where a handover could fail, then revise that step. Audit time to clinical review, rejected specimens, unreviewed results and missed follow-up. These are proposed improvement measures; they do not imply an existing national mandate or confer specialist competence."],"points":[],"sourceIds":[]}],"takeaway":"A workable pathway connects the right clinical destination, usable tests and continuing family support.","check":{"id":"lc10","stem":"A family asks whether a listed Centre of Excellence guarantees free treatment up to ₹50 lakh. What is the best response?","options":[{"text":"Delay emergency transfer until a funding application is decided.","feedback":"Clinical urgency determines emergency care; administrative navigation should support that care."},{"text":"Explain the dated policy and verify the child's eligibility, current process and services with the centre.","feedback":"Correct. A policy ceiling and a centre designation do not establish an individual entitlement or available treatment."},{"text":"Guarantee the full amount because the hospital is listed.","feedback":"Designation alone is insufficient evidence of eligibility, approval or payment."},{"text":"Use an old centre count as proof that no newer services exist.","feedback":"Later official notices exist; current arrangements need verification."}],"answer":1,"critical":false,"sourceIds":["CP03","CP04"]},"evaluation":[{"id":"lc10","stem":"A family asks whether a listed Centre of Excellence guarantees free treatment up to ₹50 lakh. What is the best response?","options":[{"text":"Delay emergency transfer until a funding application is decided.","feedback":"Clinical urgency determines emergency care; administrative navigation should support that care."},{"text":"Explain the dated policy and verify the child's eligibility, current process and services with the centre.","feedback":"Correct. A policy ceiling and a centre designation do not establish an individual entitlement or available treatment."},{"text":"Guarantee the full amount because the hospital is listed.","feedback":"Designation alone is insufficient evidence of eligibility, approval or payment."},{"text":"Use an old centre count as proof that no newer services exist.","feedback":"Later official notices exist; current arrangements need verification."}],"answer":1,"critical":false,"sourceIds":["CP03","CP04"]},{"id":"lc10-2","stem":"What is the safest first step when local metabolic testing is unavailable?","options":[{"text":"Stabilise, collect feasible samples correctly, and activate the referral pathway","feedback":"Correct. Care, feasible diagnostics and referral can begin despite resource limits."},{"text":"Wait for a visiting specialist","feedback":"Incorrect. Care, feasible diagnostics and referral can begin despite resource limits."},{"text":"Send unlabelled samples","feedback":"Incorrect. Care, feasible diagnostics and referral can begin despite resource limits."},{"text":"Promise a precise diagnosis","feedback":"Incorrect. Care, feasible diagnostics and referral can begin despite resource limits."}],"answer":0,"critical":true,"sourceIds":["CP03","CP04"]},{"id":"lc10-3","stem":"What must be verified before giving a family a referral contact?","options":[{"text":"That the service and contact are current and accept the referral","feedback":"Correct. Directories and services change; operational details need current confirmation."},{"text":"That it appeared in an old presentation","feedback":"Incorrect. Directories and services change; operational details need current confirmation."},{"text":"That travel is easy","feedback":"Incorrect. Directories and services change; operational details need current confirmation."},{"text":"That funding is guaranteed","feedback":"Incorrect. Directories and services change; operational details need current confirmation."}],"answer":0,"critical":false,"sourceIds":["CP03","CP04"]},{"id":"lc10-4","stem":"How should rare-disease funding be explained?","options":[{"text":"As guaranteed treatment","feedback":"Incorrect. Policy access is conditional and should never be promised without verification."},{"text":"As a policy pathway with eligibility and current implementation to verify","feedback":"Correct. Policy access is conditional and should never be promised without verification."},{"text":"As irrelevant to families","feedback":"Incorrect. Policy access is conditional and should never be promised without verification."},{"text":"As identical in every state","feedback":"Incorrect. Policy access is conditional and should never be promised without verification."}],"answer":1,"critical":false,"sourceIds":["CP03","CP04"]},{"id":"lc10-5","stem":"Which local quality measure is most actionable?","options":[{"text":"Proportion of urgent ammonia results communicated and acknowledged within the agreed time","feedback":"Correct. A time-bound closed-loop measure tests whether the pathway works."},{"text":"Number of rare disease names taught","feedback":"Incorrect. A time-bound closed-loop measure tests whether the pathway works."},{"text":"Length of the protocol","feedback":"Incorrect. A time-bound closed-loop measure tests whether the pathway works."},{"text":"Number of posters printed","feedback":"Incorrect. A time-bound closed-loop measure tests whether the pathway works."}],"answer":0,"critical":false,"sourceIds":["CP03","CP04"]}]},{"id":11,"title":"PCNA 1 · The IEM overview","subtitle":"Organise hundreds of disorders into patterns that lead to action.","minutes":16,"outcomes":["Classify IEM presentations by mechanism and tempo.","Recognise acute and chronic entry points.","Build a staged evaluation without delaying care."],"sections":[{"id":"11a","title":"Three useful mechanistic groups","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["A bedside classification divides IEMs into intoxication disorders, energy deficiency disorders and disorders of complex molecules. Intoxication disorders often produce a symptom-free interval followed by episodic decompensation. Energy disorders affect high-demand tissues and may be acute or progressive. Complex-molecule disorders commonly create chronic, multisystem phenotypes."],"points":["Use the group to organise the differential; do not treat it as a diagnosis."],"sourceIds":["PCNA01"]},{"id":"11b","title":"Presentation matters more than rarity","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Start with age, trajectory, trigger and organ systems. Acute encephalopathy, vomiting, respiratory change, seizures or coma may be metabolic even when routine examination is nonspecific. Chronic developmental delay, regression, organomegaly, dysmorphism, movement disorder or multisystem disease creates a different entry point."],"points":["Name the clinical syndrome before naming a rare disorder."],"sourceIds":["PCNA01"]},{"id":"11c","title":"Treatable disease changes the threshold","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["The possibility of a treatable IEM justifies timely recognition and targeted testing. Common acquired causes remain in the differential and may coexist. A normal newborn screen cannot exclude disorders outside the panel, late-onset disease or a false-negative result."],"points":["Ask which result would change an urgent decision today."],"sourceIds":["PCNA01","IN06"]},{"id":"11d","title":"Biochemistry and genetics answer different questions","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Plasma and urine metabolic profiles can identify a biochemical pathway and capture the acute state. Genomic testing can confirm or redirect the diagnosis, but phenotype and biochemical concordance remain essential. Store interpretable samples when feasible and document treatment timing."],"points":["PG task: write the biochemical question before selecting a genetic test."],"sourceIds":["PCNA01","IN03"]},{"id":"11e","title":"Apply the framework in India","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["At a first-contact Indian facility, prioritise stabilisation, accessible first-line tests, correct samples and an operational referral. Test availability varies, so tier investigations by urgency and management consequence. Faculty should teach the pathway their learners can actually activate."],"points":["Verify local laboratory handling and referral contacts before using a pathway."],"sourceIds":["PCNA01","IN01","CP04"]}],"takeaway":"Classify the presentation, protect the child, capture useful evidence and escalate the next discriminating question.","evaluation":[{"id":"lc11-1","stem":"Which classification is most useful at the bedside when the exact IEM is unknown?","options":[{"text":"By alphabetical order","feedback":"Incorrect. The three mechanistic groups connect tempo and organ involvement to a workable differential."},{"text":"By eponym only","feedback":"Incorrect. The three mechanistic groups connect tempo and organ involvement to a workable differential."},{"text":"Intoxication, energy deficiency and complex-molecule groups","feedback":"Correct. The three mechanistic groups connect tempo and organ involvement to a workable differential."},{"text":"By chromosome number only","feedback":"Incorrect. The three mechanistic groups connect tempo and organ involvement to a workable differential."}],"answer":2,"critical":true,"sourceIds":["PCNA01"]},{"id":"lc11-2","stem":"A child has episodic encephalopathy after a symptom-free interval. What should the clinician do first?","options":[{"text":"Name a single rare disease","feedback":"Incorrect. The clinical syndrome and physiological priorities come before a precise label."},{"text":"Define the acute syndrome and stabilise while testing plausible causes","feedback":"Correct. The clinical syndrome and physiological priorities come before a precise label."},{"text":"Wait for dysmorphism","feedback":"Incorrect. The clinical syndrome and physiological priorities come before a precise label."},{"text":"Assume behavioural illness","feedback":"Incorrect. The clinical syndrome and physiological priorities come before a precise label."}],"answer":1,"critical":true,"sourceIds":["PCNA01"]},{"id":"lc11-3","stem":"What does a normal newborn screen mean in a symptomatic child?","options":[{"text":"Only the screened conditions and limitations should be considered; assess the child","feedback":"Correct. Screening scope is limited and cannot replace diagnostic assessment."},{"text":"Genetic testing is prohibited","feedback":"Incorrect. Screening scope is limited and cannot replace diagnostic assessment."},{"text":"Metabolic samples have no value","feedback":"Incorrect. Screening scope is limited and cannot replace diagnostic assessment."},{"text":"Every IEM is excluded","feedback":"Incorrect. Screening scope is limited and cannot replace diagnostic assessment."}],"answer":0,"critical":false,"sourceIds":["PCNA01","IN06"]},{"id":"lc11-4","stem":"Why combine biochemical and genomic evidence?","options":[{"text":"Genomics measures current catabolism","feedback":"Incorrect. The methods provide complementary evidence."},{"text":"Biochemistry establishes inheritance alone","feedback":"Incorrect. The methods provide complementary evidence."},{"text":"They are always interchangeable","feedback":"Incorrect. The methods provide complementary evidence."},{"text":"Concordance helps connect the pathway, phenotype and variant","feedback":"Correct. The methods provide complementary evidence."}],"answer":3,"critical":false,"sourceIds":["PCNA01"]},{"id":"lc11-5","stem":"When advanced testing is limited, what is the best priority?","options":[{"text":"Delay all care until the full panel is affordable","feedback":"Incorrect. A tiered plan should answer the next consequential clinical question."},{"text":"Order randomly","feedback":"Incorrect. A tiered plan should answer the next consequential clinical question."},{"text":"Choose tests by novelty","feedback":"Incorrect. A tiered plan should answer the next consequential clinical question."},{"text":"Prioritise urgency, management consequence and referral coordination","feedback":"Correct. A tiered plan should answer the next consequential clinical question."}],"answer":3,"critical":false,"sourceIds":["PCNA01","IN01"]}]},{"id":12,"title":"PCNA 2 · Acidosis","subtitle":"Separate organic acidaemias from pyruvate and ketone-body disorders.","minutes":18,"outcomes":["Confirm and characterise metabolic acidosis.","Use ketones, lactate, glucose and ammonia together.","Protect diagnostic value during acute care."],"sections":[{"id":"12a","title":"Confirm the acid–base problem","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Low bicarbonate alone is not a complete acid–base diagnosis. Interpret pH, carbon dioxide, bicarbonate and the anion gap using the local laboratory method. An increased gap suggests unmeasured acids; a normal gap directs attention elsewhere."],"points":["Calculate and interpret rather than attaching a disease name to one value."],"sourceIds":["PCNA02"]},{"id":"12b","title":"Build the biochemical constellation","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Organic acidaemias commonly combine increased-gap acidosis with ketosis and may include hyperammonaemia, hypoglycaemia, cytopenias or raised lactate. Pyruvate disorders may feature lactic acidosis. Defects of ketone production and ketone use can create different glucose–ketone patterns."],"points":["Read glucose, ketones, lactate and ammonia as one physiological story."],"sourceIds":["PCNA02"]},{"id":"12c","title":"Reverse catabolism while the diagnosis develops","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["A severely ill child needs stabilisation and specialist-directed reversal of catabolism before the exact enzyme defect is known. Infection and other acquired causes must be assessed in parallel. Collect feasible blood and urine samples early, but never postpone resuscitation."],"points":["Record whether samples preceded glucose, fluids or other treatment."],"sourceIds":["PCNA02","IN01"]},{"id":"12d","title":"Use specialised tests to discriminate","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Plasma amino acids, acylcarnitine profile and urine organic acids can separate disease families when interpreted with age, clinical state and treatment. A single metabolite may be secondary or shared by several disorders; confirmation may require enzyme or molecular testing."],"points":["Ask: what alternative explanation could produce this marker?"],"sourceIds":["PCNA02"]},{"id":"12e","title":"Design a reliable sample journey","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["In India, access to organic-acid and acylcarnitine testing differs across centres. Agree the tube, volume, storage, courier timing and result ownership with the receiving laboratory. Freeze or retain suitable extra serum/plasma and urine only according to the laboratory SOP."],"points":["A sample without correct handling or clinical context can mislead."],"sourceIds":["PCNA02","IN03"]}],"takeaway":"Acidosis becomes informative when its gap, ketones, lactate, glucose, ammonia and timing are interpreted together.","evaluation":[{"id":"lc12-1","stem":"A child has increased-gap acidosis, ketosis and encephalopathy. What is the best interpretation?","options":[{"text":"This proves one organic acidaemia","feedback":"Incorrect. The constellation raises urgency and guides testing without naming a single disease."},{"text":"An organic acidaemia is a priority differential, but the pattern requires confirmation","feedback":"Correct. The constellation raises urgency and guides testing without naming a single disease."},{"text":"Ketosis excludes IEM","feedback":"Incorrect. The constellation raises urgency and guides testing without naming a single disease."},{"text":"Wait for genetic confirmation before stabilising","feedback":"Incorrect. The constellation raises urgency and guides testing without naming a single disease."}],"answer":1,"critical":true,"sourceIds":["PCNA02"]},{"id":"lc12-2","stem":"Which set best characterises a metabolic acidosis?","options":[{"text":"Haemoglobin alone","feedback":"Incorrect. Acid–base variables and the anion gap define the disturbance."},{"text":"Bilirubin and INR only","feedback":"Incorrect. Acid–base variables and the anion gap define the disturbance."},{"text":"TSH alone","feedback":"Incorrect. Acid–base variables and the anion gap define the disturbance."},{"text":"pH, carbon dioxide, bicarbonate and anion gap","feedback":"Correct. Acid–base variables and the anion gap define the disturbance."}],"answer":3,"critical":false,"sourceIds":["PCNA02"]},{"id":"lc12-3","stem":"What should happen before the precise subtype is known in a critically ill child?","options":[{"text":"Start a lifelong diet independently","feedback":"Incorrect. Initial physiological care need not wait for a precise enzyme diagnosis."},{"text":"Repeat the same sample next month","feedback":"Incorrect. Initial physiological care need not wait for a precise enzyme diagnosis."},{"text":"Delay care","feedback":"Incorrect. Initial physiological care need not wait for a precise enzyme diagnosis."},{"text":"Stabilise and reverse catabolism under specialist guidance while evaluating causes","feedback":"Correct. Initial physiological care need not wait for a precise enzyme diagnosis."}],"answer":3,"critical":true,"sourceIds":["PCNA02","IN01"]},{"id":"lc12-4","stem":"Why can one elevated urine organic acid be insufficient?","options":[{"text":"Only imaging can diagnose IEM","feedback":"Incorrect. Pattern, clinical context and confirmation are needed."},{"text":"Markers can be secondary or shared and need contextual confirmation","feedback":"Correct. Pattern, clinical context and confirmation are needed."},{"text":"Every marker is diagnostic","feedback":"Incorrect. Pattern, clinical context and confirmation are needed."},{"text":"Urine contains no metabolites","feedback":"Incorrect. Pattern, clinical context and confirmation are needed."}],"answer":1,"critical":false,"sourceIds":["PCNA02"]},{"id":"lc12-5","stem":"Which action best preserves diagnostic value?","options":[{"text":"Collect feasible acute samples with time and treatment documented","feedback":"Correct. Timing, identification and handling make an acute sample interpretable."},{"text":"Delay resuscitation until every tube is filled","feedback":"Incorrect. Timing, identification and handling make an acute sample interpretable."},{"text":"Send an unlabelled urine jar","feedback":"Incorrect. Timing, identification and handling make an acute sample interpretable."},{"text":"Ignore the receiving laboratory instructions","feedback":"Incorrect. Timing, identification and handling make an acute sample interpretable."}],"answer":0,"critical":false,"sourceIds":["PCNA02","IN03"]}]},{"id":13,"title":"PCNA 3 · Hyperammonaemia","subtitle":"Recognise ammonia toxicity and organise a time-critical response.","minutes":18,"outcomes":["Recognise hyperammonaemic encephalopathy.","Distinguish major biochemical patterns.","Explain the principles of urgent escalation."],"sections":[{"id":"13a","title":"Think ammonia early","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Hyperammonaemia can present with poor feeding, vomiting, lethargy, abnormal breathing, seizures, posturing or coma. A neonate may initially appear well. In an unexplained encephalopathy, ammonia is a time-critical measurement even when liver disease is not obvious."],"points":["Symptoms reflect brain toxicity and can progress quickly."],"sourceIds":["PCNA03"]},{"id":"13b","title":"Protect the sample and the child","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Ammonia is vulnerable to collection and processing error. Follow the laboratory protocol, send the sample promptly and contact the laboratory about an unexpected result. An implausible value may need urgent repetition, but assessment and escalation continue while it is checked."],"points":["Record sample time, conditions, units and treatment."],"sourceIds":["PCNA03","IN03"]},{"id":"13c","title":"Use acid–base and metabolites","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Marked ammonia with respiratory alkalosis and little acidosis raises concern for a urea-cycle disorder. Acidosis or ketosis may point toward organic acidaemia or another secondary cause. Plasma amino acids, urine orotic acid and related studies help discriminate, but patterns overlap."],"points":["Say “supports a disease family,” not “confirms the enzyme.”"],"sourceIds":["PCNA03"]},{"id":"13d","title":"Know the emergency principles","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Urgent management aims to stop ongoing nitrogen accumulation and catabolism, provide safe energy, use disease-appropriate nitrogen disposal therapy and consider extracorporeal removal when indicated. Exact agents, doses and thresholds belong to the current metabolic/PICU protocol."],"points":["Call metabolic and intensive-care expertise early."],"sourceIds":["PCNA03","IN01"]},{"id":"13e","title":"Make referral operational","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["The referring team should communicate neurological status, ventilation, ammonia values with times and units, treatment, renal access issues, samples and transport readiness. In India, confirm which referral centre can provide the required metabolic and critical-care capability."],"points":["A hospital name alone is not a transfer plan."],"sourceIds":["PCNA03","CP04"]}],"takeaway":"Measure ammonia early, treat the clinical emergency and use the pattern to guide urgent specialist care.","evaluation":[{"id":"lc13-1","stem":"Which presentation should prompt urgent ammonia measurement?","options":[{"text":"Stable isolated eczema","feedback":"Incorrect. Hyperammonaemia can present nonspecifically and worsen rapidly."},{"text":"Simple healed fracture","feedback":"Incorrect. Hyperammonaemia can present nonspecifically and worsen rapidly."},{"text":"Normal development","feedback":"Incorrect. Hyperammonaemia can present nonspecifically and worsen rapidly."},{"text":"Unexplained neonatal encephalopathy with abnormal breathing","feedback":"Correct. Hyperammonaemia can present nonspecifically and worsen rapidly."}],"answer":3,"critical":true,"sourceIds":["PCNA03"]},{"id":"lc13-2","stem":"High ammonia with respiratory alkalosis most strongly prioritises which family?","options":[{"text":"Galactosemia is proven","feedback":"Incorrect. This pattern is characteristic enough to prioritise a urea-cycle disorder while confirming the cause."},{"text":"Any myopathy","feedback":"Incorrect. This pattern is characteristic enough to prioritise a urea-cycle disorder while confirming the cause."},{"text":"Urea-cycle disorder","feedback":"Correct. This pattern is characteristic enough to prioritise a urea-cycle disorder while confirming the cause."},{"text":"Lysosomal storage disorder alone","feedback":"Incorrect. This pattern is characteristic enough to prioritise a urea-cycle disorder while confirming the cause."}],"answer":2,"critical":false,"sourceIds":["PCNA03"]},{"id":"lc13-3","stem":"An ammonia result is unexpectedly extreme. What is best?","options":[{"text":"Convert the units from memory","feedback":"Incorrect. Pre-analytical error is possible, but toxicity makes delay unsafe."},{"text":"Dismiss it automatically","feedback":"Incorrect. Pre-analytical error is possible, but toxicity makes delay unsafe."},{"text":"Follow the lab protocol for urgent verification while continuing assessment and escalation","feedback":"Correct. Pre-analytical error is possible, but toxicity makes delay unsafe."},{"text":"Wait until morning","feedback":"Incorrect. Pre-analytical error is possible, but toxicity makes delay unsafe."}],"answer":2,"critical":true,"sourceIds":["PCNA03","IN03"]},{"id":"lc13-4","stem":"Which is an emergency-management principle?","options":[{"text":"Allow catabolism to continue","feedback":"Incorrect. Management addresses ammonia production, catabolism and removal."},{"text":"Reduce nitrogen burden and reverse catabolism under specialist protocols","feedback":"Correct. Management addresses ammonia production, catabolism and removal."},{"text":"Wait for the genotype","feedback":"Incorrect. Management addresses ammonia production, catabolism and removal."},{"text":"Use one fixed threshold everywhere","feedback":"Incorrect. Management addresses ammonia production, catabolism and removal."}],"answer":1,"critical":false,"sourceIds":["PCNA03"]},{"id":"lc13-5","stem":"Which referral detail is most useful?","options":[{"text":"Time-stamped ammonia values, neurological status, treatment and required capability","feedback":"Correct. The receiving team needs the child’s state, trajectory and actions already taken."},{"text":"A list of every rare disease","feedback":"Incorrect. The receiving team needs the child’s state, trajectory and actions already taken."},{"text":"The family address only","feedback":"Incorrect. The receiving team needs the child’s state, trajectory and actions already taken."},{"text":"Only the suspected disease name","feedback":"Incorrect. The receiving team needs the child’s state, trajectory and actions already taken."}],"answer":0,"critical":false,"sourceIds":["PCNA03","CP04"]}]},{"id":14,"title":"PCNA 4 · Hypoglycaemia","subtitle":"Use fasting physiology to distinguish glycogenolysis and gluconeogenesis disorders.","minutes":18,"outcomes":["Interpret a critical sample physiologically.","Recognise hepatic GSD and gluconeogenesis patterns.","Plan safe long-term learning without provoking fasting."],"sections":[{"id":"14a","title":"Ask what the body did during low glucose","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["A glucose value becomes more informative when paired with ketones, free fatty acids, lactate and relevant hormones and metabolites. The critical sample should reflect spontaneous hypoglycaemia when feasible. Never induce fasting outside an approved specialist setting."],"points":["Treatment of symptomatic hypoglycaemia is not delayed for sampling."],"sourceIds":["PCNA04"]},{"id":"14b","title":"Recognise hepatic glycogen phenotypes","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Hepatic glycogen storage diseases often present with fasting intolerance and hepatomegaly. The combination of ketones, lactate, lipids, uric acid, growth and examination helps separate subtypes. A single normal value after feeding does not reconstruct the fasting state."],"points":["Link the laboratory pattern to liver size and fasting duration."],"sourceIds":["PCNA04"]},{"id":"14c","title":"Recognise gluconeogenesis failure","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Disorders of gluconeogenesis can cause fasting hypoglycaemia with lactic acidosis, with or without ketosis. Fructose-1,6-bisphosphatase deficiency may decompensate during fasting or illness. Pyruvate carboxylase and PEPCK-related disorders have broader phenotypes."],"points":["The pattern guides targeted confirmation; it does not prescribe treatment by itself."],"sourceIds":["PCNA04"]},{"id":"14d","title":"Separate production from utilisation","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Low glucose with inappropriately low ketones suggests impaired fatty-acid oxidation or ketogenesis, while endocrine causes remain possible. Ketotic hypoglycaemia has a broad differential. Prior feeds, dextrose and timing can change every value."],"points":["Interpret “low ketones” relative to the degree and duration of hypoglycaemia."],"sourceIds":["PCNA04","PCNA08"]},{"id":"14e","title":"Turn diagnosis into a family plan","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Long-term care aims to prevent fasting and metabolic instability while supporting normal growth. A written illness plan, realistic food access, school communication and dietitian follow-up matter. Indian families may need plans adapted to local foods, travel time and emergency access."],"points":["No generic fasting duration or uncooked-starch regimen fits every child."],"sourceIds":["PCNA04","IN01"]}],"takeaway":"Read hypoglycaemia as a fuel response, then connect the critical sample to phenotype and timing.","evaluation":[{"id":"lc14-1","stem":"What makes a hypoglycaemia sample “critical”?","options":[{"text":"It is collected after full recovery only","feedback":"Incorrect. The metabolic and hormonal response during hypoglycaemia is the diagnostic opportunity."},{"text":"It contains genetic material alone","feedback":"Incorrect. The metabolic and hormonal response during hypoglycaemia is the diagnostic opportunity."},{"text":"It is collected during the spontaneous low-glucose state with relevant context","feedback":"Correct. The metabolic and hormonal response during hypoglycaemia is the diagnostic opportunity."},{"text":"It is the largest tube","feedback":"Incorrect. The metabolic and hormonal response during hypoglycaemia is the diagnostic opportunity."}],"answer":2,"critical":true,"sourceIds":["PCNA04"]},{"id":"lc14-2","stem":"Hypoglycaemia, hepatomegaly and a fasting-related pattern should raise which family?","options":[{"text":"A fracture disorder","feedback":"Incorrect. Hepatic GSDs commonly combine fasting intolerance and hepatomegaly."},{"text":"Hepatic glycogen storage disease","feedback":"Correct. Hepatic GSDs commonly combine fasting intolerance and hepatomegaly."},{"text":"Isolated skin infection","feedback":"Incorrect. Hepatic GSDs commonly combine fasting intolerance and hepatomegaly."},{"text":"Only a movement disorder","feedback":"Incorrect. Hepatic GSDs commonly combine fasting intolerance and hepatomegaly."}],"answer":1,"critical":false,"sourceIds":["PCNA04"]},{"id":"lc14-3","stem":"Hypoglycaemia with lactic acidosis during fasting can suggest what mechanism?","options":[{"text":"A gluconeogenesis defect","feedback":"Correct. Failure of gluconeogenesis can link low glucose and lactate accumulation."},{"text":"Excess glycogen breakdown is proven","feedback":"Incorrect. Failure of gluconeogenesis can link low glucose and lactate accumulation."},{"text":"Lysosomal storage alone","feedback":"Incorrect. Failure of gluconeogenesis can link low glucose and lactate accumulation."},{"text":"Normal adaptation","feedback":"Incorrect. Failure of gluconeogenesis can link low glucose and lactate accumulation."}],"answer":0,"critical":false,"sourceIds":["PCNA04"]},{"id":"lc14-4","stem":"Why must ketones be interpreted with glucose and timing?","options":[{"text":"Ketones never change","feedback":"Incorrect. The relationship between fuel need and ketone response is the clue."},{"text":"Any ketone excludes FAOD","feedback":"Incorrect. The relationship between fuel need and ketone response is the clue."},{"text":"Urine ketones name the exact disorder","feedback":"Incorrect. The relationship between fuel need and ketone response is the clue."},{"text":"The adequacy of ketosis depends on the fuel state and prior treatment","feedback":"Correct. The relationship between fuel need and ketone response is the clue."}],"answer":3,"critical":false,"sourceIds":["PCNA04","PCNA08"]},{"id":"lc14-5","stem":"Which long-term plan is safest?","options":[{"text":"Permanent carbohydrate exclusion","feedback":"Incorrect. Prevention must be diagnosis-specific, nutritionally safe and usable."},{"text":"No written illness guidance","feedback":"Incorrect. Prevention must be diagnosis-specific, nutritionally safe and usable."},{"text":"A specialist and dietitian plan adapted to diagnosis, growth and family circumstances","feedback":"Correct. Prevention must be diagnosis-specific, nutritionally safe and usable."},{"text":"One fasting rule for every IEM","feedback":"Incorrect. Prevention must be diagnosis-specific, nutritionally safe and usable."}],"answer":2,"critical":false,"sourceIds":["PCNA04","IN01"]}]},{"id":15,"title":"PCNA 5 · Cognitive impairment","subtitle":"Look for treatable metabolic clues in developmental and behavioural phenotypes.","minutes":17,"outcomes":["Identify metabolic red flags in cognitive impairment.","Compare selected treatable pathways.","Choose phenotype-directed investigations."],"sections":[{"id":"15a","title":"Search for a pattern beyond developmental delay","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Intellectual disability is common and usually not caused by an IEM, but regression, episodic deterioration, movement disorder, seizures, unusual behaviour, eye or skeletal findings, thrombosis, organ disease or a suggestive family history increase the yield of metabolic evaluation."],"points":["Document whether skills were never acquired or were lost."],"sourceIds":["PCNA05"]},{"id":"15b","title":"Phenylalanine and newborn screening","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Untreated classic phenylketonuria causes severe neurodevelopmental harm, while early dietary treatment transformed outcomes and drove newborn screening. A screened child with later symptoms still deserves clinical assessment because programmes and results have limits."],"points":["Know the actual Indian state or institutional screening panel."],"sourceIds":["PCNA05","IN06"]},{"id":"15c","title":"Homocysteine and methionine clues","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Classic homocystinuria can involve cognition, ectopia lentis, skeletal features and thromboembolism. The phenotype may evolve, so a young child need not show the full pattern. Total homocysteine and related metabolites must be interpreted within the relevant pathway."],"points":["A thrombotic event plus lens or skeletal findings is a high-value combination."],"sourceIds":["PCNA05"]},{"id":"15d","title":"Purine, pyrimidine and creatine pathways","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Self-injury with hyperuricaemia suggests Lesch–Nyhan syndrome, while other purine and pyrimidine disorders have different neurological phenotypes. Cerebral creatine deficiency disorders may present with speech delay, intellectual disability, seizures or movement disorder and require pathway-specific biochemical and genetic evaluation."],"points":["Use the distinctive associated feature to select the next test."],"sourceIds":["PCNA05"]},{"id":"15e","title":"Avoid indiscriminate panels","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["A tiered Indian evaluation begins with careful history, examination and accessible tests, then directs specialised biochemical or genomic work with neurology/genetics support. Early intervention and rehabilitation proceed while the cause is investigated."],"points":["Diagnostic pursuit and developmental support should run together."],"sourceIds":["PCNA05","CP04"]}],"takeaway":"Regression and distinctive multisystem clues turn nonspecific cognitive impairment into a focused metabolic question.","evaluation":[{"id":"lc15-1","stem":"Which feature most strengthens a metabolic evaluation in a child with developmental impairment?","options":[{"text":"A common cold","feedback":"Incorrect. Regression is a major red flag and changes the diagnostic question."},{"text":"Documented loss of previously acquired skills","feedback":"Correct. Regression is a major red flag and changes the diagnostic question."},{"text":"Stable isolated reading difficulty","feedback":"Incorrect. Regression is a major red flag and changes the diagnostic question."},{"text":"Normal growth alone","feedback":"Incorrect. Regression is a major red flag and changes the diagnostic question."}],"answer":1,"critical":true,"sourceIds":["PCNA05"]},{"id":"lc15-2","stem":"Why is PKU central to newborn-screening history?","options":[{"text":"Early detection and treatment can prevent severe neurodevelopmental harm","feedback":"Correct. PKU demonstrated the value of detecting a treatable presymptomatic disorder."},{"text":"It is diagnosed by examination alone","feedback":"Incorrect. PKU demonstrated the value of detecting a treatable presymptomatic disorder."},{"text":"Every country screens identically","feedback":"Incorrect. PKU demonstrated the value of detecting a treatable presymptomatic disorder."},{"text":"Treatment begins only in adulthood","feedback":"Incorrect. PKU demonstrated the value of detecting a treatable presymptomatic disorder."}],"answer":0,"critical":false,"sourceIds":["PCNA05"]},{"id":"lc15-3","stem":"Cognitive impairment, ectopia lentis and thrombosis suggest which pathway?","options":[{"text":"Ketone utilisation only","feedback":"Incorrect. The combination is characteristic of classic homocystinuria."},{"text":"Lysosomal acid lipase alone","feedback":"Incorrect. The combination is characteristic of classic homocystinuria."},{"text":"Urea cycle only","feedback":"Incorrect. The combination is characteristic of classic homocystinuria."},{"text":"Homocysteine–methionine metabolism","feedback":"Correct. The combination is characteristic of classic homocystinuria."}],"answer":3,"critical":false,"sourceIds":["PCNA05"]},{"id":"lc15-4","stem":"Self-injury with hyperuricaemia is a clue to which disorder?","options":[{"text":"MCAD deficiency","feedback":"Incorrect. HGPRT deficiency produces the recognisable neurological and purine phenotype."},{"text":"Galactosaemia","feedback":"Incorrect. HGPRT deficiency produces the recognisable neurological and purine phenotype."},{"text":"Lesch–Nyhan syndrome","feedback":"Correct. HGPRT deficiency produces the recognisable neurological and purine phenotype."},{"text":"PMM2-CDG","feedback":"Incorrect. HGPRT deficiency produces the recognisable neurological and purine phenotype."}],"answer":2,"critical":false,"sourceIds":["PCNA05"]},{"id":"lc15-5","stem":"What is the best evaluation strategy?","options":[{"text":"Use newborn screening as lifelong exclusion","feedback":"Incorrect. Focused testing and support can proceed in parallel."},{"text":"Phenotype-directed tiers with developmental care continuing","feedback":"Correct. Focused testing and support can proceed in parallel."},{"text":"One universal rare-disease panel before examination","feedback":"Incorrect. Focused testing and support can proceed in parallel."},{"text":"Stop rehabilitation until diagnosis","feedback":"Incorrect. Focused testing and support can proceed in parallel."}],"answer":1,"critical":false,"sourceIds":["PCNA05","IN06"]}]},{"id":16,"title":"PCNA 6 · Seizures","subtitle":"Recognise treatable metabolic epilepsies and collect the right evidence.","minutes":18,"outcomes":["Recognise seizure patterns that suggest IEM.","Differentiate glycine, serine and cofactor pathways.","Explain why diagnosis and treatment may proceed together."],"sections":[{"id":"16a","title":"When seizures become a metabolic question","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Consider IEM especially in neonatal seizures, refractory epilepsy, episodic encephalopathy, developmental regression, abnormal movements, dysmorphism or a biochemical disturbance. Stabilise the child and evaluate common structural, infectious and electrolyte causes in parallel."],"points":["A treatable possibility raises urgency without proving metabolic epilepsy."],"sourceIds":["PCNA06"]},{"id":"16b","title":"Glycine and serine phenotypes","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Glycine encephalopathy often presents neonatally with encephalopathy, hypotonia, apnoea and seizures; paired CSF and plasma glycine informs diagnosis. Serine biosynthesis defects may cause congenital microcephaly, severe developmental impairment and seizures."],"points":["The CSF-to-plasma relationship needs correctly paired samples and specialist interpretation."],"sourceIds":["PCNA06"]},{"id":"16c","title":"Cofactor-responsive epilepsies","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Pyridoxine-dependent epilepsy and pyridoxal-phosphate-responsive epilepsy are key treatable considerations in early refractory seizures. Folate-related and other cofactor disorders can overlap clinically. Any diagnostic treatment trial requires a monitored protocol because response, safety and confirmatory tests matter."],"points":["Do not conduct an unsupervised vitamin trial."],"sourceIds":["PCNA06"]},{"id":"16d","title":"Other energy and neurotransmitter causes","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["GLUT1 deficiency, creatine disorders, mitochondrial disease and several other IEMs may present with epilepsy. Clues include fasting or exercise relationship, movement disorder, episodic worsening, lactate abnormalities, or a characteristic imaging/metabolic profile."],"points":["Build a phenotype table before ordering a broad test."],"sourceIds":["PCNA06","PCNA05"]},{"id":"16e","title":"Plan samples before lumbar puncture","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["If CSF neurotransmitter, glycine or other specialised studies are considered, contact the receiving laboratory before lumbar puncture about tubes, order, fractions, paired blood, freezing and transport. In India these tests may require referral laboratories."],"points":["Procedure timing and sample handling are part of diagnostic accuracy."],"sourceIds":["PCNA06","IN03"]}],"takeaway":"In neonatal or refractory seizures, look for treatable metabolic patterns while common causes and stabilisation remain active.","evaluation":[{"id":"lc16-1","stem":"Which seizure presentation most strongly raises a treatable IEM concern?","options":[{"text":"Refractory neonatal seizures with encephalopathy","feedback":"Correct. Age, refractoriness and encephalopathy are high-value clues."},{"text":"A single simple febrile seizure in a thriving child","feedback":"Incorrect. Age, refractoriness and encephalopathy are high-value clues."},{"text":"A resolved breath-holding spell","feedback":"Incorrect. Age, refractoriness and encephalopathy are high-value clues."},{"text":"Normal sleep movement","feedback":"Incorrect. Age, refractoriness and encephalopathy are high-value clues."}],"answer":0,"critical":true,"sourceIds":["PCNA06"]},{"id":"lc16-2","stem":"Which investigation supports glycine encephalopathy?","options":[{"text":"Urine glucose alone","feedback":"Incorrect. The CSF-to-plasma relationship is central to biochemical evaluation."},{"text":"Bone age","feedback":"Incorrect. The CSF-to-plasma relationship is central to biochemical evaluation."},{"text":"Serum cholesterol alone","feedback":"Incorrect. The CSF-to-plasma relationship is central to biochemical evaluation."},{"text":"Correctly paired CSF and plasma glycine","feedback":"Correct. The CSF-to-plasma relationship is central to biochemical evaluation."}],"answer":3,"critical":false,"sourceIds":["PCNA06"]},{"id":"lc16-3","stem":"How should a cofactor-responsive epilepsy trial be approached?","options":[{"text":"Only after years of seizures","feedback":"Incorrect. Safety and diagnostic interpretation require a protocol."},{"text":"As proof from response alone","feedback":"Incorrect. Safety and diagnostic interpretation require a protocol."},{"text":"Through a monitored specialist protocol with confirmatory evaluation","feedback":"Correct. Safety and diagnostic interpretation require a protocol."},{"text":"As an unobserved home challenge","feedback":"Incorrect. Safety and diagnostic interpretation require a protocol."}],"answer":2,"critical":true,"sourceIds":["PCNA06"]},{"id":"lc16-4","stem":"Microcephaly, severe developmental impairment and seizures can suggest which pathway?","options":[{"text":"Peroxisomal beta oxidation only","feedback":"Incorrect. This constellation is recognised in serine biosynthesis defects."},{"text":"Serine biosynthesis","feedback":"Correct. This constellation is recognised in serine biosynthesis defects."},{"text":"Urea production alone","feedback":"Incorrect. This constellation is recognised in serine biosynthesis defects."},{"text":"Galactose elimination only","feedback":"Incorrect. This constellation is recognised in serine biosynthesis defects."}],"answer":1,"critical":false,"sourceIds":["PCNA06"]},{"id":"lc16-5","stem":"Before specialised CSF studies, what is essential?","options":[{"text":"Confirm sampling and handling with the receiving laboratory","feedback":"Correct. Pre-agreed handling protects a scarce and invasive sample."},{"text":"Use any available container","feedback":"Incorrect. Pre-agreed handling protects a scarce and invasive sample."},{"text":"Collect without paired blood regardless of protocol","feedback":"Incorrect. Pre-agreed handling protects a scarce and invasive sample."},{"text":"Keep every fraction at room temperature for days","feedback":"Incorrect. Pre-agreed handling protects a scarce and invasive sample."}],"answer":0,"critical":false,"sourceIds":["PCNA06","IN03"]}]},{"id":17,"title":"PCNA 7 · Movement disorders","subtitle":"Describe the movement first, then connect metal and neurotransmitter pathways.","minutes":18,"outcomes":["Describe paediatric movement phenomenology.","Recognise metal-transport and neurotransmitter clues.","Plan specialist biochemical sampling."],"sections":[{"id":"17a","title":"Name the movement before the disease","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Distinguish dystonia, chorea, myoclonus, tremor, tics, stereotypies, ataxia and parkinsonism. Video with consent and a careful neurological examination can improve description. Ask whether the movement is episodic, task-related, diurnal, medication-related or associated with regression."],"points":["“Abnormal movements” is a starting phrase, not a phenotype."],"sourceIds":["PCNA07"]},{"id":"17b","title":"Metal disorders are multisystem clues","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Wilson disease can combine hepatic, psychiatric and movement features. Disorders of copper or manganese transport and iron handling produce different combinations of dystonia, parkinsonism, liver disease, skin/hair findings or characteristic imaging."],"points":["Choose tests from the whole phenotype, not the movement alone."],"sourceIds":["PCNA07"]},{"id":"17c","title":"Neurotransmitter disorders can fluctuate","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Monoamine and amino-acid neurotransmitter disorders may present with dystonia, oculogyric crises, hypotonia, autonomic features, seizures and developmental delay. Diurnal variation or a striking treatment response can be informative but is not diagnostic by itself."],"points":["Record medications and the exact time course."],"sourceIds":["PCNA07"]},{"id":"17d","title":"CSF has a strict protocol","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["CSF neurotransmitter metabolites are affected by fraction, collection order, blood contamination, freezing and transport. Interpretation requires age-specific reference data and clinical context. Genetic testing may follow or accompany biochemical investigation."],"points":["Never improvise a specialised CSF collection."],"sourceIds":["PCNA07","IN03"]},{"id":"17e","title":"Build a feasible Indian pathway","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Begin with acquired causes, medication exposure, liver studies and accessible metabolic clues, then coordinate paediatric neurology, genetics and the referral laboratory. A diagnostic plan should specify who reviews imaging, who owns the result and how treatment decisions are escalated."],"points":["Referral quality matters as much as test selection."],"sourceIds":["PCNA07","CP04"]}],"takeaway":"Precise phenomenology and associated organ clues determine which metabolic pathway and specimen are worth pursuing.","evaluation":[{"id":"lc17-1","stem":"What is the best first diagnostic step for an unexplained movement disorder?","options":[{"text":"Name Wilson disease immediately","feedback":"Incorrect. Phenomenology organises the differential and next observations."},{"text":"Order every genetic test","feedback":"Incorrect. Phenomenology organises the differential and next observations."},{"text":"Assume a behavioural cause","feedback":"Incorrect. Phenomenology organises the differential and next observations."},{"text":"Describe the movement phenomenology and time course accurately","feedback":"Correct. Phenomenology organises the differential and next observations."}],"answer":3,"critical":true,"sourceIds":["PCNA07"]},{"id":"lc17-2","stem":"Movement disorder with liver disease particularly raises concern for which category?","options":[{"text":"Simple febrile seizure","feedback":"Incorrect. The organ combination makes copper metabolism a priority differential."},{"text":"Glycogen storage disease is proven","feedback":"Incorrect. The organ combination makes copper metabolism a priority differential."},{"text":"A metal-transport disorder such as Wilson disease","feedback":"Correct. The organ combination makes copper metabolism a priority differential."},{"text":"Isolated creatine transporter disease only","feedback":"Incorrect. The organ combination makes copper metabolism a priority differential."}],"answer":2,"critical":false,"sourceIds":["PCNA07"]},{"id":"lc17-3","stem":"Dystonia, oculogyric crises and diurnal fluctuation suggest investigation of what?","options":[{"text":"Urea production is confirmed","feedback":"Incorrect. This pattern can occur in monoamine neurotransmitter disorders."},{"text":"Neurotransmitter metabolism","feedback":"Correct. This pattern can occur in monoamine neurotransmitter disorders."},{"text":"Only bone mineralisation","feedback":"Incorrect. This pattern can occur in monoamine neurotransmitter disorders."},{"text":"Galactose metabolism alone","feedback":"Incorrect. This pattern can occur in monoamine neurotransmitter disorders."}],"answer":1,"critical":false,"sourceIds":["PCNA07"]},{"id":"lc17-4","stem":"Why is CSF neurotransmitter sampling protocol-sensitive?","options":[{"text":"Fraction, order, contamination and temperature affect interpretation","feedback":"Correct. Pre-analytical conditions can materially change results."},{"text":"The sample never changes","feedback":"Incorrect. Pre-analytical conditions can materially change results."},{"text":"Age-specific ranges are irrelevant","feedback":"Incorrect. Pre-analytical conditions can materially change results."},{"text":"Genetics replaces all handling needs","feedback":"Incorrect. Pre-analytical conditions can materially change results."}],"answer":0,"critical":false,"sourceIds":["PCNA07","IN03"]},{"id":"lc17-5","stem":"Which Indian pathway is most workable?","options":[{"text":"A test list without contacts","feedback":"Incorrect. A coordinated pathway converts recognition into action."},{"text":"Unsupervised empiric therapy","feedback":"Incorrect. A coordinated pathway converts recognition into action."},{"text":"Waiting for a full syndrome","feedback":"Incorrect. A coordinated pathway converts recognition into action."},{"text":"Defined neurology/genetics/laboratory roles with accessible first tests and referral ownership","feedback":"Correct. A coordinated pathway converts recognition into action."}],"answer":3,"critical":false,"sourceIds":["PCNA07","CP04"]}]},{"id":18,"title":"PCNA 8 · Myopathy and FAOD","subtitle":"Recognise fasting, illness and exercise as tests of muscle energy supply.","minutes":18,"outcomes":["Identify FAOD and carnitine-shuttle presentations.","Interpret muscle and cardiac clues together.","Plan prevention without unsafe provocation."],"sections":[{"id":"18a","title":"Triggers reveal the fuel problem","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Muscle pain, exercise intolerance, recurrent rhabdomyolysis, cardiomyopathy or sudden deterioration during fasting or illness should raise metabolic myopathy. Ask about exercise type and duration, last meal, fever, medications, dark urine and recovery between episodes."],"points":["Never provoke fasting or strenuous exercise to reproduce symptoms."],"sourceIds":["PCNA08"]},{"id":"18b","title":"FAOD phenotypes change with age","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Severe long-chain FAODs may present in infancy with cardiomyopathy, liver dysfunction, hypoglycaemia or sudden death. Later presentations may feature exercise- or illness-related myalgia and rhabdomyolysis. Medium-chain disorders more often present with fasting intolerance and hypoketotic hypoglycaemia."],"points":["One normal interval does not erase a trigger-linked history."],"sourceIds":["PCNA08"]},{"id":"18c","title":"Use the acute sample","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["During an episode, glucose, ketones, creatine kinase, liver tests, electrolytes, renal status, acylcarnitines and urine organic acids may be informative. Profiles can normalise between episodes or after treatment; interpret newborn-screening and genotype data with the phenotype."],"points":["Document clinical state and treatment at collection."],"sourceIds":["PCNA08"]},{"id":"18d","title":"Do not overlook heart and kidneys","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Cardiomyopathy or arrhythmia can dominate some FAOD and carnitine-shuttle disorders. Rhabdomyolysis threatens renal function and electrolyte stability. Acute assessment therefore extends beyond muscle symptoms."],"points":["Escalate cardiac or renal instability immediately."],"sourceIds":["PCNA08"]},{"id":"18e","title":"Prevention is individual","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Long-term management may address fasting avoidance, illness energy plans, exercise, dietary composition and condition-specific therapies. The prescription depends on the exact disorder, age and cardiac status. Families need a written plan feasible with their local food and emergency access."],"points":["Generic internet diets can be harmful."],"sourceIds":["PCNA08","IN01"]}],"takeaway":"Connect the trigger to the fuel pathway, capture the acute biochemical signal and assess heart, muscle and kidney together.","evaluation":[{"id":"lc18-1","stem":"Which history most suggests a metabolic myopathy?","options":[{"text":"Stable mild myopia","feedback":"Incorrect. Recurrent stress-triggered muscle breakdown is a core clue."},{"text":"A healed skin rash","feedback":"Incorrect. Recurrent stress-triggered muscle breakdown is a core clue."},{"text":"Recurrent rhabdomyolysis after prolonged exercise or illness","feedback":"Correct. Recurrent stress-triggered muscle breakdown is a core clue."},{"text":"One bruise after a fall","feedback":"Incorrect. Recurrent stress-triggered muscle breakdown is a core clue."}],"answer":2,"critical":true,"sourceIds":["PCNA08"]},{"id":"lc18-2","stem":"Hypoglycaemia with an inadequate ketone response prioritises which family?","options":[{"text":"CDG is confirmed","feedback":"Incorrect. Failure to generate ketones during fuel need suggests impaired fat utilisation or ketogenesis."},{"text":"Fatty-acid oxidation or ketogenesis disorder","feedback":"Correct. Failure to generate ketones during fuel need suggests impaired fat utilisation or ketogenesis."},{"text":"Lysosomal storage alone","feedback":"Incorrect. Failure to generate ketones during fuel need suggests impaired fat utilisation or ketogenesis."},{"text":"Purine overproduction only","feedback":"Incorrect. Failure to generate ketones during fuel need suggests impaired fat utilisation or ketogenesis."}],"answer":1,"critical":false,"sourceIds":["PCNA08"]},{"id":"lc18-3","stem":"Why collect acylcarnitines during illness when feasible?","options":[{"text":"The abnormal profile may be more apparent during metabolic stress","feedback":"Correct. Some biochemical signatures attenuate between episodes."},{"text":"Illness makes every result diagnostic","feedback":"Incorrect. Some biochemical signatures attenuate between episodes."},{"text":"Treatment never affects profiles","feedback":"Incorrect. Some biochemical signatures attenuate between episodes."},{"text":"Only urine matters","feedback":"Incorrect. Some biochemical signatures attenuate between episodes."}],"answer":0,"critical":false,"sourceIds":["PCNA08"]},{"id":"lc18-4","stem":"What must be assessed with rhabdomyolysis?","options":[{"text":"Hair colour only","feedback":"Incorrect. Muscle breakdown can cause acute kidney injury and dangerous electrolyte disturbance."},{"text":"Bone age only","feedback":"Incorrect. Muscle breakdown can cause acute kidney injury and dangerous electrolyte disturbance."},{"text":"Refraction only","feedback":"Incorrect. Muscle breakdown can cause acute kidney injury and dangerous electrolyte disturbance."},{"text":"Renal function and electrolytes","feedback":"Correct. Muscle breakdown can cause acute kidney injury and dangerous electrolyte disturbance."}],"answer":3,"critical":true,"sourceIds":["PCNA08"]},{"id":"lc18-5","stem":"What is the safest prevention advice?","options":[{"text":"Perform a home fasting test","feedback":"Incorrect. The exact FAOD and child determine safe management."},{"text":"Copy another disorder’s prescription","feedback":"Incorrect. The exact FAOD and child determine safe management."},{"text":"Use an individual metabolic/dietetic illness and activity plan","feedback":"Correct. The exact FAOD and child determine safe management."},{"text":"Avoid all fat for every child","feedback":"Incorrect. The exact FAOD and child determine safe management."}],"answer":2,"critical":false,"sourceIds":["PCNA08","IN01"]}]},{"id":19,"title":"PCNA 9 · Hepatopathy","subtitle":"Use food exposure, liver pattern and age to separate galactose, fructose and tyrosine disorders.","minutes":18,"outcomes":["Recognise metabolic liver red flags.","Differentiate three diet-linked pathways.","Coordinate urgent and confirmatory care."],"sections":[{"id":"19a","title":"Read the liver phenotype","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["IEM can cause neonatal cholestasis, acute liver failure, steatosis, hepatomegaly, coagulopathy or chronic disease. Ask about feed type, introduction of fruit or sucrose, vomiting, hypoglycaemia, renal tubular signs, sepsis and growth."],"points":["Age at exposure can be a diagnostic clue."],"sourceIds":["PCNA09"]},{"id":"19b","title":"Classic galactosaemia","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["A newborn may deteriorate after lactose exposure with poor feeding, jaundice, liver dysfunction, bleeding or E. coli sepsis. When classic galactosaemia is a serious possibility, urgent specialist-directed removal of galactose/lactose exposure proceeds alongside sepsis care and diagnostic sampling."],"points":["Infection and metabolic liver disease can coexist."],"sourceIds":["PCNA09"]},{"id":"19c","title":"Hereditary fructose intolerance","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Symptoms begin after fructose, sucrose or sorbitol enters the diet and can include vomiting, hypoglycaemia, liver or renal dysfunction and aversion to sweet foods. The exposure history is crucial. A deliberate fructose challenge is unsafe."],"points":["Ask exactly when complementary foods and sweet medicines began."],"sourceIds":["PCNA09"]},{"id":"19d","title":"Tyrosinaemia type I","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Tyrosinaemia type I can produce liver failure, renal tubular dysfunction, rickets and neurological crises, with hepatocellular carcinoma risk. Succinylacetone is a key marker. Early diagnosis and specialist treatment change prognosis."],"points":["Tyrosine elevation alone is not specific for type I."],"sourceIds":["PCNA09"]},{"id":"19e","title":"Act within a shared pathway","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["In India, coordinate paediatrics, hepatology, metabolic genetics, nutrition, infection care and a laboratory able to perform confirmatory testing. Give the family a precise interim feeding plan only through the treating team; avoid broad eliminations that compromise nutrition."],"points":["Urgent care and diagnostic confirmation must remain connected."],"sourceIds":["PCNA09","CP04"]}],"takeaway":"In paediatric liver disease, age and food exposure often reveal the pathway—while sepsis and liver failure still demand immediate care.","evaluation":[{"id":"lc19-1","stem":"A neonate has jaundice, coagulopathy and E. coli sepsis after milk feeds. What is best?","options":[{"text":"Diagnose HFI","feedback":"Incorrect. Classic galactosaemia may coexist with E. coli sepsis and hepatic disease."},{"text":"Treat sepsis and urgently consider galactosaemia in parallel","feedback":"Correct. Classic galactosaemia may coexist with E. coli sepsis and hepatic disease."},{"text":"The culture excludes IEM","feedback":"Incorrect. Classic galactosaemia may coexist with E. coli sepsis and hepatic disease."},{"text":"Wait for chronic liver disease","feedback":"Incorrect. Classic galactosaemia may coexist with E. coli sepsis and hepatic disease."}],"answer":1,"critical":true,"sourceIds":["PCNA09"]},{"id":"lc19-2","stem":"Symptoms beginning after fruit and sucrose introduction suggest what?","options":[{"text":"Hereditary fructose intolerance","feedback":"Correct. The exposure-linked onset is a defining clue for HFI."},{"text":"Classic galactosaemia is proven","feedback":"Incorrect. The exposure-linked onset is a defining clue for HFI."},{"text":"A urea-cycle disorder only","feedback":"Incorrect. The exposure-linked onset is a defining clue for HFI."},{"text":"Lysosomal storage alone","feedback":"Incorrect. The exposure-linked onset is a defining clue for HFI."}],"answer":0,"critical":false,"sourceIds":["PCNA09"]},{"id":"lc19-3","stem":"Which diagnostic action should be avoided in suspected HFI?","options":[{"text":"A careful diet history","feedback":"Incorrect. Provocation can cause severe metabolic decompensation."},{"text":"Specialist genetic evaluation","feedback":"Incorrect. Provocation can cause severe metabolic decompensation."},{"text":"Liver and renal assessment","feedback":"Incorrect. Provocation can cause severe metabolic decompensation."},{"text":"A deliberate fructose challenge","feedback":"Correct. Provocation can cause severe metabolic decompensation."}],"answer":3,"critical":true,"sourceIds":["PCNA09"]},{"id":"lc19-4","stem":"Which marker is especially important for tyrosinaemia type I?","options":[{"text":"Urine ketones alone","feedback":"Incorrect. Succinylacetone is a key disease marker; tyrosine alone is nonspecific."},{"text":"CSF glycine","feedback":"Incorrect. Succinylacetone is a key disease marker; tyrosine alone is nonspecific."},{"text":"Succinylacetone","feedback":"Correct. Succinylacetone is a key disease marker; tyrosine alone is nonspecific."},{"text":"Total cholesterol alone","feedback":"Incorrect. Succinylacetone is a key disease marker; tyrosine alone is nonspecific."}],"answer":2,"critical":false,"sourceIds":["PCNA09"]},{"id":"lc19-5","stem":"What is safest while diagnosis is being confirmed?","options":[{"text":"Delay clinical care for sequencing","feedback":"Incorrect. Interim nutrition must address the suspected pathway without neglecting acute illness."},{"text":"A treating-team feeding plan plus urgent liver/sepsis care","feedback":"Correct. Interim nutrition must address the suspected pathway without neglecting acute illness."},{"text":"Eliminate all macronutrients","feedback":"Incorrect. Interim nutrition must address the suspected pathway without neglecting acute illness."},{"text":"Copy an online diet","feedback":"Incorrect. Interim nutrition must address the suspected pathway without neglecting acute illness."}],"answer":1,"critical":false,"sourceIds":["PCNA09"]}]},{"id":20,"title":"PCNA 10 · Lysosomes and peroxisomes","subtitle":"Recognise progressive multisystem disease caused by complex-molecule handling.","minutes":19,"outcomes":["Contrast lysosomal and peroxisomal disease.","Recognise high-yield organ combinations.","Select biochemical and genetic confirmation."],"sections":[{"id":"20a","title":"Two organelles, overlapping multisystem disease","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Lysosomes degrade and recycle macromolecules; lysosomal dysfunction causes substrate accumulation. Peroxisomes support very-long-chain fatty-acid metabolism and other pathways; biogenesis or single-enzyme defects create broad phenotypes. Both groups can involve brain, liver, skeleton, eye and other organs."],"points":["Use mechanism to explain progression and multisystem involvement."],"sourceIds":["PCNA10"]},{"id":"20b","title":"Recognise lysosomal storage patterns","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Organomegaly, coarse or changing facial features, skeletal disease, joint limitation, eye findings, hearing loss, neuroregression or cardiopulmonary disease may occur in different lysosomal disorders. Not every disorder has every feature, and some are primarily neurological."],"points":["Serial photographs and growth/development records may reveal evolution, with consent."],"sourceIds":["PCNA10"]},{"id":"20c","title":"Recognise peroxisomal patterns","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Peroxisomal biogenesis disorders may combine neonatal hypotonia, seizures, craniofacial features, neuronal migration abnormalities, liver disease, retinal or hearing impairment and skeletal findings. X-linked adrenoleukodystrophy and single-enzyme disorders can present differently."],"points":["Very-long-chain fatty acids answer a pathway question, not every peroxisomal diagnosis."],"sourceIds":["PCNA10"]},{"id":"20d","title":"Test the suspected pathway","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Enzyme activity, lysosomal biomarkers, very-long-chain fatty acids, plasmalogens, bile-acid intermediates and molecular testing are selected according to phenotype. Pseudodeficiency, carrier ranges and secondary abnormalities can complicate interpretation."],"points":["Confirm a positive screen before attaching prognosis."],"sourceIds":["PCNA10"]},{"id":"20e","title":"Diagnosis opens several care pathways","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Some disorders have enzyme replacement, substrate reduction, transplant or other disease-specific options; many still require coordinated supportive care. Availability, timing and eligibility vary in India. Link diagnosis to organ surveillance, rehabilitation, counselling and a verified centre."],"points":["Do not equate “therapy exists” with access or suitability for one child."],"sourceIds":["PCNA10","CP03","CP04"]}],"takeaway":"Progressive multisystem clues should trigger organelle-based reasoning and a pathway-specific confirmation plan.","evaluation":[{"id":"lc20-1","stem":"What is the core mechanism of lysosomal storage disease?","options":[{"text":"Failure of macromolecule degradation with intracellular accumulation","feedback":"Correct. Lysosomal dysfunction causes stored substrate and progressive cellular injury."},{"text":"Excess urea formation","feedback":"Incorrect. Lysosomal dysfunction causes stored substrate and progressive cellular injury."},{"text":"Only low glucose","feedback":"Incorrect. Lysosomal dysfunction causes stored substrate and progressive cellular injury."},{"text":"A single neurotransmitter change in every case","feedback":"Incorrect. Lysosomal dysfunction causes stored substrate and progressive cellular injury."}],"answer":0,"critical":false,"sourceIds":["PCNA10"]},{"id":"lc20-2","stem":"Which combination suggests a lysosomal disorder?","options":[{"text":"Isolated short viral fever","feedback":"Incorrect. The progressive multisystem combination is a high-value clue."},{"text":"A simple fracture with normal development","feedback":"Incorrect. The progressive multisystem combination is a high-value clue."},{"text":"Transient conjunctivitis","feedback":"Incorrect. The progressive multisystem combination is a high-value clue."},{"text":"Organomegaly, skeletal change and neuroregression","feedback":"Correct. The progressive multisystem combination is a high-value clue."}],"answer":3,"critical":true,"sourceIds":["PCNA10"]},{"id":"lc20-3","stem":"Which test commonly begins evaluation of a peroxisomal pathway?","options":[{"text":"CSF glycine only","feedback":"Incorrect. VLCFA analysis is a key biochemical entry point for several peroxisomal disorders."},{"text":"HbA1c alone","feedback":"Incorrect. VLCFA analysis is a key biochemical entry point for several peroxisomal disorders."},{"text":"Very-long-chain fatty acids interpreted with phenotype","feedback":"Correct. VLCFA analysis is a key biochemical entry point for several peroxisomal disorders."},{"text":"Serum sodium alone","feedback":"Incorrect. VLCFA analysis is a key biochemical entry point for several peroxisomal disorders."}],"answer":2,"critical":false,"sourceIds":["PCNA10"]},{"id":"lc20-4","stem":"Why must a positive biochemical screen be confirmed?","options":[{"text":"Phenotype is irrelevant","feedback":"Incorrect. Confirmation protects diagnosis, prognosis and family counselling."},{"text":"Some markers overlap, and pseudodeficiency or secondary change may occur","feedback":"Correct. Confirmation protects diagnosis, prognosis and family counselling."},{"text":"All screens are diagnoses","feedback":"Incorrect. Confirmation protects diagnosis, prognosis and family counselling."},{"text":"Confirmation never changes counselling","feedback":"Incorrect. Confirmation protects diagnosis, prognosis and family counselling."}],"answer":1,"critical":false,"sourceIds":["PCNA10"]},{"id":"lc20-5","stem":"What should follow a confirmed storage diagnosis?","options":[{"text":"Disease-specific eligibility review plus coordinated organ surveillance and support","feedback":"Correct. Treatment and surveillance depend on disease, stage, eligibility and access."},{"text":"Promise a cure","feedback":"Incorrect. Treatment and surveillance depend on disease, stage, eligibility and access."},{"text":"Stop rehabilitation","feedback":"Incorrect. Treatment and surveillance depend on disease, stage, eligibility and access."},{"text":"Assume every therapy is locally available","feedback":"Incorrect. Treatment and surveillance depend on disease, stage, eligibility and access."}],"answer":0,"critical":false,"sourceIds":["PCNA10","CP04"]}]},{"id":21,"title":"PCNA 11 · CDG or mitochondrial disease?","subtitle":"Use discriminating clues when two multisystem disease families overlap.","minutes":20,"outcomes":["Explain why CDG and mitochondrial disease overlap.","Identify features that shift probability.","Choose a modern, integrated diagnostic strategy."],"sections":[{"id":"21a","title":"Start with the overlap","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Both congenital disorders of glycosylation and mitochondrial disorders can cause developmental delay, hypotonia, seizures, ataxia, growth failure and multiorgan disease. The overlap is real; the task is to identify features that change probability and choose tests that can resolve uncertainty."],"points":["Avoid declaring either family from lactate or hypotonia alone."],"sourceIds":["PCNA11"]},{"id":"21b","title":"Clues that favour CDG","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Combined abnormalities of procoagulant and anticoagulant factors, unusual fat distribution, inverted nipples and certain congenital malformations support CDG. Endocrine, hepatic and gastrointestinal abnormalities can coexist. Transferrin glycoform analysis is a useful screen for many N-linked CDG, but it does not cover every glycosylation disorder."],"points":["A normal transferrin result does not exclude all CDG."],"sourceIds":["PCNA11"]},{"id":"21c","title":"Clues that favour mitochondrial disease","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["High-energy tissues dominate: brain, muscle, heart and liver. Regression, ophthalmoplegia, ptosis, myopathy, cardiomyopathy, rhythm disturbance, diabetes with sensorineural deafness, Leigh-pattern imaging or stroke-like episodes can be informative. Lactate may be normal or secondarily elevated."],"points":["Interpret lactate with perfusion, collection and the wider phenotype."],"sourceIds":["PCNA11"]},{"id":"21d","title":"Genetics is more than one inheritance pattern","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Mitochondrial disease may arise from mtDNA or nuclear DNA; heteroplasmy, threshold effects and tissue distribution shape phenotype. CDG is genetically heterogeneous, and some defects disturb both mitochondrial and glycosylation biology. Modern sequencing may reduce invasive testing, but biochemical and phenotypic correlation remain necessary."],"points":["A negative blood mtDNA result may not answer every tissue-specific question."],"sourceIds":["PCNA11"]},{"id":"21e","title":"Build a convergence table","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["List each organ finding, time course, biochemical result, imaging feature and inheritance clue. Mark whether it supports CDG, mitochondrial disease, both or an alternative. Coordinate targeted biochemical screens and genomic testing through an experienced Indian centre."],"points":["Faculty task: reward calibrated uncertainty and a discriminating next test."],"sourceIds":["PCNA11","CP04"]}],"takeaway":"When phenotypes overlap, combine discriminating signs, pathway tests and genomic evidence instead of relying on one hallmark.","evaluation":[{"id":"lc21-1","stem":"Which finding particularly supports a CDG evaluation?","options":[{"text":"Isolated lactate after shock","feedback":"Incorrect. Complex coagulation abnormalities are a useful discriminator for CDG."},{"text":"A single febrile seizure","feedback":"Incorrect. Complex coagulation abnormalities are a useful discriminator for CDG."},{"text":"Simple iron deficiency","feedback":"Incorrect. Complex coagulation abnormalities are a useful discriminator for CDG."},{"text":"Combined procoagulant and anticoagulant abnormalities","feedback":"Correct. Complex coagulation abnormalities are a useful discriminator for CDG."}],"answer":3,"critical":true,"sourceIds":["PCNA11"]},{"id":"lc21-2","stem":"Diabetes with sensorineural deafness more strongly favours which family?","options":[{"text":"Organic acidaemia only","feedback":"Incorrect. This combination is a recognised mitochondrial clue, though confirmation remains necessary."},{"text":"Urea-cycle disorder","feedback":"Incorrect. This combination is a recognised mitochondrial clue, though confirmation remains necessary."},{"text":"Mitochondrial disease","feedback":"Correct. This combination is a recognised mitochondrial clue, though confirmation remains necessary."},{"text":"CDG in every case","feedback":"Incorrect. This combination is a recognised mitochondrial clue, though confirmation remains necessary."}],"answer":2,"critical":false,"sourceIds":["PCNA11"]},{"id":"lc21-3","stem":"What does an elevated lactate prove?","options":[{"text":"A specific mtDNA variant","feedback":"Incorrect. Lactate is neither sensitive nor specific enough to stand alone."},{"text":"Nothing by itself; interpret physiology, collection and phenotype","feedback":"Correct. Lactate is neither sensitive nor specific enough to stand alone."},{"text":"Mitochondrial disease with certainty","feedback":"Incorrect. Lactate is neither sensitive nor specific enough to stand alone."},{"text":"CDG is excluded","feedback":"Incorrect. Lactate is neither sensitive nor specific enough to stand alone."}],"answer":1,"critical":false,"sourceIds":["PCNA11"]},{"id":"lc21-4","stem":"Why can mitochondrial genetics be complex?","options":[{"text":"Disease can involve mtDNA or nuclear DNA, with heteroplasmy and tissue effects","feedback":"Correct. Dual genomes and heteroplasmy create variable inheritance and detection."},{"text":"Mitochondria have no genes","feedback":"Incorrect. Dual genomes and heteroplasmy create variable inheritance and detection."},{"text":"Inheritance is always autosomal recessive","feedback":"Incorrect. Dual genomes and heteroplasmy create variable inheritance and detection."},{"text":"Blood always captures every variant","feedback":"Incorrect. Dual genomes and heteroplasmy create variable inheritance and detection."}],"answer":0,"critical":false,"sourceIds":["PCNA11"]},{"id":"lc21-5","stem":"What is the be
