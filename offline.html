<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Learn a practical approach to a child with an inborn error of metabolism. Customise your UG, PG or faculty learning path with Indian clinical cases."><title>The Metabolic Child · Clinical learning</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23233043'/%3E%3Cpath d='M8 22V10l8 8 8-8v12' fill='none' stroke='%23ffbd88' stroke-width='3'/%3E%3C/svg%3E"><style>:root{--ink:#233043;--muted:#65717d;--paper:#fbfaf7;--white:#fff;--line:#dedfdc;--accent:#b34d2f;--peach:#ffbd88;--green:#22695b;--soft:#eaf2ef;--blue:#eaf0f7;--gold:#fbf0d6;--radius:17px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer}a{color:#955033;text-underline-offset:3px}a:hover{text-decoration-thickness:2px}button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #b55a32;outline-offset:3px}button:disabled{cursor:default;opacity:.5}button{border:0}.skip{position:fixed;top:-70px;left:18px;padding:12px;background:white;z-index:99}.skip:focus{top:10px}.sidebar{width:256px;position:fixed;inset:0 auto 0 0;background:var(--ink);color:#fff;padding:28px 20px;overflow:auto;z-index:10}.brand{font-weight:700;font-size:21px;letter-spacing:-.7px;line-height:1.1;margin:0 10px 6px}.brand b{color:var(--peach)}.brand-sub{color:#bfc9d4;font-size:11px;text-transform:uppercase;letter-spacing:1.8px;margin:12px 10px 32px}.nav-label{font-size:10px;font-weight:bold;letter-spacing:1.7px;color:#aebdcc;padding:20px 12px 8px;text-transform:uppercase}.nav{display:flex;align-items:center; </style></head><body><a class="skip" href="#main">Skip to learning</a><div id="app"></div><script>window.COURSE={"version":"1.0","checkedOn":"2026-09-11","lessons":[{"id":1,"title":"Could this be metabolic?","subtitle":"Recognise a pattern that deserves an urgent second look.","minutes":10,"outcomes":["Identify a concerning illness trajectory.","Explain why an absent family history does not exclude IEM.","Give a focused, supervised escalation."],"sections":[{"id":"1a","title":"Begin with the trajectory","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Inborn errors of metabolism (IEMs) affect the body's processing, transport or storage of substances. Ask: does the course fit the working diagnosis? Consider unexplained encephalopathy, recurrent deterioration or several organ systems becoming involved. Vomiting alone is common; vomiting with altered consciousness and an unusual biochemical pattern deserves a different level of attention."],"points":["Pause: describe what changed, when it changed and what remains unexplained."],"sourceIds":["GL03"]},{"id":"1b","title":"Notice the trigger","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Fictional case: Meera, aged 18 months, becomes unusually drowsy during a vomiting illness after taking little food. A previous similar admission ended without a diagnosis. Infection and reduced intake can expose an energy-production problem. MCAD deficiency is one example of a fatty-acid oxidation disorder in which illness or fasting may precede hypoglycaemia with an inadequate ketone response. This example does not establish Meera's diagnosis."],"points":["Ask about the last normal meal and similar episodes; never provoke fasting to reproduce symptoms."],"sourceIds":["GL05"]},{"id":"1c","title":"Take a family story without blame","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Ask sensitively about unexplained childhood deaths, affected relatives and parental relatedness. Many children have no recognised family history. Say: 'Inherited conditions can occur even when everyone else seems well.' Record what is uncertain. An MBBS learner should present findings to the supervising clinician and assist within their assigned role."],"points":["Practise replacing 'no family history, so unlikely' with a precise account of what was asked."],"sourceIds":["GL03"]},{"id":"1d","title":"Keep two explanations open","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["A positive infection result need not explain everything. Classic galactosaemia can present with liver dysfunction and bacterial sepsis, including E. coli infection. Thus, sepsis and an inherited disorder may coexist. For a neonate with infection plus unexplained jaundice, bleeding or persistent liver dysfunction, discuss whether a second process requires investigation while infection care continues."],"points":["PG reasoning: state which finding your current diagnosis explains least well."],"sourceIds":["E04"]},{"id":"1e","title":"Make the concern actionable","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Try this handover: 'Meera is drowsy after poor intake, with a similar previous episode. I am concerned about a metabolic or endocrine cause alongside infection. She needs urgent senior assessment.' Faculty can ask learners to separate facts from hypotheses and explain the next safe action. Assess recognition and communication, as well as diagnostic knowledge."],"points":["Reflect: which detail would you put in the first sentence of your referral?"],"sourceIds":[]}],"takeaway":"Recognise the unusual course, keep alternatives open and escalate a concrete concern.","check":{"id":"lc1","stem":"Meera has recurrent illness-related drowsiness and no known affected relatives. What is the best next approach?","options":[{"text":"Escalate urgently and investigate metabolic or endocrine causes alongside the current illness.","feedback":"Correct. Recurrent deterioration needs explanation; a negative family history cannot exclude an inherited disorder."},{"text":"Reassure because inherited disorders always affect another relative.","feedback":"Incorrect. The family may have no recognised previous case."},{"text":"Wait for another episode before assessing the pattern.","feedback":"Incorrect. The current altered consciousness requires prompt assessment."},{"text":"Diagnose MCAD deficiency from the history alone.","feedback":"Incorrect. The history raises a possibility; biochemical and confirmatory evaluation are still needed."}],"answer":0,"critical":true,"sourceIds":["GL03","GL05"]}},{"id":2,"title":"The sick neonate","subtitle":"Investigate infection and metabolic disease in parallel.","minutes":12,"outcomes":["Recognise an initially well newborn who deteriorates.","Prioritise assessment and first-line tests.","Avoid false reassurance from a pending newborn screen."],"sections":[{"id":"2a","title":"A well start can precede illness","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Fictional case: Aarav fed normally after an uncomplicated birth. On day four he has a weak suck, increasing sleepiness and rapid breathing. Some severe urea-cycle disorders become apparent after birth as ammonia accumulates. Other IEMs can follow a similar early course. An initially well interval is a clue to retain, not proof of a metabolic diagnosis."],"points":["Write the timeline: birth, normal feeds, first change and present condition."],"sourceIds":["GL04"]},{"id":"2b","title":"Assess the baby before the label","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["A neonate who is difficult to wake, feeds poorly or has abnormal breathing needs prompt senior assessment. Fever can be absent in serious infection. Assess airway, breathing, circulation, neurological state, temperature and glucose while considering infection, cardiac disease, surgical illness and endocrine causes."],"points":["UG action: call the supervising clinician and assist with observation and documentation."],"sourceIds":["E06"]},{"id":"2c","title":"Run the first investigations in parallel","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["The supervised initial work-up commonly brings together bedside glucose, blood gas, lactate, ammonia and ketone assessment, with blood counts, electrolytes, liver tests and infection investigations according to presentation. Arrange collection with the laboratory. Do not postpone stabilisation for a complete sample set. Sepsis evaluation and indicated treatment proceed alongside metabolic investigation; no trial of waiting for antibiotic response is required."],"points":["A pending or reported normal newborn screen does not replace assessment of a symptomatic baby."],"sourceIds":["IN01","GL03"]},{"id":"2d","title":"Let a new finding broaden the differential","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Consider a separate teaching vignette: a newborn with poor feeding, jaundice and bleeding. A culture later identifies E. coli. Classic galactosaemia belongs in the differential because sepsis and hepatic involvement may occur together. This does not mean every infected or jaundiced infant has galactosaemia. The team integrates examination, laboratory results and specialist advice to choose confirmatory investigations."],"points":["Explain why a positive culture may answer only part of the case."],"sourceIds":["E04"]},{"id":"2e","title":"Do not wait for a signature sign","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Good to Know"},"paragraphs":["MSUD can also produce neonatal feeding difficulty followed by encephalopathy. Specialist amino-acid testing, including alloisoleucine, helps investigate that possibility. A characteristic odour should never become an entry requirement for assessment. Ask which information changes urgency and which information refines diagnosis: these are related but different questions."],"points":["Aarav's deterioration establishes urgency before the diagnosis."],"sourceIds":["E05"]}],"takeaway":"An unexplained sick neonate needs immediate assessment, with sepsis and metabolic pathways running together.","check":{"id":"lc2","stem":"Aarav is deteriorating, antibiotics have just started and his screening result is pending. What should happen next?","options":[{"text":"Review for IEM only if antibiotics fail over the next two days.","feedback":"Incorrect. Progressive illness already warrants concurrent assessment; a waiting period risks delay."},{"text":"Continue stabilisation and sepsis care while arranging urgent metabolic tests and specialist discussion.","feedback":"Correct. The clinical trajectory justifies parallel investigation and early escalation."},{"text":"Wait for the newborn screen before requesting ammonia.","feedback":"Incorrect. Severe illness can develop before screening results, and screening does not detect every IEM."},{"text":"Exclude infection because there was a symptom-free interval.","feedback":"Incorrect. The timing is a clue, not a test that rules infection out."}],"answer":1,"critical":true,"sourceIds":["IN01","GL03","E06"]}},{"id":3,"title":"Read the metabolic pattern","subtitle":"Use biochemistry to direct the next question, without declaring a diagnosis.","minutes":12,"outcomes":["Combine acid–base state, glucose, ketones, lactate and ammonia.","Name a provisional disease family.","Identify a result needing urgent verification and escalation."],"sections":[{"id":"3a","title":"High ammonia with respiratory alkalosis","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Fictional learning results for Aarav: blood-gas pH 7.49, carbon dioxide 27 mmHg and bicarbonate 20 mmol/L, alongside ammonia flagged urgently high by the laboratory. The gas supports respiratory alkalosis. In this clinical setting a urea-cycle disorder is a concern, but the pattern is not confirmation. Hyperventilation can accompany hyperammonaemic brain dysfunction."],"points":["State both conclusions: 'urgent hyperammonaemia' and 'a provisional differential that includes a urea-cycle disorder'."],"sourceIds":["GL04"]},{"id":"3b","title":"Acidosis with ketones","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["A second fictional infant has metabolic acidosis, an increased anion gap, ketones and raised ammonia. Organic acidaemias belong in the differential; isolated methylmalonic acidaemia is one example. An anion gap reflects unmeasured ions, not a disease label. Interpret it using the laboratory's method and reference interval, and consider other causes of acidosis."],"points":["Specialised metabolite and confirmatory tests distinguish related disorders; a pattern table cannot."],"sourceIds":["GL06"]},{"id":"3c","title":"Low glucose with too few ketones","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["During low glucose, interpret ketones in relation to fasting, illness and treatment already received. Inappropriately low ketones raise concern for impaired fat utilisation or ketone production, while endocrine causes remain possible. MCAD deficiency is one exemplar. 'Hypoketotic' does not require absolute absence of ketones, and detected urine ketones cannot by themselves exclude a fatty-acid oxidation disorder."],"points":["Applied recall: explain why glucose and ketones are more informative together than separately."],"sourceIds":["GL05"]},{"id":"3d","title":"Check context before closing the case","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["An elevated lactate can reflect impaired perfusion or other secondary processes; it does not automatically establish mitochondrial disease. Ammonia can also rise in acquired illness. Check the sample conditions, current treatment and clinical trajectory. When a result is implausible, contact the laboratory promptly about recollection while the team continues assessment and necessary care."],"points":["PG task: give one biological explanation and one collection-related explanation for an unexpected result."],"sourceIds":["GL14"]},{"id":"3e","title":"Build a provisional map","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Good to Know"},"paragraphs":["Use three columns in your notes: observed pattern, plausible mechanisms and next discriminating information. For suspected MSUD, an amino-acid profile with alloisoleucine contributes information that a blood gas cannot supply. Faculty should reward explicit uncertainty: 'This supports X, but we must check Y.' Revisit the map after new results rather than forcing every value to match the first hypothesis."],"points":["These fictional numbers are not treatment thresholds."],"sourceIds":["E05"]}],"takeaway":"A biochemical pattern narrows the differential; urgency and confirmation are separate decisions.","check":{"id":"lc3","stem":"A sick neonate has respiratory alkalosis and an urgently high ammonia result. Which interpretation is best?","options":[{"text":"Normal glucose would exclude a metabolic emergency.","feedback":"Incorrect. Hyperammonaemia can be dangerous without hypoglycaemia."},{"text":"The pattern confirms a specific urea-cycle enzyme defect.","feedback":"Incorrect. Several causes remain possible and specific testing is needed."},{"text":"This is an emergency pattern warranting immediate escalation, with a urea-cycle disorder among the possibilities.","feedback":"Correct. Act on the danger while refining the diagnosis and checking specimen validity."},{"text":"The ammonia result is irrelevant unless there is severe metabolic acidosis.","feedback":"Incorrect. Urea-cycle presentations may lack that acid–base pattern."}],"answer":2,"critical":true,"sourceIds":["GL04","GL14"]}},{"id":4,"title":"The first hour","subtitle":"Coordinate stabilisation, expert help and a safe transfer pathway.","minutes":12,"outcomes":["Identify concurrent first-hour priorities.","Explain why nutrition and treatment must be individualised.","Give a complete escalation handover."],"sections":[{"id":"4a","title":"Assign responsibility for coordination","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Aarav becomes less responsive while samples are being arranged. The team immediately reassesses airway, breathing and circulation, checks glucose and addresses seizures or shock under the neonatal emergency protocol. One clinician coordinates care; others arrange monitoring, sampling and specialist contact. The first hour requires active reassessment."],"points":["The UG learner calls for help and performs only assigned, supervised tasks."],"sourceIds":["IN01","E06"]},{"id":"4b","title":"Support metabolism with a tailored plan","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Acute illness may increase breakdown of the body's own tissues. Energy and fluid support therefore require deliberate planning. The appropriate route, composition and monitoring depend on the suspected disorder and the child's neurological, cardiac and biochemical state. There is no universal instruction to stop all food, restrict all protein or add lipids for every IEM. Ask the metabolic and treating team to specify the plan and reassessment."],"points":["For known disease, locate the child's current emergency letter and confirm its applicability."],"sourceIds":["GL14","GL04"]},{"id":"4c","title":"Escalate hyperammonaemia early","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Hyperammonaemia can injure the brain and needs urgent specialist management. Contact metabolic, neonatal or paediatric intensive-care services early; nephrology may be needed for extracorporeal clearance. Escalation depends on the child's neurological state, ammonia trajectory and response to treatment, alongside local capability. Specialist medicines and clearance methods require an agreed clinical protocol; this lesson supplies neither doses nor treatment cut-offs."],"points":["Do not wait for a molecular diagnosis before discussing time-critical treatment."],"sourceIds":["E01"]},{"id":"4d","title":"Close the communication loop","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["A useful call names the patient, current neurological and cardiorespiratory status, timed results with units, treatment already given and the specific help required. Read back the agreed plan and document who owns each task. If a test is unavailable locally, tell the receiving team immediately and agree where testing and care will occur. A referral request is incomplete until somebody accepts responsibility."],"points":["Rehearse: 'We need urgent advice and transfer assessment; these are our resources.'"],"sourceIds":[]},{"id":"4e","title":"Reassess the system as well as the patient","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Faculty exercise: map the journey from recognising Aarav's deterioration to senior review of his ammonia result. Identify who transports the sample, receives a critical call and accompanies transfer. Remove one resource, such as an overnight assay, and discuss how the pathway changes. A local plan specifies people and alternatives."],"points":["Identify the next review and the person receiving new results."],"sourceIds":[]}],"takeaway":"Stabilise, individualise support, escalate early and make responsibility explicit.","check":{"id":"lc4","stem":"The child is becoming less responsive and specialist biochemical results will take time. What should the team do?","options":[{"text":"Complete all diagnostic sampling before addressing breathing.","feedback":"Incorrect. Diagnostic work must not delay immediate stabilisation."},{"text":"Use the same feeding and lipid instruction for every suspected IEM.","feedback":"Incorrect. Nutritional support depends on the disorder and clinical state."},{"text":"Await genetic confirmation before discussing transfer.","feedback":"Incorrect. Transfer and time-critical care are determined by current need."},{"text":"Continue stabilisation, obtain urgent specialist/ICU advice and arrange transfer as needed while investigations proceed.","feedback":"Correct. Clinical deterioration requires parallel action and an explicit escalation pathway."}],"answer":3,"critical":true,"sourceIds":["IN01","E01","GL14"]}},{"id":5,"title":"Send the right sample","subtitle":"Preserve diagnostic information through timing, handling and communication.","minutes":12,"outcomes":["Distinguish urgent physiology tests from specialised diagnostic studies.","Explain the purpose of a critical sample.","Use receiving-laboratory instructions and track results."],"sections":[{"id":"5a","title":"Collect information without delaying care","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["A critical sample records biochemistry during an event such as hypoglycaemia or encephalopathy. Obtain agreed samples promptly when feasible, but never delay stabilisation or treatment. If treatment has started, record what was given and when; discuss which tests remain useful. A partially completed, well-documented set can still help."],"points":["Assign sampling to a team member while the clinical lead manages the child."],"sourceIds":["IN01","E01"]},{"id":"5b","title":"Coordinate urgent ammonia testing","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Collection and processing errors can falsely increase ammonia. Before drawing blood, confirm the receiving laboratory's accepted specimen, minimum volume, processing time and transport conditions. The correct tube and workflow are assay-specific; follow the current local SOP rather than a remembered colour code. Notify the laboratory of urgency and make sure a responsible clinician receives the result."],"points":["An unexpected result needs clinical review and laboratory discussion, not dismissal as artefact."],"sourceIds":["E02"]},{"id":"5c","title":"Match the specimen to the question","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Glucose, gas, lactate and ammonia describe immediate physiology. Amino acids, acylcarnitines and urine organic acids investigate possible pathways. Availability and specimen requirements differ. For urine organic acids, age, illness state and supplements can affect interpretation. Confirm the container, storage, transport and acceptance requirements with the receiving laboratory."],"points":["'Metabolic screen' is not a sufficiently precise request: name the agreed tests."],"sourceIds":["E03","IN03"]},{"id":"5d","title":"Explain a negative result in context","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Metabolic profiles may differ during illness and recovery. For suspected MCAD deficiency, characteristic biochemical findings can become less evident outside decompensation; interpretation and confirmatory investigation need specialist input. A normal report after treatment does not erase a compelling episode. Do not recreate fasting or stop effective treatment to improve diagnostic yield."],"points":["PG task: annotate a report with the child's state and treatment at collection."],"sourceIds":["GL05"]},{"id":"5e","title":"Track requests and results","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Fictional request: 'Aarav, day four; progressive drowsiness; timed initial results attached; treatment began before this specimen; please advise on interpretation and further samples.' Include identifiers, age, relevant family history and a reachable clinician. Verify labels against the request. Track arrival, acceptance and reporting. Faculty should teach ownership of pending results after transfer or discharge."],"points":["Who will contact the family and treating team with the final report?"],"sourceIds":["E03"]}],"takeaway":"A useful sample needs the right timing, local handling instructions, clinical context and a named result owner.","check":{"id":"lc5","stem":"A neonatal ammonia sample has uncertain handling, and the baby is clinically deteriorating. What is the best response?","options":[{"text":"Continue urgent care, discuss the specimen with the laboratory and arrange prompt recollection if advised.","feedback":"Correct. Resolve preanalytical uncertainty while the treating team manages the clinical emergency."},{"text":"Ignore the ammonia result because mishandling is possible.","feedback":"Incorrect. A possible artefact does not remove the risk of real hyperammonaemia."},{"text":"Use the specimen's tube colour to certify that all handling was correct.","feedback":"Incorrect. Tube choice is only one part of a laboratory-specific workflow."},{"text":"Wait for every specialised sample before treating the child.","feedback":"Incorrect. Sampling must never delay necessary stabilisation or treatment."}],"answer":0,"critical":true,"sourceIds":["E02","E01"]}},{"id":6,"title":"From phenotype to diagnosis","subtitle":"Make the clinical story, biochemical pattern and genetic result explain one another.","minutes":10,"outcomes":["Build a concise phenotype before selecting a specialised test.","Use a simple biological map without treating it as a diagnosis.","Explain why a variant of uncertain significance cannot confirm an IEM."],"sections":[{"id":"6a","title":"Write the problem before the test","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["A phenotype is more than a diagnostic label. Describe when the child became unwell, whether development was previously progressing, the organs involved, and any relationship to feeding, fasting or infection. Add the family history and results already available. A useful referral sentence tells the receiving team what happened and when; ‘rule out metabolic disorder’ leaves those decisions hidden.","Practice with this fictional contrast: one child has recurrent illness-associated drowsiness but is active between episodes; another gradually loses skills and develops organ enlargement. Both warrant careful assessment, but the time course changes the questions your next investigation should answer."],"points":[],"sourceIds":["GL03"]},{"id":"6b","title":"Use mechanisms as an organising map","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["For this course, organise possibilities around accumulation of harmful metabolites, failure to supply usable energy, and disturbed processing of cellular material. Urea cycle defects, fatty-acid oxidation defects and lysosomal disorders illustrate different mechanisms. This simplified teaching map helps connect biology to a clinical problem; it is not a replacement for the formal ICIMD classification, and disease mechanisms can overlap.","Ask what the proposed mechanism predicts. Would illness increase the metabolic load? Would a particular organ bear the injury? A prediction becomes useful when you compare it with observations rather than selecting a disease because its name feels familiar."],"points":[],"sourceIds":["GL13","GL04","GL05","T04"]},{"id":"6c","title":"A metabolite is evidence with a context","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["An abnormal metabolite is not automatically a unique disease signature. Elevated methylmalonic acid, for example, needs interpretation alongside cobalamin status and the biochemical differential; it should not immediately be renamed inherited isolated methylmalonic acidaemia. Different biochemical subtypes also change treatment and follow-up.","Separate three questions in your notes: what was measured, what biological processes could explain it, and what would distinguish them. Include whether the child was ill and whether treatment preceded sampling. This preserves the reasoning for the metabolic laboratory and prevents an early provisional label becoming an unquestioned diagnosis."],"points":[],"sourceIds":["GL06"]},{"id":"6d","title":"Read a genetic result in layers","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["First read the laboratory classification: pathogenic, likely pathogenic, uncertain significance, likely benign or benign. Then check whether the gene, inheritance and child's findings fit together. A disease-associated gene name appearing on a report does not, by itself, establish that it explains this child's illness.","A variant of uncertain significance, or VUS, means the evidence is insufficient to classify the finding. It must not be used as the basis for clinical decisions. Management can still follow independently established clinical and biochemical evidence while specialists investigate the uncertain result."],"points":[],"sourceIds":["T01"]},{"id":"6e","title":"Keep an unresolved case active","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Laboratory review, appropriately selected family studies and additional clinical information may help resolve a VUS; classification can change as evidence grows. Agree who will request reinterpretation and explain the result again to the family. Avoid presenting uncertainty as either a confirmed diagnosis or a guarantee of health.","Proposed case-conference exercise: write one statement of what is established, one unresolved question, and one action that could reduce uncertainty. Assign an owner and a review point. This makes an inconclusive report part of a continuing diagnostic process instead of the end of the child's care."],"points":[],"sourceIds":["T01"]}],"takeaway":"A diagnosis must fit the child and the evidence; a VUS is an unresolved finding.","check":{"id":"lc6","stem":"A panel reports a VUS in a disease-associated gene. How should you interpret it?","options":[{"text":"A basis for reproductive decisions.","feedback":"Those decisions require specialist interpretation and stronger evidence."},{"text":"Unresolved; integrate phenotype, biochemistry and inheritance.","feedback":"Correct. The VUS alone is not diagnostic."},{"text":"Confirmed disease.","feedback":"Gene association does not establish variant significance."},{"text":"Disease excluded.","feedback":"Uncertainty cannot establish absence of disease."}],"answer":1,"critical":false,"sourceIds":["T01"]}},{"id":7,"title":"The child beyond the NICU","subtitle":"Recognise progression, connect organs, and select treatable possibilities.","minutes":10,"outcomes":["Distinguish delay from loss of established skills.","Recognise selected neurological, hepatic and cardiac clues.","Choose a phenotype-led assessment rather than a universal metabolic panel."],"sections":[{"id":"7a","title":"Revisit the developmental story","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Developmental delay describes slower acquisition of abilities; regression means losing an ability the child had reliably achieved. Confirm examples and timing with caregivers: independent walking, meaningful words, feeding or school tasks. New seizures, episodic confusion, progressive movement difficulty or findings in another organ make a fresh diagnostic review particularly important.","An existing label such as cerebral palsy should not prevent reassessment when the trajectory changes. Equally, developmental delay or autism alone does not identify an IEM. Ask what is new, progressive or unexplained, while continuing developmental support and considering common acquired and non-metabolic causes."],"points":[],"sourceIds":["T09","IN05"]},{"id":"7b","title":"A treatable neurological clue: biotinidase deficiency","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Biotinidase deficiency can present after the neonatal period with seizures, hypotonia or ataxia, sometimes alongside alopecia, rash, hearing or visual problems. The combination should prompt consideration of a biotinidase enzyme assay with specialist input. Biotin treatment can prevent manifestations when started early; established sensory or developmental injury may not fully reverse.","In a fictional clinic case, a child with seizures and hair loss has previously received only symptomatic treatment. The teaching task is to notice a potentially connecting diagnosis and arrange appropriate assessment, while continuing urgent seizure care. ‘Treatable’ describes an opportunity, not a promise of complete recovery."],"points":[],"sourceIds":["T02"]},{"id":"7c","title":"Connect liver and neurological findings","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Wilson disease is an example of an inherited metabolic disorder that may first appear in older children with hepatic disease. Movement, behavioural or psychiatric changes may accompany liver involvement, but the complete classic combination is not required. Diagnosis draws on clinical, biochemical and sometimes genetic evidence; one isolated result should not carry the entire conclusion.","Consider a schoolchild with unexplained persistent liver abnormalities and deteriorating handwriting. Reviewing both problems together is more informative than opening two unrelated diagnostic lists. Prompt specialist evaluation matters, and acute liver failure requires an emergency pathway rather than a routine genetics appointment."],"points":[],"sourceIds":["T03"]},{"id":"7d","title":"A weak infant with a large heart","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Infantile-onset Pompe disease illustrates why cardiac and neuromuscular examination belong together. Hypotonia, weakness, feeding or respiratory difficulty with hypertrophic cardiomyopathy raise this possibility. Later-onset Pompe disease often has a different pattern, particularly muscle and respiratory involvement; absence of infantile cardiomyopathy does not exclude that phenotype.","Enzyme activity and molecular testing contribute to confirmation. Disease-specific enzyme replacement exists, but assessment and treatment planning require expertise. For the referring clinician, the immediate lesson is to communicate both the weakness and the cardiac findings, assess respiratory safety, and obtain timely specialist care."],"points":[],"sourceIds":["T04"]},{"id":"7e","title":"Choose a question that a test can answer","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Proposed reasoning exercise: draw two columns headed ‘finding that changes the differential’ and ‘action it changes’. For regression, document the lost skill; for organ enlargement, describe its pattern; for weakness, record cardiac and respiratory findings. Then choose the most informative next assessment with the relevant specialist.","A long panel can still miss the explanation if its methods do not address the clinical question. Build a plan that accommodates infection, nutrition, endocrine disease and other treatable acquired causes as well as inherited disease. Record who will review the result and whether the child needs reassessment before it returns."],"points":[],"sourceIds":[]}],"takeaway":"Age does not exclude an IEM. Progression and connected organ findings guide targeted assessment.","check":{"id":"lc7","stem":"A child with an existing motor-disability label now loses previously established skills. Which response is most appropriate?","options":[{"text":"Reassess the trajectory and examine for neurological, systemic and acquired causes.","feedback":"Correct. New regression changes the clinical question and warrants renewed evaluation."},{"text":"Assume the new changes are already explained by the old label.","feedback":"A prior label should not prevent evaluation of a changing course."},{"text":"Diagnose an IEM from regression alone.","feedback":"Regression is a reason to investigate, not a disease-specific diagnosis."},{"text":"Stop developmental therapy until every metabolic test is complete.","feedback":"Diagnostic assessment and developmental support can proceed together."}],"answer":0,"critical":false,"sourceIds":["T09","IN05"]}},{"id":8,"title":"Living with a diagnosis","subtitle":"Treat the biochemical problem while supporting growth, development and family life.","minutes":10,"outcomes":["Describe why IEM treatments differ by mechanism.","Explain the purpose of an individual nutrition and illness plan.","Review growth, daily functioning and practical barriers alongside laboratory results."],"sections":[{"id":"8a","title":"Start with the purpose of treatment","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["IEM treatment is disease-specific. Examples include replacing a deficient cofactor in biotinidase deficiency, controlling phenylalanine exposure in PAH deficiency, and enzyme replacement for Pompe disease. These approaches address different mechanisms and cannot be substituted for one another. Availability, eligibility and expected benefit must be assessed for the actual child.","A useful explanation links each intervention to its purpose: what harm is it intended to reduce, how will response be assessed, and what limitations remain? A medicine or formula list without that explanation makes changes difficult for families to understand."],"points":[],"sourceIds":["T02","T05","T04"]},{"id":"8b","title":"Nutrition must support the growing child","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["In PAH deficiency, dietary treatment balances phenylalanine control with adequate nutrition; specialist medical foods may be part of that prescription. Growth failure and nutritional deficiencies are possible when treatment is poorly balanced. The lesson is not that every child with an IEM should receive a low-protein diet. Requirements differ by disease, age, growth and treatment.","For a family eating locally available foods, the metabolic dietitian must translate the individual prescription into workable meals. Proposed consultation practice: invite a caregiver to describe an ordinary day of feeding and identify where the written prescription is hard to carry out. Do not improvise substitutions from this course."],"points":[],"sourceIds":["T05"]},{"id":"8c","title":"Prepare for illness before it happens","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["In disorders such as MSUD, infection can increase breakdown of the body's own protein and precipitate metabolic deterioration. A personalised sick-day plan explains when to contact the team, what prescribed changes are appropriate, how response is monitored, and when hospital assessment is required. Persistent vomiting, inability to take the prescribed intake, or altered consciousness require urgent assessment.","Have caregivers demonstrate how they would find and use their child's current plan. The plan must be accessible to the treating clinician during an emergency. Do not turn a general lesson into a home recipe or advise prolonged blanket withdrawal of protein or other nutrients."],"points":[],"sourceIds":["T06"]},{"id":"8d","title":"Look beyond a satisfactory laboratory value","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Follow-up should assess the child's functioning as well as the disease marker. PAH deficiency care, for example, includes developmental, educational and psychosocial concerns alongside biochemical and nutritional monitoring. A treatment programme can meet a laboratory target while the family still struggles with feeding, school participation or treatment burden.","Proposed review exercise: compare today's growth trajectory, daily intake, developmental progress, medicine or formula supply, and caregiver concerns with the previous visit. Explain any change in plain language. A trend can reveal a problem that one isolated measurement or a hurried ‘doing well’ misses."],"points":[],"sourceIds":["T05"]},{"id":"8e","title":"Make the plan usable at home and school","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Proposed shared-care exercise: create a brief, individual summary with the family and specialist team. Include the confirmed diagnosis, current prescription, emergency plan location, responsible clinical team and arrangements for review. Ask who provides care when the usual caregiver is unavailable and how the child reaches hospital during illness.","Invite the child to participate at a developmentally appropriate level. Explore cost, travel, language and supply interruptions without treating difficulty as a moral failure. Use a teach-back conversation to test the clarity of your explanation: the caregiver describes the next action in their own words, and you correct gaps supportively."],"points":[],"sourceIds":[]}],"takeaway":"Successful long-term care protects growth and everyday life as well as metabolic stability.","check":{"id":"lc8","stem":"A child with known MSUD is repeatedly vomiting and becoming drowsy during an infection. What is the best next action?","options":[{"text":"Wait for the next scheduled outpatient amino-acid result.","feedback":"A scheduled result must not delay assessment of an unwell child."},{"text":"Use a generic online diet until the vomiting stops.","feedback":"Emergency nutrition must follow the child's prescribed plan and clinical assessment."},{"text":"Assume avoiding dietary protein completely will stop catabolism.","feedback":"Illness also mobilises the body's own protein; blanket restriction is not an adequate emergency response."},{"text":"Arrange urgent hospital assessment and activate the child's specialist emergency plan.","feedback":"Correct. Poor intake and neurological change can signal deterioration and exceed routine home management."}],"answer":3,"critical":true,"sourceIds":["T06"]}},{"id":9,"title":"Screening and the next pregnancy","subtitle":"Communicate uncertainty accurately and make counselling specific to the family.","minutes":10,"outcomes":["Explain the difference between a screening result and a diagnosis.","Act on symptoms even after a reported normal screen.","Distinguish autosomal recessive, X-linked and mitochondrial counselling questions."],"sections":[{"id":"9a","title":"A screen changes probability","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Newborn screening identifies babies who may need further assessment for selected conditions. An out-of-range result is not a confirmed diagnosis, and a result within range cannot exclude every screened condition. False-positive and false-negative results occur. A child who becomes symptomatic needs clinical assessment even after a reported normal screen.","Ask to see the actual report. ‘Screening done’ does not tell you which conditions were included or whether follow-up was completed. Record the result and what happened next. The biological limits described here apply broadly; programme panels and operational arrangements must be checked locally."],"points":[],"sourceIds":["T07"]},{"id":"9b","title":"Close the loop after an abnormal result","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["An abnormal result needs timely, condition-specific follow-up. Some infants need immediate specialist-directed care while confirmation proceeds. Contact the family in clear language, establish whether the baby is currently well, and arrange the recommended assessment.","Proposed communication practice: ‘This result means your baby needs another assessment; it does not yet prove the condition. Here is the next step and when it must happen.’ Then document a named clinician responsible for reviewing confirmation. A collected sample or a sent referral is not evidence that the baby reached care."],"points":[],"sourceIds":["T07"]},{"id":"9c","title":"Do not give every family the same recurrence risk","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["For an autosomal recessive disorder such as biotinidase deficiency, when both parents are confirmed carriers, each pregnancy has a one-in-four probability of an affected child. Previous affected or unaffected births do not change that probability for the next conception.","That explanation cannot be transferred to every IEM. Ornithine transcarbamylase deficiency is X-linked, whereas many other urea cycle disorders are autosomal recessive. Counselling must consider the specific diagnosis, parental findings and who is at risk. Avoid blame: inheritance describes biological transmission, not an action that a parent caused."],"points":[],"sourceIds":["T02","GL04"]},{"id":"9d","title":"Mitochondrial does not always mean maternal","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Primary mitochondrial disorders can result from mitochondrial DNA or nuclear DNA variants. The latter may follow autosomal recessive, autosomal dominant or X-linked inheritance. For mitochondrial DNA disorders, maternal transmission and the proportion and distribution of altered mitochondrial DNA can complicate prediction of clinical expression.","Before offering a recurrence estimate, identify which genetic system is involved and what has actually been established in the family. A generic label such as ‘mitochondrial disease’ is insufficient. Specialist counselling should explain both available reproductive options and the uncertainty that testing may leave, without predicting an identical course in every child."],"points":[],"sourceIds":["T08"]},{"id":"9e","title":"Plan before pregnancy when possible","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Where a causative familial variant is established, disorder-specific prenatal or preimplantation genetic testing may be possible. A genetics consultation before pregnancy allows review of the affected child's diagnosis, relevant parental testing and the family's preferences. The appropriate test and its interpretation need individual planning.","Proposed counselling exercise: prepare a family summary distinguishing confirmed findings from unanswered questions, then explain the options without steering the family's decision. Include a plan for the next newborn when indicated; routine screening alone may not be the right strategy for a known familial risk. Document understanding, consent and a route back for further discussion."],"points":[],"sourceIds":["T02","GL04"]}],"takeaway":"Screening requires follow-through; recurrence counselling requires the family's actual diagnosis.","check":{"id":"lc9","stem":"A lethargic baby has a reported normal newborn screen. What should you do?","options":[{"text":"Wait for a repeat screening card.","feedback":"Do not postpone clinical assessment."},{"text":"Guarantee absence of inherited disease.","feedback":"A screen cannot provide that guarantee."},{"text":"Assess promptly and investigate the symptoms.","feedback":"Correct. Symptoms require assessment regardless of screening."},{"text":"Exclude IEM.","feedback":"Screening misses some affected babies."}],"answer":2,"critical":true,"sourceIds":["T07","GL04"]}},{"id":10,"title":"IEM care in India","subtitle":"Build a reliable path from first recognition to specialist and continuing care.","minutes":10,"outcomes":["Match referral urgency to the child's clinical needs.","Prioritise investigations with the receiving laboratory and specialist.","Explain dated rare-disease policy information without promising eligibility or funding."],"sections":[{"id":"10a","title":"Choose the destination the child needs now","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["A district clinician's first decision is whether the child needs emergency stabilisation and transfer, urgent specialist discussion, or planned outpatient evaluation. A sick child should reach a centre with the necessary clinical capability; a genetics clinic listing does not establish emergency intensive-care capacity.","Proposed district teaching pathway: stabilise, contact the appropriate receiving clinical team, agree essential investigations and transport arrangements, then send a concise handover. Describe the child's current condition, suspected problem, treatment already given and pending results. Clinical care continues while the diagnosis is being pursued."],"points":[],"sourceIds":["IN01"]},{"id":"10b","title":"Spend the next test on the next decision","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Use a staged investigation plan rather than equating more tests with better care. Start with the urgent clinical question, then choose specialised tests with the laboratory and metabolic team. Confirm specimen type, handling, transport, turnaround and who receives critical results. Do not delay stabilisation to obtain an ideal sample.","Proposed prioritisation exercise: for every test, complete the sentence ‘This result could change…’. Possibilities include immediate management, the next diagnostic step or family counselling. Also identify what a negative result cannot exclude. Ask for an actual local quotation when cost matters; this course does not assign national test prices."],"points":[],"sourceIds":["IN01","IN03"]},{"id":"10c","title":"Describe policy as dated information","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["An official Government of India statement dated 13 March 2026 reported support of up to ₹50 lakh per patient for identified rare diseases through designated Centres of Excellence under the National Policy for Rare Diseases. This is a dated policy statement, not proof that an individual child will receive that amount.","The MoHFW policy index also records later amendments and centre-designation notices, including a July 2026 AIIMS Nagpur notice. Therefore, do not treat an older centre count as a current directory. Confirm the operative policy, eligible condition, assessment process and available services with the designated centre before advising a family about access."],"points":[],"sourceIds":["CP03","CP04"]},{"id":"10d","title":"Make a referral usable for the family","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["The DBT UMMID programme document describes capacity in genetic diagnosis, counselling, screening and training through NIDAN Kendras. Its 2020 programme description is useful context, but is not a current emergency-contact or service-availability directory.","Proposed referral practice: verify a destination, appointment route, required records and available clinical services before travel. Give the family copies of results and a plain-language purpose for the referral. Identify local support for paperwork and follow-up where available. Recheck arrangements after a missed visit; a long journey, lost wages or an unavailable test can interrupt an otherwise sound plan."],"points":[],"sourceIds":["CP05"]},{"id":"10e","title":"Build an institutional pathway and test it","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Proposed faculty implementation task: agree a locally approved pathway with paediatrics, emergency care, laboratory medicine, metabolic or genetics expertise, dietetics and administration. Assign responsibility for urgent advice, sample dispatch, result review, family communication and continuing care. Record actual service hours and a process for keeping details current.","Test the pathway with a fictional night-time referral and a screen-positive infant who appears well. Identify where a handover could fail, then revise that step. Audit time to clinical review, rejected specimens, unreviewed results and missed follow-up. These are proposed improvement measures; they do not imply an existing national mandate or confer specialist competence."],"points":[],"sourceIds":[]}],"takeaway":"A workable pathway connects the right clinical destination, usable tests and continuing family support.","check":{"id":"lc10","stem":"A family asks whether a listed Centre of Excellence guarantees free treatment up to ₹50 lakh. What is the best response?","options":[{"text":"Delay emergency transfer until a funding application is decided.","feedback":"Clinical urgency determines emergency care; administrative navigation should support that care."},{"text":"Explain the dated policy and verify the child's eligibility, current process and services with the centre.","feedback":"Correct. A policy ceiling and a centre designation do not establish an individual entitlement or available treatment."},{"text":"Guarantee the full amount because the hospital is listed.","feedback":"Designation alone is insufficient evidence of eligibility, approval or payment."},{"text":"Use an old centre count as proof that no newer services exist.","feedback":"Later official notices exist; current arrangements need verification."}],"answer":1,"critical":false,"sourceIds":["CP03","CP04"]}}],"sources":[{"id":"IN01","title":"Approach and Management of Inborn Errors of Metabolism in the Neonate, QRG 51","organization":"IAP–NNF; IAP Action Plan 2026","url":"https://iapindia.org/pdf/action-plan-2026/QRG-51-Approach-and-Management-of-Inborn-Errors.pdf","date_version":"2026; 13-page chapter","verified_scope":"Official IAP index and full chapter verified in source audit. Covers recognition, first-line evaluation, acute management, preanalytics and follow-up.","access":"Full official PDF publicly accessible; intermittent fetch failures encountered.","use_in_mooc":"First Indian clinical anchor for sick-neonate cases, first-hour decisions, pattern recognition and initial sample selection.","caveat":"Neonatal scope. Link/read freely; reproduction licence not established. Reconcile treatment details with metabolic, NICU/PICU and laboratory reviewers before clinical-use aids."},{"id":"IN02","title":"Recognizing red flags in inborn errors of metabolism — Clinical presentation and alerts","organization":"Ramaswamy Ganesh; Indian Journal of Practical Pediatrics","url":"https://www.ijpp.in/admin/uploadimage/Vol.27_No.3.pdf","date_version":"2025; 27(3):197–203","verified_scope":"Table of contents, abstract, key points and references inspected in the public 24-page issue extract. Full article not obtained.","access":"Public summary extract; journal is subscription based.","use_in_mooc":"Recognition outcomes, red flags and age-dependent presentations; acquire full article for authoring.","caveat":"Do not mistake the extract for the full article. Issue notice permits reproduction with IJPP acknowledgment; retain attribution and check third-party figures separately."},{"id":"IN03","title":"Laboratory workup in suspected IEM — A stepwise approach","organization":"Anil Jalan and Ketki Kudalkar; Indian Journal of Practical Pediatrics","url":"https://www.ijpp.in/admin/uploadimage/Vol.27_No.3.pdf","date_version":"2025; 27(3):204–217","verified_scope":"Abstract, key points and references inspected; full article not obtained.","access":"Public summary extract; full article acquisition required.","use_in_mooc":"First-line versus specialised testing, report interpretation, specimen timing and laboratory communication.","caveat":"Pair sample-before-treatment teaching with the rule that samples must not delay stabilisation. Obtain actual receiving-lab SOPs. IJPP issue acknowledgment terms apply."},{"id":"IN04","title":"Genetic testing in inborn errors of metabolism","organization":"Sankar VH and Vinitha AO; Indian Journal of Practical Pediatrics","url":"https://www.ijpp.in/admin/uploadimage/Vol.27_No.3.pdf","date_version":"2025; 27(3):218–226","verified_scope":"Abstract, key points and references inspected; full article not obtained.","access":"Public summary extract; full article acquisition required.","use_in_mooc":"Phenotype-biochemistry-genetics integration, variant interpretation and pre/post-test counselling.","caveat":"Avoid teaching that every variant establishes disease or that all IEMs share one inheritance pattern. IJPP acknowledgment notice applies."},{"id":"IN05","title":"Recognising treatable inborn errors of metabolism in children with developmental delay, autism, epilepsy, movement disorder or cerebral palsy mimics","organization":"Umamaheswari Balakrishnan and Rabindran Chandran; Indian Journal of Practical Pediatrics","url":"https://www.ijpp.in/admin/uploadimage/Vol.27_No.3.pdf","date_version":"2025; 27(3), begins p227","verified_scope":"Title and article summary identified in public issue extract; full article not obtained.","access":"Public summary extract; full article acquisition required.","use_in_mooc":"Cases of regression and selected treatable neurological mimics beyond the neonatal period.","caveat":"Do not imply all developmental/autism presentations need the same metabolic testing. Verify phenotype-specific indications in full text and disorder guidance."},{"id":"IN06","title":"Newborn screening for inborn errors of metabolism in India — Present status, gaps and future directions","organization":"Amit Kumar Gupta, Neerja Gupta, Madhulika Kabra and Seema Kapoor; IJPP","url":"https://www.ijpp.in/Files/2025/ver4/newborn-screening-for-inborn-errors-of-metabolism-inIndia.pdf","date_version":"2025; 27(4):309–314 (article's cite-as line)","verified_scope":"Two-page abstract/key-points/reference extract inspected. Describes variable state programmes and proposes a tiered approach.","access":"Public summary extract; full article not obtained.","use_in_mooc":"Indian NBS discussion, access variation, programme design and referral follow-through.","caveat":"Author proposal is not a national mandate. Do not imply uniform expanded NBS coverage. PDF running page headers differ from cite-as pagination."},{"id":"IN07","title":"ISIEM–NNF Foundation Course on Inborn Errors of Metabolism","organization":"Indian Society for Inborn Errors of Metabolism and National Neonatology Forum","url":"https://www.isiem.org/theme-management-of-common-inborn-errors-of-metabolism-iems/","date_version":"Advertised cohort begins 21 December 2024; 14 weekly sessions and two practical days","verified_scope":"Public course announcement/curriculum verified; private lessons, slides and recordings not accessed.","access":"Public course description; teaching materials require course/provider access.","use_in_mooc":"Indian clinical, laboratory and dietetic curriculum comparison; identify practical teaching expertise and possible collaborators.","caveat":"Do not list recordings or slides as acquired. Seek separate permission if reusing provider material; no outreach has been sent."},{"id":"GL01","title":"Inborn Metabolic Diseases: Diagnosis and Treatment, 7th edition","organization":"Springer; Saudubray, Baumgartner, García-Cazorla and Walter (editors)","url":"https://link.springer.com/book/10.1007/978-3-662-63123-2","date_version":"2022; eBook 24 June 2022","verified_scope":"Publisher listing and visible table of contents inspected; full licensed chapters not reviewed.","access":"Paid/institutional full text; public listing.","use_in_mooc":"Authoring anchor: clinical approach (pp 3–123), diagnostic procedures (147–166), emergency treatments (167–176). MUST recognition; NICE diagnostic reasoning; GOOD disease mechanisms.","caveat":"Acquire licensed chapters before extraction. Create original teaching visuals; publisher permission for reused figures/tables."},{"id":"GL02","title":"Physician's Guide to the Diagnosis, Treatment, and Follow-Up of Inherited Metabolic Diseases, 2nd edition","organization":"Springer; Blau, Dionisi Vici, Ferreira, Vianey-Saban and van Karnebeek (editors)","url":"https://link.springer.com/book/10.1007/978-3-030-67727-5","date_version":"2022; eBook 21 February 2022","verified_scope":"Publisher listing/visible contents inspected; full licensed chapters not reviewed.","access":"Paid/institutional; publisher identifies chapter 73 as CC BY 4.0.","use_in_mooc":"NICE laboratory workshop: routine chemistry, amino acids, organic acids, acylcarnitines. GOOD genomics/metabolomics. Authors should acquire emergency diagnostic chapter (pp 171–181).","caveat":"Do not imply the entire book is open access. Assay reference intervals and sample instructions need local laboratory validation."},{"id":"GL03","title":"Clinical Practice Guidelines: Metabolic disorders","organization":"Royal Children's Hospital Melbourne","url":"https://www.rch.org.au/clinicalguide/guideline_index/metabolic_disorders/","date_version":"Last updated June 2022","verified_scope":"Clinical webpage inspected: recognition, tests, management principles and pattern table.","access":"Free webpage; no open reuse licence verified.","use_in_mooc":"MUST: sick child recognition, urgent first-line tests, stabilisation and early specialist contact. NICE: pattern interpretation and sample timing.","caveat":"Pattern table is a guide, especially for neonates/young infants; abnormalities are nonspecific. Samples must not delay stabilisation. Do not copy its fluid prescriptions into an Indian generic protocol."},{"id":"GL04","title":"Urea Cycle Disorders Overview","organization":"GeneReviews, University of Washington; NCBI Bookshelf","url":"https://www.ncbi.nlm.nih.gov/books/NBK1217/","date_version":"Updated 3 July 2025","verified_scope":"Full chapter accessible; presentation, screening limits, evaluation, management and counselling sections inspected.","access":"Free reading; chapter-specific GeneReviews terms.","use_in_mooc":"MUST hyperammonaemia recognition; NICE biochemical differential; GOOD inherited risk and genotype-to-phenotype interpretation. Anchor one recurring neonatal case.","caveat":"NBS does not detect every UCD; severe disease may precede results. Sepsis can coexist. Free access is not unrestricted MOOC reuse."},{"id":"GL05","title":"Medium-Chain Acyl-Coenzyme A Dehydrogenase Deficiency","organization":"GeneReviews, University of Washington; NCBI Bookshelf","url":"https://www.ncbi.nlm.nih.gov/books/NBK1424/","date_version":"Updated 26 September 2024","verified_scope":"Full chapter accessible; diagnosis, NBS limitations, sample timing, management and counselling inspected.","access":"Free reading; GeneReviews reuse terms.","use_in_mooc":"MUST fasting/illness-triggered deterioration; NICE hypoketotic hypoglycaemia, confirmatory testing and sample timing; GOOD counselling and follow-up.","caveat":"Use as an exemplar, not evidence that MCAD is India's most frequent FAOD. Normal interval assays can mislead; a VUS alone does not confirm disease. No provocative fasting task."},{"id":"GL06","title":"Isolated Methylmalonic Acidemia","organization":"GeneReviews; NIH authors; NCBI Bookshelf","url":"https://www.ncbi.nlm.nih.gov/books/NBK1231/","date_version":"Updated 8 September 2022","verified_scope":"Full chapter available; definition, clinical presentation, evaluation and copyright note inspected.","access":"Free full text; chapter explicitly states US public-domain status.","use_in_mooc":"NICE organic-acidaemia case and biochemical/genetic confirmation; GOOD subtype, responsiveness and long-term follow-up. Pair with Indian discussion of acquired B12 deficiency and cobalamin disorders.","caveat":"This chapter concerns isolated MMA; do not equate any elevated MMA with inherited isolated MMA. Check individual third-party material and jurisdiction before reuse."},{"id":"GL07","title":"ACT Sheets and Algorithms","organization":"American College of Medical Genetics and Genomics","url":"https://www.acmg.net/act","date_version":"Live index contains mixed revisions; MSUD and MCAD entries labelled 2026.","verified_scope":"Official search-indexed full listing inspected; direct page/PDF fetch intermittently failed. Individual 2026 sheets require acquisition and review.","access":"Freely available regardless of membership; no open reuse licence verified.","use_in_mooc":"MUST screen-positive communication and urgent follow-up; NICE confirmation workflow. Link selected MSUD, MCAD, citrulline, C3 and galactosaemia sheets after individual verification.","caveat":"These address screen-positive results, not a universal symptomatic-child protocol. Record the actual linked PDF revision; website labels may lag updated files."},{"id":"GL08","title":"Paediatric emergency advice","organization":"British Inherited Metabolic Diseases Group","url":"https://bimdg.org.uk/emergency/paediatric-guidelines/","date_version":"Live index; sampled OTC/CPS standard PDF ©2016, last reviewed May 2023.","verified_scope":"Index/disclaimer and linked OTC/CPS protocol inspected.","access":"Free reading; no open adaptation licence verified.","use_in_mooc":"NICE known-disease crisis/sick-day case; GOOD/faculty comparison of individual emergency plans and escalation.","caveat":"UK guidance explicitly requires current medicine checks, local policy and clinical judgement. Not a ready-made Indian protocol; verify each document's internal review date, not its upload path."},{"id":"GL09","title":"Undiagnosed problems: Hyperammonaemia—Undiagnosed","organization":"British Inherited Metabolic Diseases Group","url":"https://bimdg.org.uk/emergency/undiagnosed-problems/","date_version":"Linked hyperammonaemia PDF last reviewed April 2017.","verified_scope":"Index and 5-page undiagnosed hyperammonaemia PDF inspected.","access":"Free PDF; no open adaptation licence verified.","use_in_mooc":"Faculty comparison: distinguish unknown diagnosis from established UCD; historical framework for emergency differential.","caveat":"Older reviewed document; do not call it 2024 guidance because upload folder says 2024. Cross-check newer expert guidance and local specialist protocol before any clinical job aid."},{"id":"GL10","title":"Acute Illness Materials; Neonate/Infant/Child with Hyperammonemia","organization":"New England Consortium of Metabolic Programs; Boston Children's Hospital","url":"https://www.newenglandconsortium.org/acute-illness","date_version":"Hyperammonaemia page updated 2020; landing page says materials are undergoing review.","verified_scope":"Landing page, hyperammonaemia chapter and Terms of Use inspected.","access":"Free reading; written permission required for reproduction/distribution/display/derivative works.","use_in_mooc":"PG/faculty reading bank and case-design comparison of phenotype, physiology and recovery; link to source.","caveat":"Some protocols may be unavailable during review. Metabolic consultation required; do not reproduce or closely adapt course content without permission."},{"id":"GL11","title":"Syllabus for Training in Clinical Paediatric Metabolic Medicine","organization":"SSIEM","url":"https://www.ssiem.org/training/ssiem-training/training-syllabus.html","date_version":"Landing updated 30 June 2017; linked PDF says updated December 2014; filename includes 2016.","verified_scope":"Landing and six-page clinical syllabus inspected.","access":"Free PDF; no open reuse licence verified.","use_in_mooc":"GOOD/faculty competency gap check: laboratory interpretation, nutrition, counselling, multidisciplinary care, teaching and service design.","caveat":"Specialist-training breadth, not UG minimum or evidence that a MOOC confers specialist competence. Use current clinical guidance for treatments."},{"id":"GL12","title":"Hyperammonaemia e-learning course","organization":"SSIEM; adapted from Orphan Europe Academy","url":"https://www.ssiem.org/learning/","date_version":"No clinical revision date visible on landing.","verified_scope":"Landing/acknowledgements only; course behind details form not completed or reviewed.","access":"Advertised open learning; approx. four hours; no completion certificate.","use_in_mooc":"Optional PG/faculty external study; instructional comparison after authorised access and review.","caveat":"Do not list unseen lesson contents as acquired. Open learning does not imply open licensing."},{"id":"GL13","title":"Online Inherited Metabolic Disease WebApp / International Classification of Inherited Metabolic Disorders","organization":"ICIMD maintainers Zschocke, Ferreira and Rahman; OIMD","url":"https://oimd.org/","date_version":"Living database; founding classification paper 2021 (JIMD 44:164–177).","verified_scope":"Official indexed landing and founding-paper abstract/results inspected; interactive full database not audited.","access":"Public web app; article accessible through PMC; reuse licence not established in this pass.","use_in_mooc":"GOOD/faculty classification browser; NICE connect disease families to biology. Use original simplified maps, not compulsory disease-count memorisation.","caveat":"The founding paper's 1,450 disorders is a 2021 count, not a verified current total. Current home is OIMD."},{"id":"GL14","title":"Recommendations for the Diagnosis and Therapeutic Management of Hyperammonaemia in Paediatric and Adult Patients","organization":"Bélanger-Quintana et al.; Nutrients","url":"https://doi.org/10.3390/nu14132755","date_version":"2 July 2022; 14(13):2755","verified_scope":"Full open-access PMC article inspected during lesson authoring; expert-panel recommendations, not a universal paediatric protocol.","access":"Full article available; CC BY 4.0 stated.","use_in_mooc":"Faculty evidence comparison: sampling, monitoring, urgent escalation, acquired causes, nutritional support and diagnosis-specific exceptions.","caveat":"Expert-panel protocol, not universal paediatric consensus. Reconcile threshold differences with specialist/ICU/nephrology review; do not paste dosing tables. Article reports industry-funded writing/APC."},{"id":"CP01","title":"NMC CBME Curriculum 2024 and clarification index","organization":"National Medical Commission","url":"https://www.nmc.org.in/rules-regulations-nmc/","date_version":"Revised curriculum 12 September 2024; additional clarification 10 October 2024","verified_scope":"Official indexed listing and official curriculum cover notice verified. Earlier August version withdrawn; revised version applies from 2024–25 MBBS batch. Exact subject competency codes not verified in this pass.","access":"Public documents; direct NMC fetch repeatedly failed.","use_in_mooc":"Check UG scope against paediatrics, biochemistry, genetics, communication and emergency competencies when authoritative full PDF is available.","caveat":"Proposed outcomes are not a completed code-level crosswalk or NMC endorsement. Do not use an earlier withdrawn document."},{"id":"CP02","title":"NMC PG Curriculum — MD Paediatrics","organization":"National Medical Commission","url":"https://www.nmc.org.in/information-desk/for-colleges/pg-curricula-2/","date_version":"Live official curriculum index checked September 2026; exact PDF revision to verify","verified_scope":"Official indexed PG curriculum listing identified. Full curriculum could not be reliably fetched for exact competency extraction.","access":"Public index; full PDF access needs retry/acquisition.","use_in_mooc":"Complete a PG competency crosswalk for clinical assessment, investigation, initial management, counselling, teaching and referral.","caveat":"Do not present inferred PG requirements as verbatim NMC competencies. Exact revised document and wording remain an acquisition task."},{"id":"CP03","title":"Affordable Price of Injections for Serious Injuries — March 2026 rare-disease support statement","organization":"Press Information Bureau; Department of Pharmaceuticals","url":"https://www.pib.gov.in/PressReleasePage.aspx?PRID=2239572","date_version":"13 March 2026","verified_scope":"Full official statement inspected. Reports up to Rs50 lakh per patient, 63 identified rare diseases and 15 designated CoEs on that date.","access":"Public official release.","use_in_mooc":"Dated background for family access and NPRD navigation teaching.","caveat":"Not proof of individual eligibility or payment. March CoE count is not current September count because later designation notices exist."},{"id":"CP04","title":"MoHFW Acts and Policies — July 2026 AIIMS Nagpur CoE notice and March NPRD amendment","organization":"Department of Health and Family Welfare, Ministry of Health and Family Welfare","url":"https://www.mohfw-dohfw.gov.in/documents/acts-and-policies","date_version":"Nagpur inclusion OM 10 July 2026, listing published 14 July; amendment 10 March 2026","verified_scope":"Official listing verified, including AIIMS Nagpur inclusion and NPRD guideline amendment. Complete operative attachments not fully reviewed in this pass.","access":"Public official index with linked documents.","use_in_mooc":"Maintain current policy/referral source list; obtain operative amendments before constructing the family access pathway.","caveat":"Do not hard-code a total by simply adding to an older count. Verify the complete current list and actual clinical services before referrals."},{"id":"CP05","title":"UMMID initiative and NIDAN Kendras programme document","organization":"Department of Biotechnology, Government of India","url":"https://dbtindia.gov.in/sites/default/files/Advt_UMMID_10062020_1.pdf","date_version":"2020 programme document","verified_scope":"Official nine-page programme document accessible; genetics, training, screening and counselling roles identified.","access":"Public government PDF.","use_in_mooc":"Indian genetics infrastructure and counselling context; explain how programme capacity connects to clinical referral needs.","caveat":"Historical programme document, not a current service-availability or emergency-contact directory. Verify live sites and services separately."},{"id":"ED01","title":"Test-enhanced learning of clinical reasoning: a crossover randomised trial","organization":"Raupach et al.; Medical Education / PubMed","url":"https://pubmed.ncbi.nlm.nih.gov/27295475/","date_version":"2016","verified_scope":"Primary study abstract inspected. Repeated key-feature questions improved retained clinical-reasoning test performance compared with case study alone in this setting.","access":"Public abstract; full article access depends on publisher/library.","use_in_mooc":"Build repeated decision questions into longitudinal cases and evaluate retention with new items.","caveat":"Evidence from another medical-education setting; it does not validate this IEM MOOC or demonstrate independent bedside competence."},{"id":"ED02","title":"Comparing different retrieval practice strategies using virtual patients: a stratified randomized trial","organization":"Gianotto-Oliveira et al.; Medical Teacher / PubMed","url":"https://pubmed.ncbi.nlm.nih.gov/41503782/","date_version":"Online 7 January 2026; June 2026 issue","verified_scope":"Primary study abstract inspected. Eighty fifth-year medical students studied virtual cases and received different retrieval tasks with later retention testing.","access":"Public abstract; publisher full text may require access.","use_in_mooc":"Include short-answer recall alongside multiple-choice and branching cases, then pilot the mix by learner role.","caveat":"Small study outside Indian IEM education; do not claim that one format universally produces superior competence."},{"id":"ED03","title":"Does spaced education improve clinical knowledge among Family Medicine residents? A cluster randomized controlled trial","organization":"Advances in Health Sciences Education / PubMed","url":"https://pubmed.ncbi.nlm.nih.gov/33389233/","date_version":"2021 publication; DOI 10.1007/s10459-020-10020-z","verified_scope":"Primary study abstract inspected. Alerts encouraging spaced learning did not produce the planned meaningful certification-exam advantage in this residency trial.","access":"Public abstract.","use_in_mooc":"Require a course-specific evaluation rather than assuming reminders or technology establish learning gains.","caveat":"Contrasting evidence: educational design effects depend on participation, implementation, context and outcome chosen."},{"id":"ED04","title":"Web Content Accessibility Guidelines (WCAG) 2.2","organization":"World Wide Web Consortium","url":"https://www.w3.org/TR/WCAG22/","date_version":"Version 2.2; live recommendation checked 11 September 2026","verified_scope":"Official standard inspected, including captions, text alternatives, contrast and interaction requirements.","access":"Public official standard.","use_in_mooc":"Specify captions, accessible text and controls, keyboard use and sufficient contrast; target AA and test the delivered course.","caveat":"A design intention is not a conformance audit. Add low-bandwidth/offline alternatives as a separate course design decision."},{"id":"E01","title":"Consensus guidelines for management of hyperammonaemia in paediatric patients receiving continuous kidney replacement therapy","url":"https://www.nature.com/articles/s41581-020-0267-8","date_version":"Raina et al., 8 April 2020; Nature Reviews Nephrology 16:471–482","verified_scope":"Full official article inspected 11 September 2026: urgency, stabilisation, specialist clearance, evidence limitations and individualised escalation.","access":"Public full text; open-access article.","caveat":"Specialist expert consensus based largely on case reports and retrospective data; do not reuse its dosing, nutritional recipes or thresholds as a universal Indian bedside protocol. No promise that proposed review cycle was completed."},{"id":"E02","title":"NH3V: Ammonia, Plasma — Mayo Clinic Laboratories test catalogue","url":"https://www.mayocliniclabs.com/test-catalog/overview/35130","date_version":"Live catalogue checked 11 September 2026; no single page revision date identified.","verified_scope":"Official specimen, processing, interpretation and caution sections inspected; handling errors can cause false elevation.","access":"Public laboratory catalogue.","caveat":"Illustrates one assay's requirements. Do not copy its reference intervals, tube, volume or shipping timetable into a local emergency collection SOP."},{"id":"E03","title":"OAU: Organic Acids Screen, Random, Urine — Mayo Clinic Laboratories Rochester","url":"https://mml.testcatalog.org/show/OAU","date_version":"Live catalogue checked 11 September 2026; ©2026 notice.","verified_scope":"Official performing-laboratory catalogue inspected: specimen requirements, clinical information, collection-state effects and qualitative reporting.","access":"Public laboratory catalogue.","caveat":"One laboratory's assay. Confirm actual receiving-laboratory sample acceptance and local logistics; its published turnaround does not define an emergency pathway elsewhere."},{"id":"E04","title":"Classic Galactosemia and Clinical Variant Galactosemia","url":"https://www.ncbi.nlm.nih.gov/books/NBK1518/","date_version":"GeneReviews; last update 11 March 2021.","verified_scope":"Full chapter accessible; neonatal presentation, E. coli sepsis coexistence and diagnosis sections inspected 11 September 2026.","access":"Free chapter reading; GeneReviews reuse terms.","caveat":"Classic and clinical variant galactosaemia are not interchangeable with all biochemical variants. The MOOC paraphrases brief clinical points and does not reproduce feeding protocols or chapter figures."},{"id":"E05","title":"Maple Syrup Urine Disease","url":"https://www.ncbi.nlm.nih.gov/books/NBK1319/","date_version":"GeneReviews; last update 23 April 2020.","verified_scope":"Full chapter accessible; neonatal presentation and amino-acid/alloisoleucine diagnostic sections inspected 11 September 2026.","access":"Free chapter reading; GeneReviews reuse terms.","caveat":"Use as a disease exemplar; verify current specialist management separately. Do not copy numeric schedules, diet prescriptions or figures."},{"id":"E06","title":"Recognition of the seriously unwell neonate and young infan
