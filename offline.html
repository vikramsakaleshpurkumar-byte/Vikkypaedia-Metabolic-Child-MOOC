st strategy for an overlapping phenotype?","options":[{"text":"Choose CDG from hypotonia alone","feedback":"Incorrect. Converging evidence and discriminating tests are stronger than a single nonspecific feature."},{"text":"Choose mitochondrial disease from one lactate","feedback":"Incorrect. Converging evidence and discriminating tests are stronger than a single nonspecific feature."},{"text":"Delay all testing until a pathognomonic sign appears","feedback":"Incorrect. Converging evidence and discriminating tests are stronger than a single nonspecific feature."},{"text":"Integrate phenotype, biochemical screens, imaging and genomic evidence","feedback":"Correct. Converging evidence and discriminating tests are stronger than a single nonspecific feature."}],"answer":3,"critical":false,"sourceIds":["PCNA11"]}]}],"sources":[{"id":"IN01","title":"Approach and Management of Inborn Errors of Metabolism in the Neonate, QRG 51","organization":"IAP–NNF; IAP Action Plan 2026","url":"https://iapindia.org/pdf/action-plan-2026/QRG-51-Approach-and-Management-of-Inborn-Errors.pdf","date_version":"2026; 13-page chapter","verified_scope":"Official IAP index and full chapter verified in source audit. Covers recognition, first-line evaluation, acute management, preanalytics and follow-up.","access":"Full official PDF publicly accessible; intermittent fetch failures encountered.","use_in_mooc":"First Indian clinical anchor for sick-neonate cases, first-hour decisions, pattern recognition and initial sample selection.","caveat":"Neonatal scope. Link/read freely; reproduction licence not established. Reconcile treatment details with metabolic, NICU/PICU and laboratory reviewers before clinical-use aids."},{"id":"IN02","title":"Recognizing red flags in inborn errors of metabolism — Clinical presentation and alerts","organization":"Ramaswamy Ganesh; Indian Journal of Practical Pediatrics","url":"https://www.ijpp.in/admin/uploadimage/Vol.27_No.3.pdf","date_version":"2025; 27(3):197–203","verified_scope":"Table of contents, abstract, key points and references inspected in the public 24-page issue extract. Full article not obtained.","access":"Public summary extract; journal is subscription based.","use_in_mooc":"Recognition outcomes, red flags and age-dependent presentations; acquire full article for authoring.","caveat":"Do not mistake the extract for the full article. Issue notice permits reproduction with IJPP acknowledgment; retain attribution and check third-party figures separately."},{"id":"IN03","title":"Laboratory workup in suspected IEM — A stepwise approach","organization":"Anil Jalan and Ketki Kudalkar; Indian Journal of Practical Pediatrics","url":"https://www.ijpp.in/admin/uploadimage/Vol.27_No.3.pdf","date_version":"2025; 27(3):204–217","verified_scope":"Abstract, key points and references inspected; full article not obtained.","access":"Public summary extract; full article acquisition required.","use_in_mooc":"First-line versus specialised testing, report interpretation, specimen timing and laboratory communication.","caveat":"Pair sample-before-treatment teaching with the rule that samples must not delay stabilisation. Obtain actual receiving-lab SOPs. IJPP issue acknowledgment terms apply."},{"id":"IN04","title":"Genetic testing in inborn errors of metabolism","organization":"Sankar VH and Vinitha AO; Indian Journal of Practical Pediatrics","url":"https://www.ijpp.in/admin/uploadimage/Vol.27_No.3.pdf","date_version":"2025; 27(3):218–226","verified_scope":"Abstract, key points and references inspected; full article not obtained.","access":"Public summary extract; full article acquisition required.","use_in_mooc":"Phenotype-biochemistry-genetics integration, variant interpretation and pre/post-test counselling.","caveat":"Avoid teaching that every variant establishes disease or that all IEMs share one inheritance pattern. IJPP acknowledgment notice applies."},{"id":"IN05","title":"Recognising treatable inborn errors of metabolism in children with developmental delay, autism, epilepsy, movement disorder or cerebral palsy mimics","organization":"Umamaheswari Balakrishnan and Rabindran Chandran; Indian Journal of Practical Pediatrics","url":"https://www.ijpp.in/admin/uploadimage/Vol.27_No.3.pdf","date_version":"2025; 27(3), begins p227","verified_scope":"Title and article summary identified in public issue extract; full article not obtained.","access":"Public summary extract; full article acquisition required.","use_in_mooc":"Cases of regression and selected treatable neurological mimics beyond the neonatal period.","caveat":"Do not imply all developmental/autism presentations need the same metabolic testing. Verify phenotype-specific indications in full text and disorder guidance."},{"id":"IN06","title":"Newborn screening for inborn errors of metabolism in India — Present status, gaps and future directions","organization":"Amit Kumar Gupta, Neerja Gupta, Madhulika Kabra and Seema Kapoor; IJPP","url":"https://www.ijpp.in/Files/2025/ver4/newborn-screening-for-inborn-errors-of-metabolism-inIndia.pdf","date_version":"2025; 27(4):309–314 (article's cite-as line)","verified_scope":"Two-page abstract/key-points/reference extract inspected. Describes variable state programmes and proposes a tiered approach.","access":"Public summary extract; full article not obtained.","use_in_mooc":"Indian NBS discussion, access variation, programme design and referral follow-through.","caveat":"Author proposal is not a national mandate. Do not imply uniform expanded NBS coverage. PDF running page headers differ from cite-as pagination."},{"id":"IN07","title":"ISIEM–NNF Foundation Course on Inborn Errors of Metabolism","organization":"Indian Society for Inborn Errors of Metabolism and National Neonatology Forum","url":"https://www.isiem.org/theme-management-of-common-inborn-errors-of-metabolism-iems/","date_version":"Advertised cohort begins 21 December 2024; 14 weekly sessions and two practical days","verified_scope":"Public course announcement/curriculum verified; private lessons, slides and recordings not accessed.","access":"Public course description; teaching materials require course/provider access.","use_in_mooc":"Indian clinical, laboratory and dietetic curriculum comparison; identify practical teaching expertise and possible collaborators.","caveat":"Do not list recordings or slides as acquired. Seek separate permission if reusing provider material; no outreach has been sent."},{"id":"GL01","title":"Inborn Metabolic Diseases: Diagnosis and Treatment, 7th edition","organization":"Springer; Saudubray, Baumgartner, García-Cazorla and Walter (editors)","url":"https://link.springer.com/book/10.1007/978-3-662-63123-2","date_version":"2022; eBook 24 June 2022","verified_scope":"Publisher listing and visible table of contents inspected; full licensed chapters not reviewed.","access":"Paid/institutional full text; public listing.","use_in_mooc":"Authoring anchor: clinical approach (pp 3–123), diagnostic procedures (147–166), emergency treatments (167–176). MUST recognition; NICE diagnostic reasoning; GOOD disease mechanisms.","caveat":"Acquire licensed chapters before extraction. Create original teaching visuals; publisher permission for reused figures/tables."},{"id":"GL02","title":"Physician's Guide to the Diagnosis, Treatment, and Follow-Up of Inherited Metabolic Diseases, 2nd edition","organization":"Springer; Blau, Dionisi Vici, Ferreira, Vianey-Saban and van Karnebeek (editors)","url":"https://link.springer.com/book/10.1007/978-3-030-67727-5","date_version":"2022; eBook 21 February 2022","verified_scope":"Publisher listing/visible contents inspected; full licensed chapters not reviewed.","access":"Paid/institutional; publisher identifies chapter 73 as CC BY 4.0.","use_in_mooc":"NICE laboratory workshop: routine chemistry, amino acids, organic acids, acylcarnitines. GOOD genomics/metabolomics. Authors should acquire emergency diagnostic chapter (pp 171–181).","caveat":"Do not imply the entire book is open access. Assay reference intervals and sample instructions need local laboratory validation."},{"id":"GL03","title":"Clinical Practice Guidelines: Metabolic disorders","organization":"Royal Children's Hospital Melbourne","url":"https://www.rch.org.au/clinicalguide/guideline_index/metabolic_disorders/","date_version":"Last updated June 2022","verified_scope":"Clinical webpage inspected: recognition, tests, management principles and pattern table.","access":"Free webpage; no open reuse licence verified.","use_in_mooc":"MUST: sick child recognition, urgent first-line tests, stabilisation and early specialist contact. NICE: pattern interpretation and sample timing.","caveat":"Pattern table is a guide, especially for neonates/young infants; abnormalities are nonspecific. Samples must not delay stabilisation. Do not copy its fluid prescriptions into an Indian generic protocol."},{"id":"GL04","title":"Urea Cycle Disorders Overview","organization":"GeneReviews, University of Washington; NCBI Bookshelf","url":"https://www.ncbi.nlm.nih.gov/books/NBK1217/","date_version":"Updated 3 July 2025","verified_scope":"Full chapter accessible; presentation, screening limits, evaluation, management and counselling sections inspected.","access":"Free reading; chapter-specific GeneReviews terms.","use_in_mooc":"MUST hyperammonaemia recognition; NICE biochemical differential; GOOD inherited risk and genotype-to-phenotype interpretation. Anchor one recurring neonatal case.","caveat":"NBS does not detect every UCD; severe disease may precede results. Sepsis can coexist. Free access is not unrestricted MOOC reuse."},{"id":"GL05","title":"Medium-Chain Acyl-Coenzyme A Dehydrogenase Deficiency","organization":"GeneReviews, University of Washington; NCBI Bookshelf","url":"https://www.ncbi.nlm.nih.gov/books/NBK1424/","date_version":"Updated 26 September 2024","verified_scope":"Full chapter accessible; diagnosis, NBS limitations, sample timing, management and counselling inspected.","access":"Free reading; GeneReviews reuse terms.","use_in_mooc":"MUST fasting/illness-triggered deterioration; NICE hypoketotic hypoglycaemia, confirmatory testing and sample timing; GOOD counselling and follow-up.","caveat":"Use as an exemplar, not evidence that MCAD is India's most frequent FAOD. Normal interval assays can mislead; a VUS alone does not confirm disease. No provocative fasting task."},{"id":"GL06","title":"Isolated Methylmalonic Acidemia","organization":"GeneReviews; NIH authors; NCBI Bookshelf","url":"https://www.ncbi.nlm.nih.gov/books/NBK1231/","date_version":"Updated 8 September 2022","verified_scope":"Full chapter available; definition, clinical presentation, evaluation and copyright note inspected.","access":"Free full text; chapter explicitly states US public-domain status.","use_in_mooc":"NICE organic-acidaemia case and biochemical/genetic confirmation; GOOD subtype, responsiveness and long-term follow-up. Pair with Indian discussion of acquired B12 deficiency and cobalamin disorders.","caveat":"This chapter concerns isolated MMA; do not equate any elevated MMA with inherited isolated MMA. Check individual third-party material and jurisdiction before reuse."},{"id":"GL07","title":"ACT Sheets and Algorithms","organization":"American College of Medical Genetics and Genomics","url":"https://www.acmg.net/act","date_version":"Live index contains mixed revisions; MSUD and MCAD entries labelled 2026.","verified_scope":"Official search-indexed full listing inspected; direct page/PDF fetch intermittently failed. Individual 2026 sheets require acquisition and review.","access":"Freely available regardless of membership; no open reuse licence verified.","use_in_mooc":"MUST screen-positive communication and urgent follow-up; NICE confirmation workflow. Link selected MSUD, MCAD, citrulline, C3 and galactosaemia sheets after individual verification.","caveat":"These address screen-positive results, not a universal symptomatic-child protocol. Record the actual linked PDF revision; website labels may lag updated files."},{"id":"GL08","title":"Paediatric emergency advice","organization":"British Inherited Metabolic Diseases Group","url":"https://bimdg.org.uk/emergency/paediatric-guidelines/","date_version":"Live index; sampled OTC/CPS standard PDF ©2016, last reviewed May 2023.","verified_scope":"Index/disclaimer and linked OTC/CPS protocol inspected.","access":"Free reading; no open adaptation licence verified.","use_in_mooc":"NICE known-disease crisis/sick-day case; GOOD/faculty comparison of individual emergency plans and escalation.","caveat":"UK guidance explicitly requires current medicine checks, local policy and clinical judgement. Not a ready-made Indian protocol; verify each document's internal review date, not its upload path."},{"id":"GL09","title":"Undiagnosed problems: Hyperammonaemia—Undiagnosed","organization":"British Inherited Metabolic Diseases Group","url":"https://bimdg.org.uk/emergency/undiagnosed-problems/","date_version":"Linked hyperammonaemia PDF last reviewed April 2017.","verified_scope":"Index and 5-page undiagnosed hyperammonaemia PDF inspected.","access":"Free PDF; no open adaptation licence verified.","use_in_mooc":"Faculty comparison: distinguish unknown diagnosis from established UCD; historical framework for emergency differential.","caveat":"Older reviewed document; do not call it 2024 guidance because upload folder says 2024. Cross-check newer expert guidance and local specialist protocol before any clinical job aid."},{"id":"GL10","title":"Acute Illness Materials; Neonate/Infant/Child with Hyperammonemia","organization":"New England Consortium of Metabolic Programs; Boston Children's Hospital","url":"https://www.newenglandconsortium.org/acute-illness","date_version":"Hyperammonaemia page updated 2020; landing page says materials are undergoing review.","verified_scope":"Landing page, hyperammonaemia chapter and Terms of Use inspected.","access":"Free reading; written permission required for reproduction/distribution/display/derivative works.","use_in_mooc":"PG/faculty reading bank and case-design comparison of phenotype, physiology and recovery; link to source.","caveat":"Some protocols may be unavailable during review. Metabolic consultation required; do not reproduce or closely adapt course content without permission."},{"id":"GL11","title":"Syllabus for Training in Clinical Paediatric Metabolic Medicine","organization":"SSIEM","url":"https://www.ssiem.org/training/ssiem-training/training-syllabus.html","date_version":"Landing updated 30 June 2017; linked PDF says updated December 2014; filename includes 2016.","verified_scope":"Landing and six-page clinical syllabus inspected.","access":"Free PDF; no open reuse licence verified.","use_in_mooc":"GOOD/faculty competency gap check: laboratory interpretation, nutrition, counselling, multidisciplinary care, teaching and service design.","caveat":"Specialist-training breadth, not UG minimum or evidence that a MOOC confers specialist competence. Use current clinical guidance for treatments."},{"id":"GL12","title":"Hyperammonaemia e-learning course","organization":"SSIEM; adapted from Orphan Europe Academy","url":"https://www.ssiem.org/learning/","date_version":"No clinical revision date visible on landing.","verified_scope":"Landing/acknowledgements only; course behind details form not completed or reviewed.","access":"Advertised open learning; approx. four hours; no completion certificate.","use_in_mooc":"Optional PG/faculty external study; instructional comparison after authorised access and review.","caveat":"Do not list unseen lesson contents as acquired. Open learning does not imply open licensing."},{"id":"GL13","title":"Online Inherited Metabolic Disease WebApp / International Classification of Inherited Metabolic Disorders","organization":"ICIMD maintainers Zschocke, Ferreira and Rahman; OIMD","url":"https://oimd.org/","date_version":"Living database; founding classification paper 2021 (JIMD 44:164–177).","verified_scope":"Official indexed landing and founding-paper abstract/results inspected; interactive full database not audited.","access":"Public web app; article accessible through PMC; reuse licence not established in this pass.","use_in_mooc":"GOOD/faculty classification browser; NICE connect disease families to biology. Use original simplified maps, not compulsory disease-count memorisation.","caveat":"The founding paper's 1,450 disorders is a 2021 count, not a verified current total. Current home is OIMD."},{"id":"GL14","title":"Recommendations for the Diagnosis and Therapeutic Management of Hyperammonaemia in Paediatric and Adult Patients","organization":"Bélanger-Quintana et al.; Nutrients","url":"https://doi.org/10.3390/nu14132755","date_version":"2 July 2022; 14(13):2755","verified_scope":"Full open-access PMC article inspected during lesson authoring; expert-panel recommendations, not a universal paediatric protocol.","access":"Full article available; CC BY 4.0 stated.","use_in_mooc":"Faculty evidence comparison: sampling, monitoring, urgent escalation, acquired causes, nutritional support and diagnosis-specific exceptions.","caveat":"Expert-panel protocol, not universal paediatric consensus. Reconcile threshold differences with specialist/ICU/nephrology review; do not paste dosing tables. Article reports industry-funded writing/APC."},{"id":"CP01","title":"NMC CBME Curriculum 2024 and clarification index","organization":"National Medical Commission","url":"https://www.nmc.org.in/rules-regulations-nmc/","date_version":"Revised curriculum 12 September 2024; additional clarification 10 October 2024","verified_scope":"Official indexed listing and official curriculum cover notice verified. Earlier August version withdrawn; revised version applies from 2024–25 MBBS batch. Exact subject competency codes not verified in this pass.","access":"Public documents; direct NMC fetch repeatedly failed.","use_in_mooc":"Check UG scope against paediatrics, biochemistry, genetics, communication and emergency competencies when authoritative full PDF is available.","caveat":"Proposed outcomes are not a completed code-level crosswalk or NMC endorsement. Do not use an earlier withdrawn document."},{"id":"CP02","title":"NMC PG Curriculum — MD Paediatrics","organization":"National Medical Commission","url":"https://www.nmc.org.in/information-desk/for-colleges/pg-curricula-2/","date_version":"Live official curriculum index checked September 2026; exact PDF revision to verify","verified_scope":"Official indexed PG curriculum listing identified. Full curriculum could not be reliably fetched for exact competency extraction.","access":"Public index; full PDF access needs retry/acquisition.","use_in_mooc":"Complete a PG competency crosswalk for clinical assessment, investigation, initial management, counselling, teaching and referral.","caveat":"Do not present inferred PG requirements as verbatim NMC competencies. Exact revised document and wording remain an acquisition task."},{"id":"CP03","title":"Affordable Price of Injections for Serious Injuries — March 2026 rare-disease support statement","organization":"Press Information Bureau; Department of Pharmaceuticals","url":"https://www.pib.gov.in/PressReleasePage.aspx?PRID=2239572","date_version":"13 March 2026","verified_scope":"Full official statement inspected. Reports up to Rs50 lakh per patient, 63 identified rare diseases and 15 designated CoEs on that date.","access":"Public official release.","use_in_mooc":"Dated background for family access and NPRD navigation teaching.","caveat":"Not proof of individual eligibility or payment. March CoE count is not current September count because later designation notices exist."},{"id":"CP04","title":"MoHFW Acts and Policies — July 2026 AIIMS Nagpur CoE notice and March NPRD amendment","organization":"Department of Health and Family Welfare, Ministry of Health and Family Welfare","url":"https://www.mohfw-dohfw.gov.in/documents/acts-and-policies","date_version":"Nagpur inclusion OM 10 July 2026, listing published 14 July; amendment 10 March 2026","verified_scope":"Official listing verified, including AIIMS Nagpur inclusion and NPRD guideline amendment. Complete operative attachments not fully reviewed in this pass.","access":"Public official index with linked documents.","use_in_mooc":"Maintain current policy/referral source list; obtain operative amendments before constructing the family access pathway.","caveat":"Do not hard-code a total by simply adding to an older count. Verify the complete current list and actual clinical services before referrals."},{"id":"CP05","title":"UMMID initiative and NIDAN Kendras programme document","organization":"Department of Biotechnology, Government of India","url":"https://dbtindia.gov.in/sites/default/files/Advt_UMMID_10062020_1.pdf","date_version":"2020 programme document","verified_scope":"Official nine-page programme document accessible; genetics, training, screening and counselling roles identified.","access":"Public government PDF.","use_in_mooc":"Indian genetics infrastructure and counselling context; explain how programme capacity connects to clinical referral needs.","caveat":"Historical programme document, not a current service-availability or emergency-contact directory. Verify live sites and services separately."},{"id":"ED01","title":"Test-enhanced learning of clinical reasoning: a crossover randomised trial","organization":"Raupach et al.; Medical Education / PubMed","url":"https://pubmed.ncbi.nlm.nih.gov/27295475/","date_version":"2016","verified_scope":"Primary study abstract inspected. Repeated key-feature questions improved retained clinical-reasoning test performance compared with case study alone in this setting.","access":"Public abstract; full article access depends on publisher/library.","use_in_mooc":"Build repeated decision questions into longitudinal cases and evaluate retention with new items.","caveat":"Evidence from another medical-education setting; it does not validate this IEM MOOC or demonstrate independent bedside competence."},{"id":"ED02","title":"Comparing different retrieval practice strategies using virtual patients: a stratified randomized trial","organization":"Gianotto-Oliveira et al.; Medical Teacher / PubMed","url":"https://pubmed.ncbi.nlm.nih.gov/41503782/","date_version":"Online 7 January 2026; June 2026 issue","verified_scope":"Primary study abstract inspected. Eighty fifth-year medical students studied virtual cases and received different retrieval tasks with later retention testing.","access":"Public abstract; publisher full text may require access.","use_in_mooc":"Include short-answer recall alongside multiple-choice and branching cases, then pilot the mix by learner role.","caveat":"Small study outside Indian IEM education; do not claim that one format universally produces superior competence."},{"id":"ED03","title":"Does spaced education improve clinical knowledge among Family Medicine residents? A cluster randomized controlled trial","organization":"Advances in Health Sciences Education / PubMed","url":"https://pubmed.ncbi.nlm.nih.gov/33389233/","date_version":"2021 publication; DOI 10.1007/s10459-020-10020-z","verified_scope":"Primary study abstract inspected. Alerts encouraging spaced learning did not produce the planned meaningful certification-exam advantage in this residency trial.","access":"Public abstract.","use_in_mooc":"Require a course-specific evaluation rather than assuming reminders or technology establish learning gains.","caveat":"Contrasting evidence: educational design effects depend on participation, implementation, context and outcome chosen."},{"id":"ED04","title":"Web Content Accessibility Guidelines (WCAG) 2.2","organization":"World Wide Web Consortium","url":"https://www.w3.org/TR/WCAG22/","date_version":"Version 2.2; live recommendation checked 11 September 2026","verified_scope":"Official standard inspected, including captions, text alternatives, contrast and interaction requirements.","access":"Public official standard.","use_in_mooc":"Specify captions, accessible text and controls, keyboard use and sufficient contrast; target AA and test the delivered course.","caveat":"A design intention is not a conformance audit. Add low-bandwidth/offline alternatives as a separate course design decision."},{"id":"E01","title":"Consensus guidelines for management of hyperammonaemia in paediatric patients receiving continuous kidney replacement therapy","url":"https://www.nature.com/articles/s41581-020-0267-8","date_version":"Raina et al., 8 April 2020; Nature Reviews Nephrology 16:471–482","verified_scope":"Full official article inspected 11 September 2026: urgency, stabilisation, specialist clearance, evidence limitations and individualised escalation.","access":"Public full text; open-access article.","caveat":"Specialist expert consensus based largely on case reports and retrospective data; do not reuse its dosing, nutritional recipes or thresholds as a universal Indian bedside protocol. No promise that proposed review cycle was completed."},{"id":"E02","title":"NH3V: Ammonia, Plasma — Mayo Clinic Laboratories test catalogue","url":"https://www.mayocliniclabs.com/test-catalog/overview/35130","date_version":"Live catalogue checked 11 September 2026; no single page revision date identified.","verified_scope":"Official specimen, processing, interpretation and caution sections inspected; handling errors can cause false elevation.","access":"Public laboratory catalogue.","caveat":"Illustrates one assay's requirements. Do not copy its reference intervals, tube, volume or shipping timetable into a local emergency collection SOP."},{"id":"E03","title":"OAU: Organic Acids Screen, Random, Urine — Mayo Clinic Laboratories Rochester","url":"https://mml.testcatalog.org/show/OAU","date_version":"Live catalogue checked 11 September 2026; ©2026 notice.","verified_scope":"Official performing-laboratory catalogue inspected: specimen requirements, clinical information, collection-state effects and qualitative reporting.","access":"Public laboratory catalogue.","caveat":"One laboratory's assay. Confirm actual receiving-laboratory sample acceptance and local logistics; its published turnaround does not define an emergency pathway elsewhere."},{"id":"E04","title":"Classic Galactosemia and Clinical Variant Galactosemia","url":"https://www.ncbi.nlm.nih.gov/books/NBK1518/","date_version":"GeneReviews; last update 11 March 2021.","verified_scope":"Full chapter accessible; neonatal presentation, E. coli sepsis coexistence and diagnosis sections inspected 11 September 2026.","access":"Free chapter reading; GeneReviews reuse terms.","caveat":"Classic and clinical variant galactosaemia are not interchangeable with all biochemical variants. The MOOC paraphrases brief clinical points and does not reproduce feeding protocols or chapter figures."},{"id":"E05","title":"Maple Syrup Urine Disease","url":"https://www.ncbi.nlm.nih.gov/books/NBK1319/","date_version":"GeneReviews; last update 23 April 2020.","verified_scope":"Full chapter accessible; neonatal presentation and amino-acid/alloisoleucine diagnostic sections inspected 11 September 2026.","access":"Free chapter reading; GeneReviews reuse terms.","caveat":"Use as a disease exemplar; verify current specialist management separately. Do not copy numeric schedules, diet prescriptions or figures."},{"id":"E06","title":"Recognition of the seriously unwell neonate and young infant","url":"https://www.rch.org.au/clinicalguide/guideline_index/Recognition_of_the_seriously_unwell_neonate_and_young_infant/","date_version":"Royal Children's Hospital Melbourne; updated May 2025.","verified_scope":"Full official guideline inspected 11 September 2026: nonspecific presentations, absent fever, broad differential, senior review and early infection care.","access":"Free clinical webpage; open reuse licence not established.","caveat":"Australian clinical guidance; only general recognition and coordination principles used. Treatment choices must follow local Indian neonatal protocols and specialist review."},{"id":"T01","title":"Standards and guidelines for the interpretation of sequence variants: ACMG/AMP joint consensus recommendation","url":"https://www.cmgg.be/assets/bestanden/Richards-et-al-ACMG-guidelines-2015.pdf","date_version":"Richards et al., Genetics in Medicine 2015;17:405–424; DOI 10.1038/gim.2015.30","verified_scope":"Full 38-page author manuscript hosted by Centre for Medical Genetics Ghent inspected, including the five classifications, integration with clinical evidence and prohibition on VUS-led clinical decisions.","access":"Free author-manuscript PDF; publisher and PMC direct fetch intermittently failed.","caveat":"Foundational framework, not a current gene-specific rule set or a complete genomics course. No reproduced tables or figures; apply current laboratory and disease-specific interpretation."},{"id":"T02","title":"Biotinidase Deficiency — GeneReviews","url":"https://www.ncbi.nlm.nih.gov/books/NBK1322/","date_version":"Last revision 19 February 2026","verified_scope":"Full chapter inspected for presentation, enzyme confirmation, treatment principles, irreversible injury, autosomal recessive risks and reproductive testing.","access":"Freely readable GeneReviews chapter.","caveat":"Chapter-specific GeneReviews terms apply; no dosing reproduced. Evidence concerns biotinidase deficiency, not empirical treatment of all regression."},{"id":"T03","title":"Wilson Disease — GeneReviews","url":"https://www.ncbi.nlm.nih.gov/books/NBK1512/","date_version":"Last update 12 January 2023","verified_scope":"Full chapter accessed; hepatic and neuropsychiatric presentation, combined diagnostic evidence and acute liver-failure urgency inspected.","access":"Freely readable GeneReviews chapter.","caveat":"Illustrative treatable inherited disorder; no diagnostic score, drug prescription or standalone diagnostic rule reproduced."},{"id":"T04","title":"Pompe Disease — GeneReviews","url":"https://www.ncbi.nlm.nih.gov/books/NBK1261/","date_version":"Current chapter accessed 11 September 2026; internal revision date not reliably extracted","verified_scope":"Full chapter accessed; infantile versus later-onset phenotypes, confirmation and enzyme-replacement principles inspected.","access":"Freely readable GeneReviews chapter; intermittent page/find errors.","caveat":"Verify internal clinical revision before protocol use. Does not establish Indian drug availability, treatment eligibility or pricing."},{"id":"T05","title":"Phenylalanine Hydroxylase Deficiency — GeneReviews","url":"https://www.ncbi.nlm.nih.gov/books/NBK1504/","date_version":"Last revision 20 November 2025","verified_scope":"Full chapter accessed; disease-specific nutrition, multidisciplinary care, nutritional monitoring and developmental/psychosocial follow-up inspected.","access":"Freely readable GeneReviews chapter.","caveat":"US-oriented guideline context; treatments or authorisation discussed in the chapter must not be assumed available in India. No dietary targets or dosing reproduced."},{"id":"T06","title":"Maple Syrup Urine Disease — GeneReviews","url":"https://www.ncbi.nlm.nih.gov/books/NBK1319/","date_version":"Last update 23 April 2020","verified_scope":"Full chapter accessed; illness-associated catabolism, outpatient suitability limits, hospital care for neurological deterioration and personalised treatment inspected.","access":"Freely readable GeneReviews chapter.","caveat":"Older chapter used for stable principles, not a current emergency prescription. Specialist plan and current local protocol determine management. No dosing or formula recipes reproduced."},{"id":"T07","title":"Newborn Screening Results and Follow-Up — HRSA","url":"https://newbornscreening.hrsa.gov/newborn-screening-process/newborn-screening-results-and-follow","date_version":"Last reviewed December 2024","verified_scope":"Full official US government page inspected for screen-positive follow-up, false positive/negative results and symptomatic assessment.","access":"Free official government webpage.","caveat":"US process and timing are not Indian programme requirements; the course uses only general screening interpretation principles."},{"id":"T08","title":"Primary Mitochondrial Disorders Overview — GeneReviews","url":"https://www.ncbi.nlm.nih.gov/books/NBK1224/","date_version":"Last update 29 July 2021","verified_scope":"Full chapter accessed; nuclear versus mitochondrial DNA inheritance, heteroplasmy and counselling uncertainty inspected.","access":"Freely readable GeneReviews chapter.","caveat":"Overview supports inheritance principles, not individual recurrence estimates or current reproductive procedures. Specialist, diagnosis-specific counselling required."},{"id":"T09","title":"Cerebral palsy in under 25s: assessment and management — NICE NG62","url":"https://www.nice.org.uk/guidance/ng62/chapter/Recommendations","date_version":"Published 25 January 2017; official indexed recommendations checked 11 September 2026","verified_scope":"Official indexed recommendations and full-guideline evidence text inspected for loss of attained abilities, progressive neurological red flags and continuing multidisciplinary care.","access":"Official indexed text accessible; direct page fetch returned 403.","caveat":"Red-flag recommendations arose from committee consensus, not retrieved diagnostic-accuracy studies. UK guidance is used for reasoning, not as an Indian service mandate."},{"id":"PCNA01","title":"Inborn Errors of Metabolism Overview: Pathophysiology, Manifestations, Evaluation, and Management","url":"https://doi.org/10.1016/j.pcl.2017.11.002","date_version":"Pediatr Clin North Am. 2018;65:179–208","verified_scope":"Full text supplied by the course author and reviewed for the chapter-based teaching extension.","access":"DOI landing page; local full text supplied for course development.","caveat":"A 2018 narrative review. Treatment details must be reconciled with current specialist and local protocols."},{"id":"PCNA02","title":"Inborn Errors of Metabolism with Acidosis: Organic Acidemias and Defects of Pyruvate and Ketone Body Metabolism","url":"https://doi.org/10.1016/j.pcl.2017.11.003","date_version":"Pediatr Clin North Am. 2018 issue","verified_scope":"Full text supplied and reviewed for clinical patterns, differential diagnosis and initial principles.","access":"DOI landing page; local full text supplied for course development.","caveat":"A 2018 narrative review; it is not a stand-alone emergency protocol."},{"id":"PCNA03","title":"Inborn Errors of Metabolism with Hyperammonemia: Urea Cycle Defects and Related Disorders","url":"https://doi.org/10.1016/j.pcl.2017.11.004","date_version":"Pediatr Clin North Am. 2018 issue","verified_scope":"Full text supplied and reviewed for recognition and diagnostic reasoning.","access":"DOI landing page; local full text supplied for course development.","caveat":"Use current metabolic/PICU guidance and laboratory-specific ammonia procedures for patient care."},{"id":"PCNA04","title":"Inborn Errors of Metabolism with Hypoglycemia: Glycogen Storage Diseases and Inherited Disorders of Gluconeogenesis","url":"https://doi.org/10.1016/j.pcl.2017.11.005","date_version":"Pediatr Clin North Am. 2018;65:247–265","verified_scope":"Full text supplied and reviewed for physiology, phenotyping and diagnostic patterns.","access":"DOI landing page; local full text supplied for course development.","caveat":"Nutrition and fasting plans require an individual specialist prescription."},{"id":"PCNA05","title":"Inborn Errors of Metabolism with Cognitive Impairment","url":"https://doi.org/10.1016/j.pcl.2017.11.009","date_version":"Pediatr Clin North Am. 2018;65:267–277","verified_scope":"Full text supplied and reviewed for treatable causes and phenotype-directed evaluation.","access":"DOI landing page; local full text supplied for course development.","caveat":"Examples support pattern recognition and do not form a universal screening panel."},{"id":"PCNA06","title":"Inborn Errors of Metabolism with Seizures: Defects of Glycine and Serine Metabolism and Cofactor-Related Disorders","url":"https://doi.org/10.1016/j.pcl.2017.11.007","date_version":"Pediatr Clin North Am. 2018 issue","verified_scope":"Full text supplied and reviewed for neonatal/refractory seizure phenotypes and diagnostic reasoning.","access":"DOI landing page; local full text supplied for course development.","caveat":"Cofactor trials and CSF investigations require specialist protocols and monitoring."},{"id":"PCNA07","title":"Inborn Errors of Metabolism with Movement Disorders: Defects in Metal Transport and Neurotransmitter Metabolism","url":"https://doi.org/10.1016/j.pcl.2017.11.010","date_version":"Pediatr Clin North Am. 2018;65:301–315","verified_scope":"Full text supplied and reviewed for movement phenomenology and targeted investigation.","access":"DOI landing page; local full text supplied for course development.","caveat":"Specialised CSF neurotransmitter sampling is protocol-sensitive and specialist led."},{"id":"PCNA08","title":"Inborn Errors of Metabolism with Myopathy: Defects of Fatty Acid Oxidation and the Carnitine Shuttle System","url":"https://doi.org/10.1016/j.pcl.2017.11.006","date_version":"Pediatr Clin North Am. 2018 issue","verified_scope":"Full text supplied and reviewed for fasting/exercise-related muscle and cardiac presentations.","access":"DOI landing page; local full text supplied for course development.","caveat":"Emergency and exercise prescriptions must be individualised."},{"id":"PCNA09","title":"Inborn Errors of Metabolism with Hepatopathy: Metabolism Defects of Galactose, Fructose, and Tyrosine","url":"https://doi.org/10.1016/j.pcl.2017.11.008","date_version":"Pediatr Clin North Am. 2018;65:337–352","verified_scope":"Full text supplied and reviewed for diet-linked hepatic phenotypes and diagnostic distinctions.","access":"DOI landing page; local full text supplied for course development.","caveat":"Disease-specific dietary or drug treatment requires current specialist guidance."},{"id":"PCNA10","title":"Inborn Errors of Metabolism of Complex Molecules: Lysosomal and Peroxisomal Storage Diseases","url":"https://doi.org/10.1016/j.pcl.2017.11.011","date_version":"Pediatr Clin North Am. 2018;65:353–373","verified_scope":"Full text supplied and reviewed for multisystem storage and peroxisomal phenotypes.","access":"DOI landing page; local full text supplied for course development.","caveat":"Treatment availability and eligibility change; verify with the treating centre."},{"id":"PCNA11","title":"Complex Phenotypes in Inborn Errors of Metabolism: Overlapping Presentations in CDG and Mitochondrial Disorders","url":"https://doi.org/10.1016/j.pcl.2017.11.012","date_version":"Pediatr Clin North Am. 2018;65:375–388","verified_scope":"Full text supplied and reviewed for discriminating features and modern diagnostic reasoning.","access":"DOI landing page; local full text supplied for course development.","caveat":"Genetic testing strategies and disease classifications have expanded since publication."}],"cases":[{"id":"case-a","name":"Aarav","age":"4 days","setting":"District hospital","title":"Well yesterday. Hard to wake today.","intro":"Aarav was feeding well after birth. Today he feeds poorly and is increasingly drowsy. His parents report no known inherited condition. Your team starts an urgent clinical assessment. This fictional case asks you to make the next useful decision before the diagnosis is known.","sourceIds":["IN01","GL04"],"steps":[{"id":"ca1","stem":"How should the team frame the problem now?","options":[{"text":"Stabilise and assess common causes while adding a metabolic evaluation.","feedback":"Acute care and a metabolic differential can proceed together.","consequence":"The team assigns parallel clinical and sample-collection tasks."},{"text":"Finish the infection workup first, then consider a second diagnostic pathway.","feedback":"A sequential approach can postpone a time-sensitive metabolic assessment.","consequence":"A senior asks the team to reconsider the delay before proceeding."},{"text":"Prioritise genetic testing because the initial well interval proves an inherited disorder.","feedback":"The interval is a clue; it does not establish an inherited diagnosis.","consequence":"The team returns to immediate clinical and biochemical priorities."},{"text":"Use the absence of family history to make IEM a remote outpatient question.","feedback":"An affected relative is often not known when a first child presents.","consequence":"The history is retained, but it cannot dismiss the present illness."}],"answer":0,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["IN01","GL04"],"reveal":"At triage: a previously well neonate now has poor feeding and altered responsiveness. Immediate physiological assessment and stabilisation are underway."},{"id":"ca2","stem":"Which interpretation best guides the next action?","options":[{"text":"The ammonia result settles the exact urea-cycle diagnosis.","feedback":"A major ammonia elevation requires action, but can have more than one cause.","consequence":"The exact diagnosis remains open."},{"text":"Because collection errors occur, defer escalation until a repeat is available.","feedback":"Check the specimen and repeat appropriately without suspending urgent clinical escalation.","consequence":"The consultant asks for clinical action and a specimen-quality check in parallel."},{"text":"Treat this as urgent hyperammonaemia; involve metabolic and critical-care teams while evaluating the cause.","feedback":"The urgency does not depend on completing molecular confirmation.","consequence":"A specialist call begins and the team shares the clinical state, results and collection details."},{"text":"The absence of severe acidosis makes a metabolic emergency unlikely.","feedback":"Some metabolic presentations do not begin with severe acidosis.","consequence":"The team revises the pattern interpretation."}],"answer":2,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["IN01","GL04"],"reveal":"The laboratory phones an ammonia result of 486 µmol/L. Aarav remains unwell. The laboratory is checking collection and processing details. This value belongs to the fictional case; treatment decisions require the applicable specialist protocol."},{"id":"ca3","stem":"What makes the referral handover most useful?","options":[{"text":"Send only the working disease label to keep the call brief.","feedback":"A label alone omits information needed to plan transport and care.","consequence":"The receiving clinician requests the missing clinical details."},{"text":"Give the current condition, time-stamped results and units, treatment already given, available samples and transfer needs.","feedback":"The receiving team needs the patient trajectory and actions, not only a diagnosis hypothesis.","consequence":"Both teams agree the next responsibilities and transport plan."},{"text":"Wait to collect every specialised specimen before discussing transfer.","feedback":"A complete test set is not a prerequisite for discussing urgent transfer.","consequence":"The team makes the call while feasible samples are organised."},{"text":"Ask the family to arrange a routine appointment at any listed CoE.","feedback":"Emergency care requires a receiving service and transport plan appropriate to the child’s condition.","consequence":"The team arranges clinician-to-clinician escalation."}],"answer":1,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["IN01","GL03"],"reveal":"The hospital cannot provide all of the care Aarav may need. A receiving centre is being contacted. The first available metabolic send-out test will take days."}],"debrief":"You did not need the exact enzyme defect to identify urgency. The key achievement was keeping resuscitation, common causes, useful samples and specialist escalation moving together. The fictional case ends with transfer planning; it does not assert a final molecular diagnosis."},{"id":"case-b","name":"Meera","age":"18 months","setting":"Medical-college emergency","title":"The ketones that were barely there.","intro":"Meera has a febrile illness, vomiting and much less intake than usual. She arrives lethargic. Your team responds to hypoglycaemia. Her mother remembers a similar, milder episode. Explore how physiology can organise your next questions.","sourceIds":["GL05"],"steps":[{"id":"cb1","stem":"What does this combination make you ask?","options":[{"text":"Why is the ketone response low in this clinical context, and what causes must be considered?","feedback":"Interpret glucose and ketones together. The combination raises questions rather than naming one disease.","consequence":"The team records the timing and broadens the differential."},{"text":"Whether a negative urine ketone result excludes metabolic disease.","feedback":"A low ketone response can be part of the clue.","consequence":"The team rechecks the relationship between energy need and available fuel."},{"text":"Whether this proves MCAD deficiency.","feedback":"MCAD is one exemplar; another metabolic or endocrine cause may explain the pattern.","consequence":"The provisional differential stays broader than MCAD."},{"text":"Whether the glucose level should be allowed to fall further to make testing more diagnostic.","feedback":"Diagnostic sampling should not prolong hypoglycaemia or defer treatment.","consequence":"The team rejects deliberate provocation and continues care."}],"answer":0,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["GL05"],"reveal":"Initial glucose is 38 mg/dL (about 2.1 mmol/L). The ketone result is unexpectedly low for the clinical context. The team documents whether the specimen preceded glucose treatment."},{"id":"cb2","stem":"Which diagnostic plan is most defensible?","options":[{"text":"Request exome sequencing alone and ignore the acute biochemical context.","feedback":"Genetics can help, but clinical and biochemical findings guide interpretation.","consequence":"The specialist asks for the illness and laboratory context."},{"text":"Arrange a provocative fast after recovery to reproduce the episode.","feedback":"This course does not propose provocative fasting. Such testing has specific indications and specialist safeguards.","consequence":"The team plans specialist evaluation without asking the family to provoke illness."},{"text":"Call the metabolic/endocrine team, retain useful acute specimens and select further tests from the differential.","feedback":"The question may require both metabolic and endocrine reasoning, with timing documented.","consequence":"A targeted testing plan is agreed, including specimen handling."},{"text":"Use improvement after glucose to exclude inherited disease.","feedback":"Improvement addresses an acute physiological problem; it does not explain why it occurred.","consequence":"The response is documented without ending the diagnostic enquiry."}],"answer":2,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["GL05"],"reveal":"Meera improves with acute care. The team is considering causes of hypoketotic hypoglycaemia, including fatty-acid oxidation disease and excessive insulin action."},{"id":"cb3","stem":"What should the family understand before discharge planning is complete?","options":[{"text":"A generic online diet is sufficient until the next illness.","feedback":"Diet and illness advice need to fit the confirmed or suspected condition and the treating team’s plan.","consequence":"A dietitian and clinician review the advice."},{"text":"Every later symptom must come from the suspected IEM.","feedback":"Children can still develop common unrelated illness.","consequence":"The family receives both routine and escalation advice."},{"text":"The child should avoid all fats indefinitely.","feedback":"A universal restriction is not an individual nutritional prescription.","consequence":"The team clarifies what is and is not being prescribed."},{"text":"The agreed illness plan, signs requiring urgent help, contact route and follow-up, checked by teach-back.","feedback":"Ask caregivers to explain what they would do in a new illness using the actual plan.","consequence":"Meera’s mother rehearses the next steps and identifies one unclear instruction."}],"answer":3,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["GL05"],"reveal":"Meera’s mother asks what to do if vomiting happens again. The final diagnosis is still being evaluated. The family lives far from the hospital."}],"debrief":"The useful pattern was glucose plus the ketone response, interpreted with feeding, treatment and timing. Keep the cause open until confirmatory evidence supports it. The family’s usable illness and follow-up plan is part of care."},{"id":"case-c","name":"Kabir","age":"7 years","setting":"Paediatric outpatient clinic","title":"A skill lost is a new clue.","intro":"Kabir previously walked independently and used sentences. His family describes a new unsteady gait and loss of previously used words. Earlier records mention developmental delay. Your task is to distinguish a familiar label from a changing clinical trajectory.","sourceIds":["IN05","GL03"],"steps":[{"id":"cc1","stem":"Which finding should change the assessment?","options":[{"text":"The earlier developmental-delay label means the current change is expected.","feedback":"A previous label does not explain new loss of acquired skills.","consequence":"The history is reopened around what Kabir could do before."},{"text":"Documented loss of acquired skills warrants a fresh clinical evaluation.","feedback":"Define what was gained, lost and when, then consider neurological, metabolic and other causes.","consequence":"The family and team construct a dated developmental timeline."},{"text":"Regression establishes a treatable metabolic diagnosis.","feedback":"Regression is an important clue but has a broad differential.","consequence":"The team avoids promising a diagnosis before evaluation."},{"text":"A metabolic workup should precede examination and history.","feedback":"Phenotype and trajectory help select meaningful investigations.","consequence":"The examination and history guide the next tests."}],"answer":1,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["IN05","GL03"],"reveal":"Kabir’s school records and parent videos support a true change in abilities over several months. There is no single explanatory diagnosis yet."},{"id":"cc2","stem":"How should the molecular finding be used?","options":[{"text":"Treat the uncertain variant as a confirmed diagnosis if the gene sounds relevant.","feedback":"A VUS is not equivalent to a pathogenic finding.","consequence":"The report needs expert interpretation in clinical context."},{"text":"Dismiss the clinical concern because the report was not diagnostic.","feedback":"An inconclusive molecular result does not explain away the phenotype.","consequence":"Clinical evaluation continues."},{"text":"Integrate phenotype, biochemical evidence, inheritance and expert variant interpretation.","feedback":"Concordance matters. Additional targeted testing or re-evaluation may be appropriate.","consequence":"The team identifies what evidence would strengthen or weaken the proposed link."},{"text":"Offer one fixed recurrence-risk figure for every IEM.","feedback":"Risk depends on the diagnosis and inheritance, which are not settled here.","consequence":"Counselling distinguishes what is known from what remains uncertain."}],"answer":2,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["IN04"],"reveal":"A previous exome report lists a variant of uncertain significance in a metabolic gene. No matching biochemical confirmation is documented."},{"id":"cc3","stem":"Which explanation best balances hope and accuracy?","options":[{"text":"Some causes can be treated; the next tests aim to identify those relevant to Kabir, while support continues.","feedback":"An honest explanation can offer purpose without guaranteeing a treatable answer.","consequence":"The family understands the reason for testing and the immediate support plan."},{"text":"All inherited metabolic diseases are curable if found early.","feedback":"Treatments and outcomes vary by condition.","consequence":"The team corrects an overpromise."},{"text":"Support for mobility and school should wait for a final diagnosis.","feedback":"Present needs deserve attention during the investigation.","consequence":"Rehabilitation and school communication are included now."},{"text":"Only the molecular report needs discussion with the family.","feedback":"Families also need the plan, uncertainties and practical next steps.","consequence":"The discussion expands to Kabir’s daily life and follow-up."}],"answer":0,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["IN05","GL04"],"reveal":"The parents ask whether the new tests will “cure the problem”. Kabir also needs help with mobility and participating at school."}],"debrief":"Trajectory changed the question. A VUS did not settle it. The clinical task is to seek relevant treatable causes, communicate uncertainty and support the child while evaluation proceeds."},{"id":"case-d","name":"Sana","age":"8 days","setting":"Screening recall and follow-up","title":"A positive screen. A worried family.","intro":"Sana’s family receives a call about an out-of-range newborn-screening marker. They are told to speak to a clinician. Sana appears well to her parents. No confirmed diagnosis is available. Work through the recall, explanation and access decisions.","sourceIds":["GL07","IN06"],"steps":[{"id":"cd1","stem":"What is the best next step?","options":[{"text":"Wait for symptoms because Sana currently appears well.","feedback":"Some screening findings need time-critical follow-up before symptoms.","consequence":"The clinician clarifies the marker and recommended timeframe."},{"text":"Tell the family the screening label is already the final diagnosis.","feedback":"A screening result identifies a need for assessment and confirmation.","consequence":"The clinician explains the difference without minimising the follow-up."},{"text":"Repeat the same screen whenever convenient and take no further action.","feedback":"The correct pathway depends on the marker and clinical state; repeating alone may not be enough.","consequence":"The team checks the relevant recall and confirmation pathway."},{"text":"Identify the exact marker, assess Sana’s condition and arrange the appropriate prompt specialist/confirmatory pathway.","feedback":"The marker and the child’s condition determine urgency and the next tests.","consequence":"A specific follow-up plan is agreed with the family."}],"answer":3,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["GL07","IN06"],"reveal":"The report identifies a potentially time-critical metabolic marker. The family is unsure where the confirmatory tests can be done."},{"id":"cd2","stem":"What is the most accurate explanation?","options":[{"text":"Every child with a normal screen is protected against all IEMs.","feedback":"Panels and test performance have limits. Symptoms always deserve clinical assessment.","consequence":"The family understands that screening has a defined scope."},{"text":"The screen tells us who needs further evaluation; the confirmatory pathway tells us whether this condition is present.","feedback":"This distinguishes screening from diagnosis while keeping follow-up purposeful.","consequence":"The parents can explain the purpose of the next appointment."},{"text":"Because false positives occur, the result can be ignored.","feedback":"Possibility of a false positive does not remove the need for timely follow-up.","consequence":"The clinician reinforces the agreed plan."},{"text":"A private panel in one city establishes what all Indian newborns are screened for.","feedback":"Screening availability and panels vary.","consequence":"The report’s actual panel and local pathway are reviewed."}],"answer":1,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["GL07","IN06"],"reveal":"Sana’s parents ask whether a positive screen proves disease and whether their older child’s normal screen excludes every metabolic condition."},{"id":"cd3","stem":"Which access advice is appropriate?","options":[{"text":"Promise the family a fixed payment because the condition is rare.","feedback":"Financial assistance depends on applicable criteria and procedures, not rarity alone.","consequence":"The family is referred for an eligibility and documentation assessment."},{"text":"Assume any centre on an old list offers the same services today.","feedback":"Designation and actual available services must be checked.","consequence":"The team verifies a receiving service and the route."},{"text":"Use current official policy and a verified centre to clarify eligibility, documents and available care.","feedback":"A navigable plan is more useful than an unverified funding promise.","consequence":"The family leaves with the next contact, documents to assemble and follow-up date."},{"text":"Postpone confirmatory clinical follow-up until all financial questions are resolved.","feedback":"Urgent clinical follow-up and access support should move together.","consequence":"The team coordinates the two tasks."}],"answer":2,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["CP03","CP04"],"reveal":"The family asks about government support and travel costs. The clinician checks current official policy rather than relying on a saved social-media message."}],"debrief":"A screening result starts a pathway. Accurate explanation, timely confirmation and practical access support all matter. Counselling about another pregnancy should use the eventual diagnosis and its inheritance pattern."}],"baseline":[{"id":"b1","stem":"Before you start: a newborn becomes unwell before the screening result returns. Which statement best guides you?","options":[{"text":"The clinical condition determines urgent evaluation; screening can be followed up in parallel.","feedback":"Clinical assessment should not wait for screening."},{"text":"A pending screen means IEM evaluation should wait.","feedback":"A child can become ill before the result is available."},{"text":"Screening replaces the initial clinical and biochemical assessment.","feedback":"These serve different purposes."},{"text":"Only children with affected relatives need metabolic consideration.","feedback":"A family history is not required."}],"answer":0,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["GL03"]},{"id":"b2","stem":"An abnormal biochemical pattern should usually be treated as…","options":[{"text":"A final molecular diagnosis.","feedback":"A pattern is not a molecular diagnosis."},{"text":"A clue to organise the differential and next tests.","feedback":"Use it with the phenotype, timing and specimen context."},{"text":"A reason to ignore common acquired causes.","feedback":"Acquired causes remain relevant."},{"text":"Meaningless until every gene has been sequenced.","feedback":"Biochemistry can guide immediate decisions and testing."}],"answer":1,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["GL03"]},{"id":"b3","stem":"The most useful course outcome is the ability to…","options":[{"text":"Recall the largest possible disease list.","feedback":"Recall alone does not show a useful approach."},{"text":"Apply one emergency diet to all IEMs.","feedback":"Plans must be individualised."},{"text":"Avoid consulting specialists by using an online algorithm.","feedback":"Early specialist collaboration is part of a sound approach."},{"text":"Explain and prioritise the next clinical decisions within your role.","feedback":"That is what the cases and checks will practise."}],"answer":3,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["GL03"]}],"finalQuestions":[{"id":"f1","stem":"A child has recurrent illness-related encephalopathy but no known affected relatives. What is the best interpretation?","options":[{"text":"No affected relatives makes inherited disease impossible.","feedback":"Absence of a known family history is not exclusion."},{"text":"The recurring clinical pattern warrants evaluation alongside other causes.","feedback":"Use the trajectory to guide assessment."},{"text":"Related parents are required before further metabolic testing.","feedback":"That condition would miss relevant presentations."},{"text":"Recurrent episodes prove a single metabolic diagnosis.","feedback":"Several conditions can produce recurrent episodes."}],"answer":1,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["GL03"]},{"id":"f2","stem":"A sick infant needs stabilisation and a specialised sample courier leaves soon. What should determine the sequence?","options":[{"text":"Finish every specialised sample before treating.","feedback":"Samples should not delay stabilisation."},{"text":"Skip all diagnostic samples because treatment is needed.","feedback":"Useful specimens can often be collected alongside care."},{"text":"Stabilise, collect feasible urgent samples in parallel and record treatment/sample times.","feedback":"Parallel work preserves care and interpretation."},{"text":"Ask the family to transport an unlabelled tube later.","feedback":"Correct identification and handling are essential."}],"answer":2,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["GL03"]},{"id":"f3","stem":"Why is a low ketone result important when a child is hypoglycaemic?","options":[{"text":"It can be an inappropriate fuel response that helps organise metabolic and endocrine differentials.","feedback":"Glucose and ketones are more informative together than separately."},{"text":"It rules out a metabolic explanation.","feedback":"A low response can itself be a clue."},{"text":"It names the exact fatty-acid oxidation disorder.","feedback":"The pattern is not sufficiently specific."},{"text":"It means the hypoglycaemia need not be treated.","feedback":"Treatment follows the clinical condition."}],"answer":0,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["GL05"]},{"id":"f4","stem":"Which statement about a negative newborn screen is most accurate?","options":[{"text":"It replaces further evaluation if symptoms later occur.","feedback":"Clinical symptoms still need evaluation."},{"text":"It guarantees all inherited diseases were tested.","feedback":"Panels have a defined scope."},{"text":"It confirms normal metabolism for life.","feedback":"A screening test cannot make that promise."},{"text":"Interpret the actual panel and result, while evaluating concerning symptoms on their merits.","feedback":"Screening does not cover every relevant disorder or presentation."}],"answer":3,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["GL07","IN06"]},{"id":"f5","stem":"Parents ask for a diet while their child’s possible IEM is being investigated. What is the best response?","options":[{"text":"Prescribe lifelong protein elimination for every suspected IEM.","feedback":"That is not an individualised nutrition plan."},{"text":"Arrange a clinician/dietitian plan tied to the condition and current clinical needs.","feedback":"Nutrition must also protect growth and be feasible for the family."},{"text":"Use another family’s plan for a different disorder.","feedback":"Plans cannot be assumed interchangeable."},{"text":"Leave the family with no interim instructions.","feedback":"The treating team should provide appropriate interim and escalation advice."}],"answer":1,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["GL05","IN01"]},{"id":"f6","stem":"During referral for suspected metabolic deterioration, which handover is strongest?","options":[{"text":"The disease name alone.","feedback":"The receiving service needs clinical and time-related information."},{"text":"A photograph of a result without units or treatment details.","feedback":"Those missing details affect interpretation."},{"text":"Current status, time-stamped findings with units, treatment, specimens, contact and transfer needs.","feedback":"This makes the next team’s decisions possible."},{"text":"A list of rare diseases without a clinical summary.","feedback":"The child’s actual trajectory takes priority."}],"answer":2,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["GL03"]},{"id":"f7","stem":"A diagnostic sample was collected after glucose treatment and recovery. How should you interpret a reassuring result?","options":[{"text":"With timing and treatment context; ask whether further targeted assessment is needed.","feedback":"Some biochemical findings depend on the clinical state."},{"text":"As absolute exclusion of the suspected disorder.","feedback":"The context may limit that conclusion."},{"text":"As proof that the first abnormality was fabricated.","feedback":"That conclusion does not follow."},{"text":"By ignoring all earlier clinical information.","feedback":"The full trajectory remains relevant."}],"answer":0,"critical":false,"roles":["PG","Faculty"],"sourceIds":["GL05"]},{"id":"f8","stem":"A plausible metabolic gene contains a VUS. What strengthens diagnostic reasoning?","options":[{"text":"Calling it pathogenic because the disease is treatable.","feedback":"Treatability does not classify a variant."},{"text":"Giving a definitive recurrence estimate before diagnosis.","feedback":"Risk counselling must reflect the uncertainty."},{"text":"Equating the report’s gene name with causation.","feedback":"The gene name is insufficient."},{"text":"Assessing phenotype, biochemical concordance, inheritance and expert interpretation.","feedback":"Converging evidence is stronger than a label alone."}],"answer":3,"critical":false,"roles":["PG","Faculty"],"sourceIds":["IN04"]},{"id":"f9","stem":"Two sources specify different urgent ammonia-management thresholds. What should a local clinical teaching aid do?","options":[{"text":"Average the numbers and present a new threshold.","feedback":"A numerical average is not clinical validation."},{"text":"Reconcile population, context and evidence with metabolic/PICU expertise and an approved local pathway.","feedback":"A teaching aid needs a coherent clinical basis and identified local responsibility."},{"text":"Use the most recent website upload folder as the clinical review date.","feedback":"Upload date and clinical revision can differ."},{"text":"Hide the difference and use whichever number is easier to memorise.","feedback":"That conceals a consequential uncertainty."}],"answer":1,"critical":true,"roles":["PG","Faculty"],"sourceIds":["GL14","IN01"]},{"id":"f10","stem":"An organic-acid-related marker is elevated. What is the next defensible reasoning step?","options":[{"text":"Equate any elevated marker with one inherited subtype.","feedback":"Marker elevation can have several explanations."},{"text":"Ignore nutritional and acquired explanations.","feedback":"Relevant acquired factors remain part of evaluation."},{"text":"Use the phenotype and related biochemical findings to select confirmation and consider alternatives.","feedback":"The next test should discriminate among plausible explanations."},{"text":"Start a permanent diet without establishing an appropriate plan.","feedback":"Treatment planning requires clinical guidance and a justified diagnosis."}],"answer":2,"critical":false,"roles":["PG","Faculty"],"sourceIds":["GL06"]},{"id":"f11","stem":"A family can initially access only limited testing. What should guide prioritisation?","options":[{"text":"Urgency, management consequence and the next discriminating question, coordinated with referral.","feedback":"Prioritise information that changes the next decision."},{"text":"Order the largest panel because more tests always cost less.","feedback":"More testing is not automatically more useful."},{"text":"Wait for every financial issue to resolve before urgent care.","feedback":"Urgent care and access support should proceed together."},{"text":"Select tests solely by turnaround without considering the question.","feedback":"A fast irrelevant result may not help."}],"answer":0,"critical":false,"roles":["PG","Faculty"],"sourceIds":["IN03","CP04"]},{"id":"f12","stem":"For a confirmed inherited disorder, what should counselling about another pregnancy use?","options":[{"text":"One recurrence percentage for every IEM.","feedback":"Inheritance and family findings differ."},{"text":"Only a relative’s internet search.","feedback":"Counselling needs the verified diagnosis and evidence."},{"text":"A guarantee that testing can resolve every uncertainty.","feedback":"Explain the actual capabilities and limitations."},{"text":"The specific diagnosis, inheritance, family findings and available specialist reproductive options.","feedback":"Counselling should be accurate, non-directive and diagnosis-specific."}],"answer":3,"critical":false,"roles":["PG","Faculty"],"sourceIds":["IN04","GL04"]},{"id":"f13","stem":"A learner answers every recall question but repeatedly delays escalation in cases. What should the faculty conclude?","options":[{"text":"Recall marks compensate for unsafe decision patterns.","feedback":"They assess different outcomes."},{"text":"The critical-action gap needs feedback and reassessment with another case.","feedback":"Review the reasoning and require another demonstration."},{"text":"The learner must memorise more rare disease names first.","feedback":"That does not directly address the missed action."},{"text":"Confidence alone is adequate evidence of competence.","feedback":"Confidence should be compared with performance."}],"answer":1,"critical":false,"roles":["Faculty"],"sourceIds":["ED01"]},{"id":"f14","stem":"Which audit measure most directly examines your proposed emergency pathway?","options":[{"text":"Total page views of the pathway.","feedback":"Views indicate reach, not timely clinical action."},{"text":"Number of rare diseases in the appendix.","feedback":"That is not a process measure of care."},{"text":"Time from recognised concern to specialist contact, with a clear definition and local context.","feedback":"A defined action and timestamp make the process assessable."},{"text":"Number of colours used in the algorithm.","feedback":"Presentation alone cannot measure clinical delivery."}],"answer":2,"critical":false,"roles":["Faculty"],"sourceIds":["GL11"]},{"id":"f15","stem":"A hospital proposes expanded newborn screening. Which question is essential beyond choosing the assay?","options":[{"text":"Can recall, confirmation, counselling, treatment and follow-up be delivered equitably?","feedback":"A screening programme depends on a functioning pathway after the result."},{"text":"Can a larger panel replace clinical assessment?","feedback":"Screening and clinical assessment have different roles."},{"text":"Can all positive findings be called confirmed disease?","feedback":"Confirmation remains essential."},{"text":"Can detection alone establish that the programme improves outcomes?","feedback":"Assess downstream care and outcomes too."}],"answer":0,"critical":false,"roles":["Faculty"],"sourceIds":["IN06"]},{"id":"f16","stem":"How should a faculty author use a publicly readable course recording or figure?","options":[{"text":"Assume public viewing authorises all redistribution.","feedback":"Access and reuse rights differ."},{"text":"Remove the attribution and change the colour scheme.","feedback":"Cosmetic changes do not establish permission."},{"text":"Describe it as reviewed even if only the course listing was available.","feedback":"The scope of access should be stated accurately."},{"text":"Check the applicable reuse terms and use original explanations or a link when appropriate.","feedback":"Keep attribution and permissions appropriate to the material."}],"answer":3,"critical":false,"roles":["Faculty"],"sourceIds":["IN07","GL10"]},{"id":"f17","stem":"An online course reports high satisfaction and completion. What additional evidence would support learning claims?","options":[{"text":"A more impressive completion badge.","feedback":"A badge is not evidence of retained reasoning."},{"text":"Performance on unfamiliar cases and delayed assessment, interpreted alongside participation and baseline.","feedback":"Evaluate the outcome the course claims to teach."},{"text":"Only the number of minutes of video.","feedback":"Exposure alone does not demonstrate learning."},{"text":"A statement that all graduates are independent specialists.","feedback":"That exceeds what an online assessment establishes."}],"answer":1,"critical":false,"roles":["Faculty"],"sourceIds":["ED01","ED03"]},{"id":"f18","stem":"Your referral directory lists a policy-designated CoE. Before using it for a specific urgent transfer, what matters?","options":[{"text":"The name is enough to assume round-the-clock metabolic services.","feedback":"Designation does not verify all practical capabilities."},{"text":"The oldest saved list should remain permanent for consistency.","feedback":"Directories need current verification."},{"text":"Verify the actual receiving service, contact route, capacity and transfer arrangement.","feedback":"A workable referral is an operational connection, not merely a list entry."},{"text":"The family should locate a destination without a clinical handover.","feedback":"The clinical teams need to coordinate the transition."}],"answer":2,"critical":true,"roles":["Faculty"],"sourceIds":["CP04"]}],"facultyTask":{"title":"Build the pathway your hospital could actually use","prompt":"Draft a local approach for an undiagnosed, unwell child with possible IEM. Use your institution’s actual resources; mark anything that still needs verification. This is a self-reviewed course exercise, not an approved hospital protocol.","fields":[{"id":"recognition","label":"Recognition and first responsibilities","hint":"Who identifies concern? Who stabilises, contacts the senior team and documents the time?"},{"id":"laboratory","label":"Laboratory and specimens","hint":"Name available first-line tests, actual laboratory SOPs, transport route and who resolves an unexpected result."},{"id":"referral","label":"Escalation and receiving service","hint":"Enter the verified clinical contact route, capability and transport arrangement. Avoid patient-identifying details."},{"id":"family","label":"Family and follow-up","hint":"How will you explain uncertainty, arrange follow-up and address language, travel and access barriers?"},{"id":"audit","label":"One measure and one review trigger","hint":"Define a measurable action or delay, its denominator/time points, an owner and when the pathway will be reviewed."}],"rubric":[{"title":"Urgent care is explicit","description":"Stabilisation and specialist escalation do not wait for comprehensive diagnostic confirmation."},{"title":"Samples are feasible","description":"Collection, lab handling and transport are tied to actual local capability."},{"title":"Referral is operational","description":"A reachable receiving service and a clinical handover are specified."},{"title":"Families can act","description":"The next steps and escalation advice can be explained back by caregivers."},{"title":"Evidence and ownership are visible","description":"Sources, clinical review responsibility, local approvals and an audit/review plan are identified."}]},"toolkit":[{"label":"Recognition","title":"Tell the clinical story in one sentence","points":["State the age, time course and current level of illness.","Describe what is recurrent, progressive or poorly explained.","Name the most informative trigger or organ combination.","Separate observations from the provisional differential; absence of a family history is not exclusion."],"sourceIds":["IN02","GL03"]},{"label":"First-hour reasoning","title":"Keep urgent work moving together","points":["Escalate the unwell child and prioritise stabilisation within your clinical role.","Evaluate common causes alongside a metabolic explanation.","Coordinate feasible urgent samples, specialist advice and repeated reassessment.","Record who owns the next result, decision and transfer arrangement. Individual treatment follows the current clinical plan."],"sourceIds":["IN01","E01"]},{"label":"Metabolic patterns","title":"Combine the results before naming a disease","points":["Read glucose with the ketone response, feeding state and treatment timing.","Read ammonia with the clinical condition and acid–base state.","Interpret acidosis with anion gap, lactate and possible acquired causes.","Write: observed pattern → plausible mechanisms → next discriminating information. Patterns are guides, not confirmation."],"sourceIds":["GL04","GL05","GL06"]},{"label":"Specimens","title":"A sample is a journey, not just a tube","points":["Clarify the test and clinical question with the receiving laboratory.","Confirm accepted specimen, volume, timing, processing, storage and transport using its current SOP.","Label correctly and document clinical state and treatment at collection.","Track acceptance and results, with a named clinician responsible. Sampling must not postpone stabilisation."],"sourceIds":["E02","E03","IN03"]},{"label":"Handover","title":"Make the receiving team’s next decision possible","points":["Current neurological, respiratory and circulatory condition.","Time-stamped findings with units and relevant specimen-quality information.","Treatment already given, response and pending samples/results.","What help is required, the receiving clinician, transport plan and next communication point."],"sourceIds":["IN01"]},{"label":"Screening","title":"Explain the result and close the loop","points":["Review the actual panel, marker and report.","Assess the child and follow the condition-specific recall pathway promptly.","Explain screening versus confirmation in plain language.","Verify that assessment happened and the result was reviewed. A normal screen does not replace assessment of later symptoms."],"sourceIds":["T07","GL07","IN06"]},{"label":"Family conversation","title":"Check that the plan can be used","points":["Explain the current diagnosis or uncertainty without blame.","Ask the caregiver to describe the next step in their own words.","Check the individual emergency plan, contact route, follow-up and practical access barriers.","Use diagnosis-specific genetic counselling for recurrence questions. Do not promise funding or recovery beyond what is established."],"sourceIds":["IN04","T02","CP03","CP04"]},{"label":"Faculty reflection","title":"Turn a case into a service improvement","points":["Ask learners to justify the next action before revealing more information.","Separate first-attempt performance from answers corrected after feedback.","Test one local pathway with a fictional night-time case and identify the point most likely to fail.","Assign an owner, an actionable measure and a review trigger; arrange clinical review before institutional adoption."],"sourceIds":["ED01","ED03","GL11"]}]};</script><script>'use strict';
const app=document.getElementById('app'), C=window.COURSE;
const STORE='metabolic-child-v1', ranks={'Must Know':0,'Nice to Know':1,'Good to Know':2};
const defaults=()=>({version:1,role:'UG',depth:'Must Know',answers:{},confidence:{},read:{},notes:{},faculty:{},rubric:{},caseSteps:{}});
let state=defaults(),storageAvailable=true,pending={},mobileOpen=false;
try{const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved?.version===1)state={...defaults(),...saved};}catch{storageAvailable=false;}
if(!['UG','PG','Faculty'].includes(state.role))state.role='UG';if(!(state.depth in ranks))state.depth='Must Know';
for(const k of ['answers','confidence','read','notes','faculty','rubric','caseSteps'])if(!state[k]||typeof state[k]!=='object'||Array.isArray(state[k]))state[k]={};
