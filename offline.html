t","url":"https://www.rch.org.au/clinicalguide/guideline_index/Recognition_of_the_seriously_unwell_neonate_and_young_infant/","date_version":"Royal Children's Hospital Melbourne; updated May 2025.","verified_scope":"Full official guideline inspected 11 September 2026: nonspecific presentations, absent fever, broad differential, senior review and early infection care.","access":"Free clinical webpage; open reuse licence not established.","caveat":"Australian clinical guidance; only general recognition and coordination principles used. Treatment choices must follow local Indian neonatal protocols and specialist review."},{"id":"T01","title":"Standards and guidelines for the interpretation of sequence variants: ACMG/AMP joint consensus recommendation","url":"https://www.cmgg.be/assets/bestanden/Richards-et-al-ACMG-guidelines-2015.pdf","date_version":"Richards et al., Genetics in Medicine 2015;17:405–424; DOI 10.1038/gim.2015.30","verified_scope":"Full 38-page author manuscript hosted by Centre for Medical Genetics Ghent inspected, including the five classifications, integration with clinical evidence and prohibition on VUS-led clinical decisions.","access":"Free author-manuscript PDF; publisher and PMC direct fetch intermittently failed.","caveat":"Foundational framework, not a current gene-specific rule set or a complete genomics course. No reproduced tables or figures; apply current laboratory and disease-specific interpretation."},{"id":"T02","title":"Biotinidase Deficiency — GeneReviews","url":"https://www.ncbi.nlm.nih.gov/books/NBK1322/","date_version":"Last revision 19 February 2026","verified_scope":"Full chapter inspected for presentation, enzyme confirmation, treatment principles, irreversible injury, autosomal recessive risks and reproductive testing.","access":"Freely readable GeneReviews chapter.","caveat":"Chapter-specific GeneReviews terms apply; no dosing reproduced. Evidence concerns biotinidase deficiency, not empirical treatment of all regression."},{"id":"T03","title":"Wilson Disease — GeneReviews","url":"https://www.ncbi.nlm.nih.gov/books/NBK1512/","date_version":"Last update 12 January 2023","verified_scope":"Full chapter accessed; hepatic and neuropsychiatric presentation, combined diagnostic evidence and acute liver-failure urgency inspected.","access":"Freely readable GeneReviews chapter.","caveat":"Illustrative treatable inherited disorder; no diagnostic score, drug prescription or standalone diagnostic rule reproduced."},{"id":"T04","title":"Pompe Disease — GeneReviews","url":"https://www.ncbi.nlm.nih.gov/books/NBK1261/","date_version":"Current chapter accessed 11 September 2026; internal revision date not reliably extracted","verified_scope":"Full chapter accessed; infantile versus later-onset phenotypes, confirmation and enzyme-replacement principles inspected.","access":"Freely readable GeneReviews chapter; intermittent page/find errors.","caveat":"Verify internal clinical revision before protocol use. Does not establish Indian drug availability, treatment eligibility or pricing."},{"id":"T05","title":"Phenylalanine Hydroxylase Deficiency — GeneReviews","url":"https://www.ncbi.nlm.nih.gov/books/NBK1504/","date_version":"Last revision 20 November 2025","verified_scope":"Full chapter accessed; disease-specific nutrition, multidisciplinary care, nutritional monitoring and developmental/psychosocial follow-up inspected.","access":"Freely readable GeneReviews chapter.","caveat":"US-oriented guideline context; treatments or authorisation discussed in the chapter must not be assumed available in India. No dietary targets or dosing reproduced."},{"id":"T06","title":"Maple Syrup Urine Disease — GeneReviews","url":"https://www.ncbi.nlm.nih.gov/books/NBK1319/","date_version":"Last update 23 April 2020","verified_scope":"Full chapter accessed; illness-associated catabolism, outpatient suitability limits, hospital care for neurological deterioration and personalised treatment inspected.","access":"Freely readable GeneReviews chapter.","caveat":"Older chapter used for stable principles, not a current emergency prescription. Specialist plan and current local protocol determine management. No dosing or formula recipes reproduced."},{"id":"T07","title":"Newborn Screening Results and Follow-Up — HRSA","url":"https://newbornscreening.hrsa.gov/newborn-screening-process/newborn-screening-results-and-follow","date_version":"Last reviewed December 2024","verified_scope":"Full official US government page inspected for screen-positive follow-up, false positive/negative results and symptomatic assessment.","access":"Free official government webpage.","caveat":"US process and timing are not Indian programme requirements; the course uses only general screening interpretation principles."},{"id":"T08","title":"Primary Mitochondrial Disorders Overview — GeneReviews","url":"https://www.ncbi.nlm.nih.gov/books/NBK1224/","date_version":"Last update 29 July 2021","verified_scope":"Full chapter accessed; nuclear versus mitochondrial DNA inheritance, heteroplasmy and counselling uncertainty inspected.","access":"Freely readable GeneReviews chapter.","caveat":"Overview supports inheritance principles, not individual recurrence estimates or current reproductive procedures. Specialist, diagnosis-specific counselling required."},{"id":"T09","title":"Cerebral palsy in under 25s: assessment and management — NICE NG62","url":"https://www.nice.org.uk/guidance/ng62/chapter/Recommendations","date_version":"Published 25 January 2017; official indexed recommendations checked 11 September 2026","verified_scope":"Official indexed recommendations and full-guideline evidence text inspected for loss of attained abilities, progressive neurological red flags and continuing multidisciplinary care.","access":"Official indexed text accessible; direct page fetch returned 403.","caveat":"Red-flag recommendations arose from committee consensus, not retrieved diagnostic-accuracy studies. UK guidance is used for reasoning, not as an Indian service mandate."}],"cases":[{"id":"case-a","name":"Aarav","age":"4 days","setting":"District hospital","title":"Well yesterday. Hard to wake today.","intro":"Aarav was feeding well after birth. Today he feeds poorly and is increasingly drowsy. His parents report no known inherited condition. Your team starts an urgent clinical assessment. This fictional case asks you to make the next useful decision before the diagnosis is known.","sourceIds":["IN01","GL04"],"steps":[{"id":"ca1","stem":"How should the team frame the problem now?","options":[{"text":"Stabilise and assess common causes while adding a metabolic evaluation.","feedback":"Acute care and a metabolic differential can proceed together.","consequence":"The team assigns parallel clinical and sample-collection tasks."},{"text":"Finish the infection workup first, then consider a second diagnostic pathway.","feedback":"A sequential approach can postpone a time-sensitive metabolic assessment.","consequence":"A senior asks the team to reconsider the delay before proceeding."},{"text":"Prioritise genetic testing because the initial well interval proves an inherited disorder.","feedback":"The interval is a clue; it does not establish an inherited diagnosis.","consequence":"The team returns to immediate clinical and biochemical priorities."},{"text":"Use the absence of family history to make IEM a remote outpatient question.","feedback":"An affected relative is often not known when a first child presents.","consequence":"The history is retained, but it cannot dismiss the present illness."}],"answer":0,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["IN01","GL04"],"reveal":"At triage: a previously well neonate now has poor feeding and altered responsiveness. Immediate physiological assessment and stabilisation are underway."},{"id":"ca2","stem":"Which interpretation best guides the next action?","options":[{"text":"The ammonia result settles the exact urea-cycle diagnosis.","feedback":"A major ammonia elevation requires action, but can have more than one cause.","consequence":"The exact diagnosis remains open."},{"text":"Because collection errors occur, defer escalation until a repeat is available.","feedback":"Check the specimen and repeat appropriately without suspending urgent clinical escalation.","consequence":"The consultant asks for clinical action and a specimen-quality check in parallel."},{"text":"Treat this as urgent hyperammonaemia; involve metabolic and critical-care teams while evaluating the cause.","feedback":"The urgency does not depend on completing molecular confirmation.","consequence":"A specialist call begins and the team shares the clinical state, results and collection details."},{"text":"The absence of severe acidosis makes a metabolic emergency unlikely.","feedback":"Some metabolic presentations do not begin with severe acidosis.","consequence":"The team revises the pattern interpretation."}],"answer":2,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["IN01","GL04"],"reveal":"The laboratory phones an ammonia result of 486 µmol/L. Aarav remains unwell. The laboratory is checking collection and processing details. This value belongs to the fictional case; treatment decisions require the applicable specialist protocol."},{"id":"ca3","stem":"What makes the referral handover most useful?","options":[{"text":"Send only the working disease label to keep the call brief.","feedback":"A label alone omits information needed to plan transport and care.","consequence":"The receiving clinician requests the missing clinical details."},{"text":"Give the current condition, time-stamped results and units, treatment already given, available samples and transfer needs.","feedback":"The receiving team needs the patient trajectory and actions, not only a diagnosis hypothesis.","consequence":"Both teams agree the next responsibilities and transport plan."},{"text":"Wait to collect every specialised specimen before discussing transfer.","feedback":"A complete test set is not a prerequisite for discussing urgent transfer.","consequence":"The team makes the call while feasible samples are organised."},{"text":"Ask the family to arrange a routine appointment at any listed CoE.","feedback":"Emergency care requires a receiving service and transport plan appropriate to the child’s condition.","consequence":"The team arranges clinician-to-clinician escalation."}],"answer":1,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["IN01","GL03"],"reveal":"The hospital cannot provide all of the care Aarav may need. A receiving centre is being contacted. The first available metabolic send-out test will take days."}],"debrief":"You did not need the exact enzyme defect to identify urgency. The key achievement was keeping resuscitation, common causes, useful samples and specialist escalation moving together. The fictional case ends with transfer planning; it does not assert a final molecular diagnosis."},{"id":"case-b","name":"Meera","age":"18 months","setting":"Medical-college emergency","title":"The ketones that were barely there.","intro":"Meera has a febrile illness, vomiting and much less intake than usual. She arrives lethargic. Your team responds to hypoglycaemia. Her mother remembers a similar, milder episode. Explore how physiology can organise your next questions.","sourceIds":["GL05"],"steps":[{"id":"cb1","stem":"What does this combination make you ask?","options":[{"text":"Why is the ketone response low in this clinical context, and what causes must be considered?","feedback":"Interpret glucose and ketones together. The combination raises questions rather than naming one disease.","consequence":"The team records the timing and broadens the differential."},{"text":"Whether a negative urine ketone result excludes metabolic disease.","feedback":"A low ketone response can be part of the clue.","consequence":"The team rechecks the relationship between energy need and available fuel."},{"text":"Whether this proves MCAD deficiency.","feedback":"MCAD is one exemplar; another metabolic or endocrine cause may explain the pattern.","consequence":"The provisional differential stays broader than MCAD."},{"text":"Whether the glucose level should be allowed to fall further to make testing more diagnostic.","feedback":"Diagnostic sampling should not prolong hypoglycaemia or defer treatment.","consequence":"The team rejects deliberate provocation and continues care."}],"answer":0,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["GL05"],"reveal":"Initial glucose is 38 mg/dL (about 2.1 mmol/L). The ketone result is unexpectedly low for the clinical context. The team documents whether the specimen preceded glucose treatment."},{"id":"cb2","stem":"Which diagnostic plan is most defensible?","options":[{"text":"Request exome sequencing alone and ignore the acute biochemical context.","feedback":"Genetics can help, but clinical and biochemical findings guide interpretation.","consequence":"The specialist asks for the illness and laboratory context."},{"text":"Arrange a provocative fast after recovery to reproduce the episode.","feedback":"This course does not propose provocative fasting. Such testing has specific indications and specialist safeguards.","consequence":"The team plans specialist evaluation without asking the family to provoke illness."},{"text":"Call the metabolic/endocrine team, retain useful acute specimens and select further tests from the differential.","feedback":"The question may require both metabolic and endocrine reasoning, with timing documented.","consequence":"A targeted testing plan is agreed, including specimen handling."},{"text":"Use improvement after glucose to exclude inherited disease.","feedback":"Improvement addresses an acute physiological problem; it does not explain why it occurred.","consequence":"The response is documented without ending the diagnostic enquiry."}],"answer":2,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["GL05"],"reveal":"Meera improves with acute care. The team is considering causes of hypoketotic hypoglycaemia, including fatty-acid oxidation disease and excessive insulin action."},{"id":"cb3","stem":"What should the family understand before discharge planning is complete?","options":[{"text":"A generic online diet is sufficient until the next illness.","feedback":"Diet and illness advice need to fit the confirmed or suspected condition and the treating team’s plan.","consequence":"A dietitian and clinician review the advice."},{"text":"Every later symptom must come from the suspected IEM.","feedback":"Children can still develop common unrelated illness.","consequence":"The family receives both routine and escalation advice."},{"text":"The child should avoid all fats indefinitely.","feedback":"A universal restriction is not an individual nutritional prescription.","consequence":"The team clarifies what is and is not being prescribed."},{"text":"The agreed illness plan, signs requiring urgent help, contact route and follow-up, checked by teach-back.","feedback":"Ask caregivers to explain what they would do in a new illness using the actual plan.","consequence":"Meera’s mother rehearses the next steps and identifies one unclear instruction."}],"answer":3,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["GL05"],"reveal":"Meera’s mother asks what to do if vomiting happens again. The final diagnosis is still being evaluated. The family lives far from the hospital."}],"debrief":"The useful pattern was glucose plus the ketone response, interpreted with feeding, treatment and timing. Keep the cause open until confirmatory evidence supports it. The family’s usable illness and follow-up plan is part of care."},{"id":"case-c","name":"Kabir","age":"7 years","setting":"Paediatric outpatient clinic","title":"A skill lost is a new clue.","intro":"Kabir previously walked independently and used sentences. His family describes a new unsteady gait and loss of previously used words. Earlier records mention developmental delay. Your task is to distinguish a familiar label from a changing clinical trajectory.","sourceIds":["IN05","GL03"],"steps":[{"id":"cc1","stem":"Which finding should change the assessment?","options":[{"text":"The earlier developmental-delay label means the current change is expected.","feedback":"A previous label does not explain new loss of acquired skills.","consequence":"The history is reopened around what Kabir could do before."},{"text":"Documented loss of acquired skills warrants a fresh clinical evaluation.","feedback":"Define what was gained, lost and when, then consider neurological, metabolic and other causes.","consequence":"The family and team construct a dated developmental timeline."},{"text":"Regression establishes a treatable metabolic diagnosis.","feedback":"Regression is an important clue but has a broad differential.","consequence":"The team avoids promising a diagnosis before evaluation."},{"text":"A metabolic workup should precede examination and history.","feedback":"Phenotype and trajectory help select meaningful investigations.","consequence":"The examination and history guide the next tests."}],"answer":1,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["IN05","GL03"],"reveal":"Kabir’s school records and parent videos support a true change in abilities over several months. There is no single explanatory diagnosis yet."},{"id":"cc2","stem":"How should the molecular finding be used?","options":[{"text":"Treat the uncertain variant as a confirmed diagnosis if the gene sounds relevant.","feedback":"A VUS is not equivalent to a pathogenic finding.","consequence":"The report needs expert interpretation in clinical context."},{"text":"Dismiss the clinical concern because the report was not diagnostic.","feedback":"An inconclusive molecular result does not explain away the phenotype.","consequence":"Clinical evaluation continues."},{"text":"Integrate phenotype, biochemical evidence, inheritance and expert variant interpretation.","feedback":"Concordance matters. Additional targeted testing or re-evaluation may be appropriate.","consequence":"The team identifies what evidence would strengthen or weaken the proposed link."},{"text":"Offer one fixed recurrence-risk figure for every IEM.","feedback":"Risk depends on the diagnosis and inheritance, which are not settled here.","consequence":"Counselling distinguishes what is known from what remains uncertain."}],"answer":2,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["IN04"],"reveal":"A previous exome report lists a variant of uncertain significance in a metabolic gene. No matching biochemical confirmation is documented."},{"id":"cc3","stem":"Which explanation best balances hope and accuracy?","options":[{"text":"Some causes can be treated; the next tests aim to identify those relevant to Kabir, while support continues.","feedback":"An honest explanation can offer purpose without guaranteeing a treatable answer.","consequence":"The family understands the reason for testing and the immediate support plan."},{"text":"All inherited metabolic diseases are curable if found early.","feedback":"Treatments and outcomes vary by condition.","consequence":"The team corrects an overpromise."},{"text":"Support for mobility and school should wait for a final diagnosis.","feedback":"Present needs deserve attention during the investigation.","consequence":"Rehabilitation and school communication are included now."},{"text":"Only the molecular report needs discussion with the family.","feedback":"Families also need the plan, uncertainties and practical next steps.","consequence":"The discussion expands to Kabir’s daily life and follow-up."}],"answer":0,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["IN05","GL04"],"reveal":"The parents ask whether the new tests will “cure the problem”. Kabir also needs help with mobility and participating at school."}],"debrief":"Trajectory changed the question. A VUS did not settle it. The clinical task is to seek relevant treatable causes, communicate uncertainty and support the child while evaluation proceeds."},{"id":"case-d","name":"Sana","age":"8 days","setting":"Screening recall and follow-up","title":"A positive screen. A worried family.","intro":"Sana’s family receives a call about an out-of-range newborn-screening marker. They are told to speak to a clinician. Sana appears well to her parents. No confirmed diagnosis is available. Work through the recall, explanation and access decisions.","sourceIds":["GL07","IN06"],"steps":[{"id":"cd1","stem":"What is the best next step?","options":[{"text":"Wait for symptoms because Sana currently appears well.","feedback":"Some screening findings need time-critical follow-up before symptoms.","consequence":"The clinician clarifies the marker and recommended timeframe."},{"text":"Tell the family the screening label is already the final diagnosis.","feedback":"A screening result identifies a need for assessment and confirmation.","consequence":"The clinician explains the difference without minimising the follow-up."},{"text":"Repeat the same screen whenever convenient and take no further action.","feedback":"The correct pathway depends on the marker and clinical state; repeating alone may not be enough.","consequence":"The team checks the relevant recall and confirmation pathway."},{"text":"Identify the exact marker, assess Sana’s condition and arrange the appropriate prompt specialist/confirmatory pathway.","feedback":"The marker and the child’s condition determine urgency and the next tests.","consequence":"A specific follow-up plan is agreed with the family."}],"answer":3,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["GL07","IN06"],"reveal":"The report identifies a potentially time-critical metabolic marker. The family is unsure where the confirmatory tests can be done."},{"id":"cd2","stem":"What is the most accurate explanation?","options":[{"text":"Every child with a normal screen is protected against all IEMs.","feedback":"Panels and test performance have limits. Symptoms always deserve clinical assessment.","consequence":"The family understands that screening has a defined scope."},{"text":"The screen tells us who needs further evaluation; the confirmatory pathway tells us whether this condition is present.","feedback":"This distinguishes screening from diagnosis while keeping follow-up purposeful.","consequence":"The parents can explain the purpose of the next appointment."},{"text":"Because false positives occur, the result can be ignored.","feedback":"Possibility of a false positive does not remove the need for timely follow-up.","consequence":"The clinician reinforces the agreed plan."},{"text":"A private panel in one city establishes what all Indian newborns are screened for.","feedback":"Screening availability and panels vary.","consequence":"The report’s actual panel and local pathway are reviewed."}],"answer":1,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["GL07","IN06"],"reveal":"Sana’s parents ask whether a positive screen proves disease and whether their older child’s normal screen excludes every metabolic condition."},{"id":"cd3","stem":"Which access advice is appropriate?","options":[{"text":"Promise the family a fixed payment because the condition is rare.","feedback":"Financial assistance depends on applicable criteria and procedures, not rarity alone.","consequence":"The family is referred for an eligibility and documentation assessment."},{"text":"Assume any centre on an old list offers the same services today.","feedback":"Designation and actual available services must be checked.","consequence":"The team verifies a receiving service and the route."},{"text":"Use current official policy and a verified centre to clarify eligibility, documents and available care.","feedback":"A navigable plan is more useful than an unverified funding promise.","consequence":"The family leaves with the next contact, documents to assemble and follow-up date."},{"text":"Postpone confirmatory clinical follow-up until all financial questions are resolved.","feedback":"Urgent clinical follow-up and access support should move together.","consequence":"The team coordinates the two tasks."}],"answer":2,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["CP03","CP04"],"reveal":"The family asks about government support and travel costs. The clinician checks current official policy rather than relying on a saved social-media message."}],"debrief":"A screening result starts a pathway. Accurate explanation, timely confirmation and practical access support all matter. Counselling about another pregnancy should use the eventual diagnosis and its inheritance pattern."}],"baseline":[{"id":"b1","stem":"Before you start: a newborn becomes unwell before the screening result returns. Which statement best guides you?","options":[{"text":"The clinical condition determines urgent evaluation; screening can be followed up in parallel.","feedback":"Clinical assessment should not wait for screening."},{"text":"A pending screen means IEM evaluation should wait.","feedback":"A child can become ill before the result is available."},{"text":"Screening replaces the initial clinical and biochemical assessment.","feedback":"These serve different purposes."},{"text":"Only children with affected relatives need metabolic consideration.","feedback":"A family history is not required."}],"answer":0,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["GL03"]},{"id":"b2","stem":"An abnormal biochemical pattern should usually be treated as…","options":[{"text":"A final molecular diagnosis.","feedback":"A pattern is not a molecular diagnosis."},{"text":"A clue to organise the differential and next tests.","feedback":"Use it with the phenotype, timing and specimen context."},{"text":"A reason to ignore common acquired causes.","feedback":"Acquired causes remain relevant."},{"text":"Meaningless until every gene has been sequenced.","feedback":"Biochemistry can guide immediate decisions and testing."}],"answer":1,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["GL03"]},{"id":"b3","stem":"The most useful course outcome is the ability to…","options":[{"text":"Recall the largest possible disease list.","feedback":"Recall alone does not show a useful approach."},{"text":"Apply one emergency diet to all IEMs.","feedback":"Plans must be individualised."},{"text":"Avoid consulting specialists by using an online algorithm.","feedback":"Early specialist collaboration is part of a sound approach."},{"text":"Explain and prioritise the next clinical decisions within your role.","feedback":"That is what the cases and checks will practise."}],"answer":3,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["GL03"]}],"finalQuestions":[{"id":"f1","stem":"A child has recurrent illness-related encephalopathy but no known affected relatives. What is the best interpretation?","options":[{"text":"No affected relatives makes inherited disease impossible.","feedback":"Absence of a known family history is not exclusion."},{"text":"The recurring clinical pattern warrants evaluation alongside other causes.","feedback":"Use the trajectory to guide assessment."},{"text":"Related parents are required before further metabolic testing.","feedback":"That condition would miss relevant presentations."},{"text":"Recurrent episodes prove a single metabolic diagnosis.","feedback":"Several conditions can produce recurrent episodes."}],"answer":1,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["GL03"]},{"id":"f2","stem":"A sick infant needs stabilisation and a specialised sample courier leaves soon. What should determine the sequence?","options":[{"text":"Finish every specialised sample before treating.","feedback":"Samples should not delay stabilisation."},{"text":"Skip all diagnostic samples because treatment is needed.","feedback":"Useful specimens can often be collected alongside care."},{"text":"Stabilise, collect feasible urgent samples in parallel and record treatment/sample times.","feedback":"Parallel work preserves care and interpretation."},{"text":"Ask the family to transport an unlabelled tube later.","feedback":"Correct identification and handling are essential."}],"answer":2,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["GL03"]},{"id":"f3","stem":"Why is a low ketone result important when a child is hypoglycaemic?","options":[{"text":"It can be an inappropriate fuel response that helps organise metabolic and endocrine differentials.","feedback":"Glucose and ketones are more informative together than separately."},{"text":"It rules out a metabolic explanation.","feedback":"A low response can itself be a clue."},{"text":"It names the exact fatty-acid oxidation disorder.","feedback":"The pattern is not sufficiently specific."},{"text":"It means the hypoglycaemia need not be treated.","feedback":"Treatment follows the clinical condition."}],"answer":0,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["GL05"]},{"id":"f4","stem":"Which statement about a negative newborn screen is most accurate?","options":[{"text":"It replaces further evaluation if symptoms later occur.","feedback":"Clinical symptoms still need evaluation."},{"text":"It guarantees all inherited diseases were tested.","feedback":"Panels have a defined scope."},{"text":"It confirms normal metabolism for life.","feedback":"A screening test cannot make that promise."},{"text":"Interpret the actual panel and result, while evaluating concerning symptoms on their merits.","feedback":"Screening does not cover every relevant disorder or presentation."}],"answer":3,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["GL07","IN06"]},{"id":"f5","stem":"Parents ask for a diet while their child’s possible IEM is being investigated. What is the best response?","options":[{"text":"Prescribe lifelong protein elimination for every suspected IEM.","feedback":"That is not an individualised nutrition plan."},{"text":"Arrange a clinician/dietitian plan tied to the condition and current clinical needs.","feedback":"Nutrition must also protect growth and be feasible for the family."},{"text":"Use another family’s plan for a different disorder.","feedback":"Plans cannot be assumed interchangeable."},{"text":"Leave the family with no interim instructions.","feedback":"The treating team should provide appropriate interim and escalation advice."}],"answer":1,"critical":false,"roles":["UG","PG","Faculty"],"sourceIds":["GL05","IN01"]},{"id":"f6","stem":"During referral for suspected metabolic deterioration, which handover is strongest?","options":[{"text":"The disease name alone.","feedback":"The receiving service needs clinical and time-related information."},{"text":"A photograph of a result without units or treatment details.","feedback":"Those missing details affect interpretation."},{"text":"Current status, time-stamped findings with units, treatment, specimens, contact and transfer needs.","feedback":"This makes the next team’s decisions possible."},{"text":"A list of rare diseases without a clinical summary.","feedback":"The child’s actual trajectory takes priority."}],"answer":2,"critical":true,"roles":["UG","PG","Faculty"],"sourceIds":["GL03"]},{"id":"f7","stem":"A diagnostic sample was collected after glucose treatment and recovery. How should you interpret a reassuring result?","options":[{"text":"With timing and treatment context; ask whether further targeted assessment is needed.","feedback":"Some biochemical findings depend on the clinical state."},{"text":"As absolute exclusion of the suspected disorder.","feedback":"The context may limit that conclusion."},{"text":"As proof that the first abnormality was fabricated.","feedback":"That conclusion does not follow."},{"text":"By ignoring all earlier clinical information.","feedback":"The full trajectory remains relevant."}],"answer":0,"critical":false,"roles":["PG","Faculty"],"sourceIds":["GL05"]},{"id":"f8","stem":"A plausible metabolic gene contains a VUS. What strengthens diagnostic reasoning?","options":[{"text":"Calling it pathogenic because the disease is treatable.","feedback":"Treatability does not classify a variant."},{"text":"Giving a definitive recurrence estimate before diagnosis.","feedback":"Risk counselling must reflect the uncertainty."},{"text":"Equating the report’s gene name with causation.","feedback":"The gene name is insufficient."},{"text":"Assessing phenotype, biochemical concordance, inheritance and expert interpretation.","feedback":"Converging evidence is stronger than a label alone."}],"answer":3,"critical":false,"roles":["PG","Faculty"],"sourceIds":["IN04"]},{"id":"f9","stem":"Two sources specify different urgent ammonia-management thresholds. What should a local clinical teaching aid do?","options":[{"text":"Average the numbers and present a new threshold.","feedback":"A numerical average is not clinical validation."},{"text":"Reconcile population, context and evidence with metabolic/PICU expertise and an approved local pathway.","feedback":"A teaching aid needs a coherent clinical basis and identified local responsibility."},{"text":"Use the most recent website upload folder as the clinical review date.","feedback":"Upload date and clinical revision can differ."},{"text":"Hide the difference and use whichever number is easier to memorise.","feedback":"That conceals a consequential uncertainty."}],"answer":1,"critical":true,"roles":["PG","Faculty"],"sourceIds":["GL14","IN01"]},{"id":"f10","stem":"An organic-acid-related marker is elevated. What is the next defensible reasoning step?","options":[{"text":"Equate any elevated marker with one inherited subtype.","feedback":"Marker elevation can have several explanations."},{"text":"Ignore nutritional and acquired explanations.","feedback":"Relevant acquired factors remain part of evaluation."},{"text":"Use the phenotype and related biochemical findings to select confirmation and consider alternatives.","feedback":"The next test should discriminate among plausible explanations."},{"text":"Start a permanent diet without establishing an appropriate plan.","feedback":"Treatment planning requires clinical guidance and a justified diagnosis."}],"answer":2,"critical":false,"roles":["PG","Faculty"],"sourceIds":["GL06"]},{"id":"f11","stem":"A family can initially access only limited testing. What should guide prioritisation?","options":[{"text":"Urgency, management consequence and the next discriminating question, coordinated with referral.","feedback":"Prioritise information that changes the next decision."},{"text":"Order the largest panel because more tests always cost less.","feedback":"More testing is not automatically more useful."},{"text":"Wait for every financial issue to resolve before urgent care.","feedback":"Urgent care and access support should proceed together."},{"text":"Select tests solely by turnaround without considering the question.","feedback":"A fast irrelevant result may not help."}],"answer":0,"critical":false,"roles":["PG","Faculty"],"sourceIds":["IN03","CP04"]},{"id":"f12","stem":"For a confirmed inherited disorder, what should counselling about another pregnancy use?","options":[{"text":"One recurrence percentage for every IEM.","feedback":"Inheritance and family findings differ."},{"text":"Only a relative’s internet search.","feedback":"Counselling needs the verified diagnosis and evidence."},{"text":"A guarantee that testing can resolve every uncertainty.","feedback":"Explain the actual capabilities and limitations."},{"text":"The specific diagnosis, inheritance, family findings and available specialist reproductive options.","feedback":"Counselling should be accurate, non-directive and diagnosis-specific."}],"answer":3,"critical":false,"roles":["PG","Faculty"],"sourceIds":["IN04","GL04"]},{"id":"f13","stem":"A learner answers every recall question but repeatedly delays escalation in cases. What should the faculty conclude?","options":[{"text":"Recall marks compensate for unsafe decision patterns.","feedback":"They assess different outcomes."},{"text":"The critical-action gap needs feedback and reassessment with another case.","feedback":"Review the reasoning and require another demonstration."},{"text":"The learner must memorise more rare disease names first.","feedback":"That does not directly address the missed action."},{"text":"Confidence alone is adequate evidence of competence.","feedback":"Confidence should be compared with performance."}],"answer":1,"critical":false,"roles":["Faculty"],"sourceIds":["ED01"]},{"id":"f14","stem":"Which audit measure most directly examines your proposed emergency pathway?","options":[{"text":"Total page views of the pathway.","feedback":"Views indicate reach, not timely clinical action."},{"text":"Number of rare diseases in the appendix.","feedback":"That is not a process measure of care."},{"text":"Time from recognised concern to specialist contact, with a clear definition and local context.","feedback":"A defined action and timestamp make the process assessable."},{"text":"Number of colours used in the algorithm.","feedback":"Presentation alone cannot measure clinical delivery."}],"answer":2,"critical":false,"roles":["Faculty"],"sourceIds":["GL11"]},{"id":"f15","stem":"A hospital proposes expanded newborn screening. Which question is essential beyond choosing the assay?","options":[{"text":"Can recall, confirmation, counselling, treatment and follow-up be delivered equitably?","feedback":"A screening programme depends on a functioning pathway after the result."},{"text":"Can a larger panel replace clinical assessment?","feedback":"Screening and clinical assessment have different roles."},{"text":"Can all positive findings be called confirmed disease?","feedback":"Confirmation remains essential."},{"text":"Can detection alone establish that the programme improves outcomes?","feedback":"Assess downstream care and outcomes too."}],"answer":0,"critical":false,"roles":["Faculty"],"sourceIds":["IN06"]},{"id":"f16","stem":"How should a faculty author use a publicly readable course recording or figure?","options":[{"text":"Assume public viewing authorises all redistribution.","feedback":"Access and reuse rights differ."},{"text":"Remove the attribution and change the colour scheme.","feedback":"Cosmetic changes do not establish permission."},{"text":"Describe it as reviewed even if only the course listing was available.","feedback":"The scope of access should be stated accurately."},{"text":"Check the applicable reuse terms and use original explanations or a link when appropriate.","feedback":"Keep attribution and permissions appropriate to the material."}],"answer":3,"critical":false,"roles":["Faculty"],"sourceIds":["IN07","GL10"]},{"id":"f17","stem":"An online course reports high satisfaction and completion. What additional evidence would support learning claims?","options":[{"text":"A more impressive completion badge.","feedback":"A badge is not evidence of retained reasoning."},{"text":"Performance on unfamiliar cases and delayed assessment, interpreted alongside participation and baseline.","feedback":"Evaluate the outcome the course claims to teach."},{"text":"Only the number of minutes of video.","feedback":"Exposure alone does not demonstrate learning."},{"text":"A statement that all graduates are independent specialists.","feedback":"That exceeds what an online assessment establishes."}],"answer":1,"critical":false,"roles":["Faculty"],"sourceIds":["ED01","ED03"]},{"id":"f18","stem":"Your referral directory lists a policy-designated CoE. Before using it for a specific urgent transfer, what matters?","options":[{"text":"The name is enough to assume round-the-clock metabolic services.","feedback":"Designation does not verify all practical capabilities."},{"text":"The oldest saved list should remain permanent for consistency.","feedback":"Directories need current verification."},{"text":"Verify the actual receiving service, contact route, capacity and transfer arrangement.","feedback":"A workable referral is an operational connection, not merely a list entry."},{"text":"The family should locate a destination without a clinical handover.","feedback":"The clinical teams need to coordinate the transition."}],"answer":2,"critical":true,"roles":["Faculty"],"sourceIds":["CP04"]}],"facultyTask":{"title":"Build the pathway your hospital could actually use","prompt":"Draft a local approach for an undiagnosed, unwell child with possible IEM. Use your institution’s actual resources; mark anything that still needs verification. This is a self-reviewed course exercise, not an approved hospital protocol.","fields":[{"id":"recognition","label":"Recognition and first responsibilities","hint":"Who identifies concern? Who stabilises, contacts the senior team and documents the time?"},{"id":"laboratory","label":"Laboratory and specimens","hint":"Name available first-line tests, actual laboratory SOPs, transport route and who resolves an unexpected result."},{"id":"referral","label":"Escalation and receiving service","hint":"Enter the verified clinical contact route, capability and transport arrangement. Avoid patient-identifying details."},{"id":"family","label":"Family and follow-up","hint":"How will you explain uncertainty, arrange follow-up and address language, travel and access barriers?"},{"id":"audit","label":"One measure and one review trigger","hint":"Define a measurable action or delay, its denominator/time points, an owner and when the pathway will be reviewed."}],"rubric":[{"title":"Urgent care is explicit","description":"Stabilisation and specialist escalation do not wait for comprehensive diagnostic confirmation."},{"title":"Samples are feasible","description":"Collection, lab handling and transport are tied to actual local capability."},{"title":"Referral is operational","description":"A reachable receiving service and a clinical handover are specified."},{"title":"Families can act","description":"The next steps and escalation advice can be explained back by caregivers."},{"title":"Evidence and ownership are visible","description":"Sources, clinical review responsibility, local approvals and an audit/review plan are identified."}]},"toolkit":[{"label":"Recognition","title":"Tell the clinical story in one sentence","points":["State the age, time course and current level of illness.","Describe what is recurrent, progressive or poorly explained.","Name the most informative trigger or organ combination.","Separate observations from the provisional differential; absence of a family history is not exclusion."],"sourceIds":["IN02","GL03"]},{"label":"First-hour reasoning","title":"Keep urgent work moving together","points":["Escalate the unwell child and prioritise stabilisation within your clinical role.","Evaluate common causes alongside a metabolic explanation.","Coordinate feasible urgent samples, specialist advice and repeated reassessment.","Record who owns the next result, decision and transfer arrangement. Individual treatment follows the current clinical plan."],"sourceIds":["IN01","E01"]},{"label":"Metabolic patterns","title":"Combine the results before naming a disease","points":["Read glucose with the ketone response, feeding state and treatment timing.","Read ammonia with the clinical condition and acid–base state.","Interpret acidosis with anion gap, lactate and possible acquired causes.","Write: observed pattern → plausible mechanisms → next discriminating information. Patterns are guides, not confirmation."],"sourceIds":["GL04","GL05","GL06"]},{"label":"Specimens","title":"A sample is a journey, not just a tube","points":["Clarify the test and clinical question with the receiving laboratory.","Confirm accepted specimen, volume, timing, processing, storage and transport using its current SOP.","Label correctly and document clinical state and treatment at collection.","Track acceptance and results, with a named clinician responsible. Sampling must not postpone stabilisation."],"sourceIds":["E02","E03","IN03"]},{"label":"Handover","title":"Make the receiving team’s next decision possible","points":["Current neurological, respiratory and circulatory condition.","Time-stamped findings with units and relevant specimen-quality information.","Treatment already given, response and pending samples/results.","What help is required, the receiving clinician, transport plan and next communication point."],"sourceIds":["IN01"]},{"label":"Screening","title":"Explain the result and close the loop","points":["Review the actual panel, marker and report.","Assess the child and follow the condition-specific recall pathway promptly.","Explain screening versus confirmation in plain language.","Verify that assessment happened and the result was reviewed. A normal screen does not replace assessment of later symptoms."],"sourceIds":["T07","GL07","IN06"]},{"label":"Family conversation","title":"Check that the plan can be used","points":["Explain the current diagnosis or uncertainty without blame.","Ask the caregiver to describe the next step in their own words.","Check the individual emergency plan, contact route, follow-up and practical access barriers.","Use diagnosis-specific genetic counselling for recurrence questions. Do not promise funding or recovery beyond what is established."],"sourceIds":["IN04","T02","CP03","CP04"]},{"label":"Faculty reflection","title":"Turn a case into a service improvement","points":["Ask learners to justify the next action before revealing more information.","Separate first-attempt performance from answers corrected after feedback.","Test one local pathway with a fictional night-time case and identify the point most likely to fail.","Assign an owner, an actionable measure and a review trigger; arrange clinical review before institutional adoption."],"sourceIds":["ED01","ED03","GL11"]}]};</script><script>'use strict';
const app=document.getElementById('app'), C=window.COURSE;
const STORE='metabolic-child-v1', ranks={'Must Know':0,'Nice to Know':1,'Good to Know':2};
const defaults=()=>({version:1,role:'UG',depth:'Must Know',answers:{},confidence:{},read:{},notes:{},faculty:{},rubric:{},caseSteps:{}});
let state=defaults(),storageAvailable=true,pending={},mobileOpen=false;
try{const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved?.version===1)state={...defaults(),...saved};}catch{storageAvailable=false;}
if(!['UG','PG','Faculty'].includes(state.role))state.role='UG';if(!(state.depth in ranks))state.depth='Must Know';
for(const k of ['answers','confidence','read','notes','faculty','rubric','caseSteps'])if(!state[k]||typeof state[k]!=='object'||Array.isArray(state[k]))state[k]={};
const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const sourceMap=Object.fromEntries(C.sources.map(s=>[s.id,s]));
const questions=[...C.lessons.map(l=>l.check),...C.cases.flatMap(c=>c.steps),...C.baseline,...C.finalQuestions];
const qmap=Object.fromEntries(questions.map(q=>[q.id,q]));
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));storageAvailable=true;}catch{storageAvailable=false;}}
function view(){return decodeURIComponent(location.hash.slice(1))||'home';}
function go(v){mobileOpen=false;if(view()===v){render();window.scrollTo(0,0);}else location.hash=v;}
function result(id){const a=state.answers[id];return a&&!a.retry?a:null;}
function visibleSections(l){return l.sections.filter(s=>ranks[s.depth[state.role]]<=ranks[state.depth]);}
function finalPool(){return C.finalQuestions.filter(q=>q.roles.includes(state.role));}
function completedLessons(){return C.lessons.filter(l=>result(l.check.id)?.correct&&l.sections.filter(s=>s.depth[state.role]==='Must Know').every(s=>state.read[s.id])).length;}
function score(qs){return {seen:qs.filter(q=>state.answers[q.id]).length,first:qs.filter(q=>state.answers[q.id]?.firstCorrect).length,now:qs.filter(q=>result(q.id)?.correct).length,total:qs.length};}
function refs(ids=[]){return ids.length?`<div class="sources-inline"><span>Read the evidence</span>${[...new Set(ids)].filter(id=>sourceMap[id]).map(id=>`<a href="${esc(sourceMap[id].url)}" target="_blank" rel="noopener" title="${esc(sourceMap[id].title)}">${esc(id)} · ${esc(shortSource(sourceMap[id].title))} ↗</a>`).join('')}</div>`:'';}
function shortSource(s){return s.length>49?s.slice(0,47)+'…':s;}
function badge(t){return `<span class="tag ${t==='Must Know'?'must':t==='Nice to Know'?'nice':'good'}">${esc(t)}</span>`;}
function nav(v,text,num=''){return `<button class="nav ${view()===v?'active':''}" data-go="${v}" ${view()===v?'aria-current="page"':''}><span class="num">${num}</span><span>${esc(text)}</span></button>`;}
function render(){
 const v=view(),lesson=C.lessons.find(l=>v==='learn-'+l.id);
 app.innerHTML=`<aside class="sidebar ${mobileOpen?'open':''}" aria-label="Course navigation"><div class="brand">The Metabolic<br><b>Child.</b></div><div class="brand-sub">Clinical learning · India</div>${nav('home','Your learning path','⌂')}${nav('baseline','Before you begin','○')}<div class="nav-label">Ten clinical rooms</div>${C.lessons.map(l=>nav('learn-'+l.id,l.title,result(l.check.id)?.correct&&l.sections.filter(s=>s.depth[state.role]==='Must Know').every(s=>state.read[s.id])?'✓':String(l.id).padStart(2,'0'))).join('')}<div class="nav-label">Put it into practice</div>${nav('cases','Four patient journeys','↗')}${nav('final','Final practice','◎')}${nav('faculty','Faculty workshop','◇')}${nav('progress','My learning record','▤')}${nav('toolkit','Study toolkit','□')}${nav('sources','Evidence & course notes','↗')}<div class="side-note">${storageAvailable?'Progress stays in this browser.':'Browser storage unavailable. Export your notes before closing.'}<br>Original fictional cases.<br>For medical education.</div></aside><div class="shell"><header class="topbar"><button class="btn secondary mobile-nav" id="mobile-menu" aria-label="Toggle course navigation" aria-expanded="${mobileOpen}">☰</button><span class="breadcrumb">${lesson?'Clinical room '+String(lesson.id).padStart(2,'0'):'A practical approach to childhood IEM'}</span><div class="path-controls"><label class="control-label" for="role">Your path</label><select id="role" aria-label="Learner role">${['UG','PG','Faculty'].map(x=>`<option ${state.role===x?'selected':''}>${x}</option>`).join('')}</select><select id="depth" aria-label="Learning depth">${Object.keys(ranks).map(x=>`<option value="${x}" ${state.depth===x?'selected':''}>${x==='Must Know'?'Must Know':x==='Nice to Know'?'Must + Nice to Know':'All three depths'}</option>`).join('')}</select></div></header><main id="main" tabindex="-1">${route(v)}<footer class="footer-note">The Metabolic Child · Content reviewed against cited sources, September 2026. Educational edition awaiting independent clinical and learner-pilot review. Use current local clinical protocols and specialist advice in practice. No accreditation or independent clinical competence is conferred.</footer></main></div>`;
 bind();
}
function route(v){if(v.startsWith('learn-')){const l=C.lessons.find(l=>v==='learn-'+l.id);return l?lessonPage(l):notFound();}if(v.startsWith('case-')){const c=C.cases.find(c=>c.id===v);return c?casePage(c):notFound();}return ({home:homePage,baseline:baselinePage,cases:casesPage,final:finalPage,faculty:facultyPage,progress:progressPage,toolkit:toolkitPage,sources:sourcesPage}[v]||notFound)();}
function notFound(){return `<h1>Choose a clinical room</h1><p>This course location is not available.</p><button class="btn" data-go="home">Return to your path</button>`;}
function homePage(){const done=completedLessons(),dec=score(C.cases.flatMap(c=>c.steps)),next=C.lessons.find(l=>!result(l.check.id)?.correct||!l.sections.filter(s=>s.depth[state.role]==='Must Know').every(s=>state.read[s.id]))||C.lessons[0];return `<p class="eyebrow">Your ${esc(state.role)} learning path</p><h1>Know the next step.<br>Understand the reason.</h1><p class="lead">A clinical approach to a child with an inborn error of metabolism. Learn through decisions, from first concern to continuing care.</p><div class="stats"><div class="stat"><strong>${done}<span style="font-size:17px"> / 10</span></strong><span>Clinical rooms completed</span></div><div class="stat"><strong>${dec.now}<span style="font-size:17px"> / 12</span></strong><span>Case decisions corrected</span></div><div class="stat"><strong>${state.role==='UG'?'Recognise':state.role==='PG'?'Reason':'Teach'}</strong><span>${state.role==='UG'?'Interpret, assist and refer':state.role==='PG'?'Investigate, prioritise and coordinate':'Justify, assess and build a pathway'}</span></div></div><div class="grid2"><section class="card casehero"><div class="meta"><span class="tag">Fictional clinical case</span><span class="tag">District hospital</span></div><p class="eyebrow">Aarav · Day 4 of life</p><h2>Well yesterday.<br>Hard to wake today.</h2><p>He has stopped feeding and is increasingly drowsy. The team is assessing possible sepsis. What should happen alongside that assessment?</p><button class="btn" data-go="case-a">Step into the case →</button><p class="small" style="margin-top:15px;margin-bottom:0">Three decisions. New information at every step.</p></section><section class="card"><p class="eyebrow">Make the course yours</p><h2>One child. Different depths.</h2><p class="small">Your selected role changes which explanations are essential. Add depth whenever you want.</p><p>${badge('Must Know')} <span class="small">Required for your role</span></p><p>${badge('Nice to Know')} <span class="small">Extend your reasoning</span></p><p>${badge('Good to Know')} <span class="small">Explore advanced practice</span></p><div class="progress" role="progressbar" aria-label="Completed clinical rooms" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="10"><span style="width:${done*10}%"></span></div><button class="btn secondary" data-go="learn-${next.id}">${done?'Continue learning':'Open room 01'} →</button></section></div><div class="row spread"><h2>Your clinical rooms</h2><button class="textbtn" data-go="baseline">Start with a three-question baseline →</button></div>${C.lessons.map(l=>`<div class="course-row"><span class="number">${String(l.id).padStart(2,'0')}</span><div class="grow"><h3>${esc(l.title)}</h3><p>${esc(l.subtitle)}</p><span class="small">${visibleSections(l).length} sections in your selected depth · ${l.minutes} min estimated with practice</span></div><button class="btn secondary" data-go="learn-${l.id}">${result(l.check.id)?.correct?'Revisit':'Open'} →</button></div>`).join('')}<div class="takeaway">Your endpoint: explain what matters, what you would do next within your role, and what evidence could change your mind.</div>`;}
function lessonPage(l){const shown=visibleSections(l),hidden=l.sections.length-shown.length;return `<p class="eyebrow">Clinical room ${String(l.id).padStart(2,'0')} · ${l.minutes} min estimate</p><h1>${esc(l.title)}</h1><p class="lead">${esc(l.subtitle)}</p><div class="lesson-layout"><div>${shown.map(s=>`<article class="section" id="s-${s.id}"><div class="meta">${badge(s.depth[state.role])}</div><h2>${esc(s.title)}</h2>${s.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}${s.points?.length?`<ul>${s.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}${refs(s.sourceIds)}<label class="confidence"><input type="checkbox" data-read="${s.id}" ${state.read[s.id]?'checked':''}> I can explain this point in my own words</label></article>`).join('')}${hidden?`<div class="asidebox">${hidden} deeper section${hidden>1?'s are':' is'} available. <button class="textbtn" data-all-depth>Show all depths →</button></div>`:''}<div class="takeaway"><strong>Carry this forward</strong><br>${esc(l.takeaway)}</div>${quizHTML(l.check)}<label class="field"><span>One thing I would do differently</span><textarea data-note="lesson-${l.id}" placeholder="Capture your reasoning. Keep patient-identifying information out of these notes.">${esc(state.notes['lesson-'+l.id]||'')}</textarea><small>Personal reflection. Saved in this browser.</small></label><div class="next-row"><button class="btn secondary" data-go="${l.id===1?'home':'learn-'+(l.id-1)}">← ${l.id===1?'Your path':'Previous room'}</button><button class="btn" data-go="${l.id===10?'cases':'learn-'+(l.id+1)}">${l.id===10?'Apply it to the cases':'Next room'} →</button></div></div><aside class="lesson-aside"><div class="asidebox"><h3>By the end, you can…</h3><ul>${l.outcomes.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></div><div class="asidebox"><h3>Your ${esc(state.role)} path</h3><p>${l.sections.filter(s=>s.depth[state.role]==='Must Know').length} essential sections. Complete their explain-back checks and correct the room question to complete this room.</p><p class="small">Checkboxes are self-report. The question checks one applied decision.</p></div><div class="asidebox"><h3>Try a patient journey</h3><button class="textbtn" data-go="${l.id<=4?'case-a':l.id<=6?'case-b':l.id<=8?'case-c':'case-d'}">Apply this room →</button></div></aside></div>`;}
function quizHTML(q){const a=result(q.id),old=state.answers[q.id],choice=pending[q.id]??a?.choice,conf=state.confidence[q.id]||a?.confidence||'';return `<section class="quiz" id="q-${q.id}" aria-labelledby="title-${q.id}"><div class="meta"><span class="tag">${q.id.startsWith('lc')?'Check your reasoning':'Decision practice'}</span>${q.critical?'<span class="tag must">Critical action</span>':''}</div><h3 id="title-${q.id}">${esc(q.stem)}</h3><div role="group" aria-label="Answer choices">${q.options.map((o,i)=>`<button class="option ${choice===i?'selected':''} ${a?(i===q.answer?'right':a.choice===i?'wrong':''):''}" data-option="${q.id}" data-choice="${i}" ${a?'disabled':''} aria-pressed="${choice===i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o.text)}</span></button>`).join('')}</div>${!a?`<div class="confidence"><label for="confidence-${q.id}">How sure are you?</label><select id="confidence-${q.id}" data-confidence="${q.id}"><option value="">Choose confidence</option>${['Guessing','Partly sure','Confident'].map(c=>`<option ${conf===c?'selected':''}>${c}</option>`).join('')}</select><button class="btn" data-submit="${q.id}" ${choice===undefined||!conf?'disabled':''}>Check my decision</button></div>${old?'<p class="small">This is a feedback-assisted retry. Your first attempt stays in your record.</p>':''}`:`<div class="feedback ${a.correct?'':'wrong'}" role="status"><strong>${a.correct?'Reasoning checked':'A point to revisit'}</strong>${esc(q.options[a.choice].feedback)}${q.options[a.choice].consequence?`<p style="margin:10px 0 0"><b>In this case:</b> ${esc(q.options[a.choice].consequence)}</p>`:''}</div>${!a.correct?`<p class="small">Best answer: ${esc(q.options[q.answer].text)}</p><button class="textbtn" data-retry="${q.id}">Try the decision again →</button>`:'<p class="small">Explain the reason aloud before moving on.</p>'}<details><summary>Why the other options differ</summary>${q.options.map((o,i)=>`<p><b>${String.fromCharCode(65+i)}.</b> ${esc(o.feedback)}</p>`).join('')}</details>${refs(q.sourceIds)}`}<p class="small" style="margin-bottom:0">${old?`First attempt: ${old.firstCorrect?'correct':'needs review'} · ${old.attempts} attempt${old.attempts===1?'':'s'}`:'Make your decision before opening the evidence.'}</p></section>`;}
function casesPage(){return `<p class="eyebrow">Four patient journeys</p><h1>Follow the child.<br>Make the next decision.</h1><p class="lead">Original fictional cases, designed around Indian clinical settings. Each journey unfolds across three decisions. Feedback explains the consequence and the reasoning.</p><div class="grid2">${C.cases.map((c,i)=>{const s=score(c.steps);return `<article class="card ${i===0?'casehero':''}"><div class="meta"><span class="tag">${esc(c.setting)}</span></div><p class="eyebrow">${esc(c.name)} · ${esc(c.age)}</p><h2>${esc(c.title)}</h2><p>${esc(c.intro)}</p><div class="row spread"><button class="btn" data-go="${c.id}">${s.seen?'Continue / revisit':'Enter the case'} →</button><span class="small">${s.now}/3 decisions corrected</span></div></article>`;}).join('')}</div>`;}
function casePage(c){let n=Math.max(0,Math.min(c.steps.length-1,state.caseSteps[c.id]||0));for(let i=0;i<n;i++)if(!result(c.steps[i].id)?.correct){n=i;break;}state.caseSteps[c.id]=n;const q=c.steps[n],s=score(c.steps),done=s.now===3;return `<button class="textbtn" data-go="cases">← All patient journeys</button><p class="eyebrow" style="margin-top:15px">Fictional case · ${esc(c.setting)}</p><h1>${esc(c.name)}: ${esc(c.title)}</h1><p class="lead">${esc(c.intro)}</p><div class="steps" aria-label="Case progress: step ${n+1} of 3">${c.steps.map((_,i)=>`<span class="${i<=n?'done':''}"></span>`).join('')}</div><p class="small">Decision ${n+1} of ${c.steps.length} · ${esc(c.age)}</p><div class="case-reveal">${esc(q.reveal)}</div>${quizHTML(q)}<div class="next-row"><button class="btn secondary" data-case-prev="${c.id}" ${n===0?'disabled':''}>← Previous decision</button>${n<c.steps.length-1?`<button class="btn" data-case-next="${c.id}" ${!result(q.id)?.correct?'disabled':''}>Reveal the next stage →</button>`:`<button class="btn" data-go="cases">All patient journeys →</button>`}</div>${done?`<div class="takeaway"><h3>Case debrief</h3>${esc(c.debrief)}</div><p class="small">First attempt: ${s.first}/3. Current practice: ${s.now}/3. Revisiting an answer records learning after feedback.</p>${refs(c.sourceIds)}<label class="field"><span>My next three actions in a similar case</span><textarea data-note="${c.id}">${esc(state.notes[c.id]||'')}</textarea></label>`:''}`;}
function baselinePage(){const s=score(C.baseline);return `<p class="eyebrow">Before you begin</p><h1>Find your starting point.</h1><p class="lead">Three short decisions, with a confidence rating. No pass mark. Your first answers remain visible so you can distinguish prior knowledge from learning after feedback.</p>${s.seen===3?`<div class="takeaway">Baseline first attempt: <b>${s.first}/3</b>. Take the course, then use unfamiliar final questions to check your reasoning. The two sets differ, so this is not a validated pre/post measurement.</div>`:''}${C.baseline.map(quizHTML).join('')}<button class="btn" data-go="learn-1">Enter room 01 →</button>`;}
function finalPage(){const pool=finalPool(),s=score(pool),critical=pool.filter(q=>q.critical&&!result(q.id)?.correct),done=s.now===pool.length;return `<p class="eyebrow">Final practice · ${esc(state.role)} path</p><h1>Show your reasoning.</h1><p class="lead">${pool.length} fresh decisions for your selected role. Commit to an answer and confidence before feedback. Correct missed decisions, then explain why.</p><div class="stats"><div class="stat"><strong>${s.first}/${s.total}</strong><span>Correct on first attempt · ${s.seen} answered</span></div><div class="stat"><strong>${s.now}/${s.total}</strong><span>Correct in current practice</span></div><div class="stat"><strong>${critical.length}</strong><span>Critical actions still to demonstrate</span></div></div>${done?`<div class="takeaway"><strong>Final practice complete.</strong> You have corrected all ${pool.length} decisions in this path. Your first-attempt score remains ${s.first}/${pool.length}. Revisit the reasoning after a delay and demonstrate it in supervised practice.</div><button class="btn secondary" data-go="progress">View my learning record →</button>`:'<p class="small">This is an educational practice checkpoint, not an accredited examination or a clinical competence certificate.</p>'}${pool.map(quizHTML).join('')}${state.role==='Faculty'?'<button class="btn" data-go="faculty">Complete the faculty workshop →</button>':''}`;}
function facultyPage(){const f=C.facultyTask;return `<p class="eyebrow">Faculty workshop · Open to every learner</p><h1>${esc(f.title)}</h1><p class="lead">${esc(f.prompt)}</p><div class="takeaway">Bring together paediatrics, emergency/NICU/PICU, laboratory medicine, metabolic/genetics expertise, dietetics and the team coordinating referral. Test the draft with a night-time case.</div>${f.fields.map(x=>`<label class="field"><span>${esc(x.label)}</span><textarea data-faculty="${x.id}">${esc(state.faculty[x.id]||'')}</textarea><small>${esc(x.hint)}</small></label>`).join('')}<section class="card"><h2>Review your draft</h2><p class="small">These are self-review prompts. No specialist or institution has approved the draft through this interface.</p>${f.rubric.map((r,i)=>`<label class="confidence" style="align-items:flex-start"><input type="checkbox" data-rubric="${i}" ${state.rubric[i]?'checked':''}><span><b>${esc(r.title)}</b><br>${esc(r.description)}</span></label>`).join('')}</section><div class="toolbar"><button class="btn" data-export="faculty">Download my pathway draft</button><button class="btn secondary" data-go="progress">View learning record</button></div>`;}
function progressPage(){const pool=finalPool(),s=score(pool),cs=score(C.cases.flatMap(c=>c.steps)),bs=score(C.baseline),over=questions.filter(q=>state.answers[q.id]?.firstConfidence==='Confident'&&!state.answers[q.id]?.firstCorrect),missing=C.lessons.filter(l=>!result(l.check.id)?.correct);return `<p class="eyebrow">My learning record</p><h1>Confidence, with evidence.</h1><p class="lead">This record distinguishes first attempts, corrected practice and self-reported explain-back. It describes learning in this course.</p><div class="stats"><div class="stat"><strong>${completedLessons()}/10</strong><span>Rooms completed for ${esc(state.role)}</span></div><div class="stat"><strong>${cs.first}/12</strong><span>Case decisions correct first time · ${cs.seen} answered</span></div><div class="stat"><strong>${s.first}/${s.total}</strong><span>Final first attempt · ${s.seen} answered</span></div></div><div class="grid2"><section class="card"><h2>What to revisit</h2>${missing.length?missing.map(l=>`<p><button class="textbtn" data-go="learn-${l.id}">${esc(l.title)} →</button></p>`).join(''):'<p>Every room question has been corrected. Revisit a case after a delay and explain the decision without looking at the answer.</p>'}</section><section class="card"><h2>Where confidence outran accuracy</h2>${over.length?`<p class="small">${over.length} answer${over.length===1?' was':'s were'} marked confident but incorrect on the first attempt.</p>${over.map(q=>`<p class="small">${esc(q.stem)}</p>`).join('')}`:'<p class="small">No confident-but-incorrect first attempts recorded so far. This becomes more informative as you answer the cases.</p>'}<p class="small">Baseline first attempt: ${bs.first}/3 (${bs.seen} answered). A different final set does not establish a validated learning gain.</p></section></div><h2>My role-specific outcomes</h2><div class="table-wrap"><table><thead><tr><th>Room</th><th>Required explanations</th><th>Decision practice</th></tr></thead><tbody>${C.lessons.map(l=>{const ss=l.sections.filter(x=>x.depth[state.role]==='Must Know');return `<tr><td>${esc(l.title)}</td><td>${ss.filter(x=>state.read[x.id]).length}/${ss.length} self-reported</td><td>${state.answers[l.check.id]?`First: ${state.answers[l.check.id].firstCorrect?'correct':'review needed'} · Current: ${result(l.check.id)?.correct?'corrected':'revisit'}`:'Not yet attempted'}</td></tr>`}).join('')}</tbody></table></div><div class="toolbar"><button class="btn" data-export="record">Download learning record</button><button class="btn secondary" data-go="toolkit">Take the study toolkit</button><button class="textbtn" data-reset>Reset this browser’s progress</button></div><p class="small">Progress and reflections are stored on this browser only. They do not sync between devices or establish professional certification.</p>`;}
function toolkitPage(){return `<p class="eyebrow">Study toolkit</p><h1>Keep the useful parts.</h1><p class="lead">Concise learning prompts for revision and supervised discussion. Clinical treatment, prescribing and specimen procedures require the current local protocol and receiving laboratory instructions.</p><div class="toolbar"><button class="btn" data-guide>Download my selected study guide</button><a class="btn secondary" href="offline.html" download="The_Metabolic_Child_Offline.html">Download the complete offline course</a><button class="btn secondary" data-print>Print this toolkit</button></div>${C.toolkit.map(t=>`<section class="card"><p class="eyebrow">${esc(t.label)}</p><h2>${esc(t.title)}</h2><ol>${t.points.map(p=>`<li style="margin-bottom:9px">${esc(p)}</li>`).join('')}</ol>${refs(t.sourceIds)}</section>`).join('')}`;}
function sourcesPage(){return `<p class="eyebrow">Evidence & course notes</p><h1>Know where the teaching comes from.</h1><p class="lead">Original explanations and fictional cases, informed by Indian and international sources. Source access and clinical revision dates are recorded separately.</p><section class="card"><h2>Scope of this edition</h2><p>This is a complete interactive educational edition, awaiting independent specialist review and a learner pilot. It contains text lessons, decision feedback and printable study materials. It does not provide patient-specific prescriptions, accredited certificates or a verified live emergency directory.</p><p>UG means MBBS learner; PG means paediatric resident; faculty means general medical or paediatric teacher. Role/depth labels and assessment choices are course-design decisions. Exact NMC competency-code mapping remains to be completed.</p><p>Progress is device-local. No name, email or patient information is needed. Notes and pathway drafts stay in this browser unless you download them.</p></section><details><summary>How to use this course well</summary><p>Answer before reading the feedback, rate your confidence honestly, explain the key point aloud, and apply it to an unfamiliar case. Revisit the cases after a delay. Use the faculty rubric to discuss a local pathway with the relevant clinical and laboratory teams.</p></details><details><summary>Abbreviations used in the course</summary><p>IEM: inborn error of metabolism. NBS: newborn screening. UCD: urea-cycle disorder. FAOD: fatty-acid oxidation disorder. MCAD: medium-chain acyl-CoA dehydrogenase deficiency. MSUD: maple syrup urine disease. MMA: methylmalonic acidaemia. PAH: phenylalanine hydroxylase. VUS: variant of uncertain significance. SOP: standard operating procedure. CoE: Centre of Excellence. NPRD: National Policy for Rare Diseases. NICU/PICU: neonatal/paediatric intensive-care unit.</p></details>${C.sources.map(s=>`<article class="source-card"><span class="tag">${esc(s.id)}</span><h3><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)} ↗</a></h3><p><b>Version:</b> ${esc(s.date_version)}</p><p><b>Reviewed:</b> ${esc(s.verified_scope)}</p><p><b>Access:</b> ${esc(s.access)}</p><p>${esc(s.caveat)}</p></article>`).join('')}`;}
function bind(){
 document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));
 document.getElementById('role').onchange=e=>{state.role=e.target.value;save();render();};
 document.getElementById('depth').onchange=e=>{state.depth=e.target.value;save();render();};
 document.getElementById('mobile-menu').onclick=()=>{mobileOpen=!mobileOpen;render();};
 document.querySelectorAll('[data-all-depth]').forEach(e=>e.onclick=()=>{state.depth='Good to Know';save();render();});
 document.querySelectorAll('[data-read]').forEach(e=>e.onchange=()=>{state.read[e.dataset.read]=e.checked;save();});
 document.querySelectorAll('[data-option]').forEach(e=>e.onclick=()=>{pending[e.dataset.option]=Number(e.dataset.choice);const y=scrollY;render();window.scrollTo(0,y);document.querySelector(`[data-option="${e.dataset.option}"][data-choice="${e.dataset.choice}"]`)?.focus({preventScroll:true});});
 document.querySelectorAll('[data-confidence]').forEach(e=>e.onchange=()=>{state.confidence[e.dataset.confidence]=e.value;save();const b=document.querySelector(`[data-submit="${e.dataset.confidence}"]`);if(b)b.disabled=pending[e.dataset.confidence]===undefined||!e.value;});
 document.querySelectorAll('[data-submit]').forEach(e=>e.onclick=()=>submit(e.dataset.submit));
 document.querySelectorAll('[data-retry]').forEach(e=>e.onclick=()=>{state.answers[e.dataset.retry].retry=true;delete pending[e.dataset.retry];state.confidence[e.dataset.retry]='';save();render();document.getElementById('q-'+e.dataset.retry)?.scrollIntoView({block:'center'});});
 document.querySelectorAll('[data-case-next]').forEach(e=>e.onclick=()=>{const c=C.cases.find(c=>c.id===e.dataset.caseNext),n=state.caseSteps[c.id]||0;if(result(c.steps[n].id)?.correct){state.caseSteps[c.id]=Math.min(n+1,c.steps.length-1);save();render();document.querySelector('.case-reveal')?.scrollIntoView({block:'center'});}});
 document.querySelectorAll('[data-case-prev]').forEach(e=>e.onclick=()=>{state.caseSteps[e.dataset.casePrev]=Math.max(0,(state.caseSteps[e.dataset.casePrev]||0)-1);save();render();});
 document.querySelectorAll('[data-note]').forEach(e=>e.oninput=()=>{state.notes[e.dataset.note]=e.value;save();});
 document.querySelectorAll('[data-faculty]').forEach(e=>e.oninput=()=>{state.faculty[e.dataset.faculty]=e.value;save();});
 document.querySelectorAll('[data-rubric]').forEach(e=>e.onchange=()=>{state.rubric[e.dataset.rubric]=e.checked;save();});
 document.querySelectorAll('[data-export]').forEach(e=>e.onclick=()=>downloadRecord(e.dataset.export));
 document.querySelector('[data-guide]')?.addEventListener('click',downloadGuide);
 document.querySelector('[data-print]')?.addEventListener('click',()=>window.print());
 document.querySelector('[data-reset]')?.addEventListener('click',()=>{if(confirm('Reset course answers, reflections and progress stored in this browser? Download your learning record first if you want to keep it.')){state=defaults();pending={};save();go('home');}});
}
function submit(id){const q=qmap[id],choice=pending[id],confidence=state.confidence[id];if(!q||!Number.isInteger(choice)||choice<0||choice>=q.options.length||!['Guessing','Partly sure','Confident'].includes(confidence))return;const old=state.answers[id],correct=choice===q.answer;state.answers[id]={choice,correct,confidence,firstCorrect:old?old.firstCorrect:correct,firstConfidence:old?old.firstConfidence:confidence,attempts:(old?.attempts||0)+1,time:new Date().toISOString()};delete pending[id];save();render();document.getElementById('q-'+id)?.scrollIntoView({block:'center',behavior:'smooth'});}
function downloadFile(name,content,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function downloadRecord(kind){const lines=['THE METABOLIC CHILD','Personal educational record — not a clinical competence certificate',`Exported: ${new Date().toLocaleString()}`,`Role: ${state.role}; Depth: ${state.depth}`,''];if(kind!=='faculty'){lines.push(`Rooms completed: ${completedLessons()}/10`,'','DECISION PRACTICE');for(const q of questions){const a=state.answers[q.id];if(a)lines.push(`${q.id}: ${q.stem}\nFirst attempt: ${a.firstCorrect?'correct':'incorrect'} (${a.firstConfidence}); current: ${!a.retry&&a.correct?'correct':'revisit'}; attempts: ${a.attempts}`);}lines.push('','REFLECTIONS');for(const [k,v]of Object.entries(state.notes))if(v.trim())lines.push(k,v,'');}lines.push('','FACULTY PATHWAY DRAFT — SELF-REVIEWED, NOT APPROVED');for(const f of C.facultyTask.fields)lines.push(f.label,state.faculty[f.id]||'[Not entered]','');lines.push('SELF-REVIEW');C.facultyTask.rubric.forEach((r,i)=>lines.push(`${state.rubric[i]?'[x]':'[ ]'} ${r.title}: ${r.description}`));downloadFile(kind==='faculty'?'My_IEM_Pathway_Draft.txt':'My_IEM_Learning_Record.txt',lines.join('\n'));}
function downloadGuide(){const content=`<!doctype html><html lang="en"><meta charset="utf-8"><title>The Metabolic Child — Study guide</title><style>body{font:16px/1.75 Arial,sans-serif;max-width:850px;margin:40px auto;padding:20px;color:#233043}h1,h2{font-family:Georgia,serif}section{margin:28px 0;padding-top:18px;border-top:1px solid #ddd}small{color:#52616b}a{color:#8f4429}@media print{section{break-inside:avoid}}</style><h1>The Metabolic Child</h1><p>Selected study guide: ${esc(state.role)} · ${esc(state.depth)} · September 2026</p><p>Educational edition awaiting independent clinical and learner-pilot review. Follow current local protocols and specialist advice in practice.</p>${C.lessons.map(l=>`<section><h2>${l.id}. ${esc(l.title)}</h2>${visibleSections(l).map(s=>`<h3>${esc(s.title)} <small>(${esc(s.depth[state.role])})</small></h3>${s.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}${s.points?.length?`<ul>${s.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}${refs(s.sourceIds)}`).join('')}<p><b>Carry forward:</b> ${esc(l.takeaway)}</p></section>`).join('')}<h2>References</h2>${C.sources.map(s=>`<p><b>${esc(s.id)}</b> <a href="${esc(s.url)}">${esc(s.title)}</a><br><small>${esc(s.date_version)}</small></p>`).join('')}</html>`;downloadFile('My_IEM_Study_Guide.html',content,'text/html;charset=utf-8');}
document.querySelector('.skip')?.addEventListener('click',e=>{e.preventDefault();document.getElementById('main')?.focus({preventScroll:true});window.scrollTo(0,0);});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);document.getElementById('main')?.focus({preventScroll:true});});
render();
if(document.modelContext?.registerTool){try{document.modelContext.registerTool({name:'configure_learning_path',title:'Configure learning path',description:'Set the visible learner role and depth. Saves these preferences only in this browser.',inputSchema:{type:'object',properties:{role:{type:'string',enum:['UG','PG','Faculty']},depth:{type:'string',enum:['Must Know','Nice to Know','Good to Know']}},required:['role','depth'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||!['UG','PG','Faculty'].includes(input.role)||!(input.depth in ranks)||Object.keys(input).some(k=>!['role','depth'].includes(k)))throw new Error('Choose a supported role and depth.');state.role=input.role;state.depth=input.depth;save();render();return {role:state.role,depth:state.depth,visibleSections:C.lessons.reduce((n,l)=>n+visibleSections(l).length,0)};}});document.modelContext.registerTool({name:'read_learning_progress',title:'Read learning progress',description:'Read device-local course practice counts without changing answers or progress.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute(){return {role:state.role,completedRooms:completedLessons(),casePractice:score(C.cases.flatMap(c=>c.steps)),finalPractice:score(finalPool())};}});}catch{}}
</script></body></html>
