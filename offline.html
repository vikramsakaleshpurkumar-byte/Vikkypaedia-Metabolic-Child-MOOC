</style></head><body><a class="skip" href="#main">Skip to learning</a><div id="app"></div><script>window.COURSE={"version":"2.1","checkedOn":"2026-09-12","lessons":[{"id":1,"title":"Could this be metabolic?","subtitle":"Recognise a pattern that deserves an urgent second look.","minutes":10,"outcomes":["Identify a concerning illness trajectory.","Explain why an absent family history does not exclude IEM.","Give a focused, supervised escalation."],"sections":[{"id":"1a","title":"Begin with the trajectory","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Inborn errors of metabolism (IEMs) affect the body's processing, transport or storage of substances. Ask: does the course fit the working diagnosis? Consider unexplained encephalopathy, recurrent deterioration or several organ systems becoming involved. Vomiting alone is common; vomiting with altered consciousness and an unusual biochemical pattern deserves a different level of attention."],"points":["Pause: describe what changed, when it changed and what remains unexplained."],"sourceIds":["GL03"]},{"id":"1b","title":"Notice the trigger","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Fictional case: Meera, aged 18 months, becomes unusually drowsy during a vomiting illness after taking little food. A previous similar admission ended without a diagnosis. Infection and reduced intake can expose an energy-production problem. MCAD deficiency is one example of a fatty-acid oxidation disorder in which illness or fasting may precede hypoglycaemia with an inadequate ketone response. This example does not establish Meera's diagnosis."],"points":["Ask about the last normal meal and similar episodes; never provoke fasting to reproduce symptoms."],"sourceIds":["GL05"]},{"id":"1c","title":"Take a family story without blame","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Ask sensitively about unexplained childhood deaths, affected relatives and parental relatedness. Many children have no recognised family history. Say: 'Inherited conditions can occur even when everyone else seems well.' Record what is uncertain. An MBBS learner should present findings to the supervising clinician and assist within their assigned role."],"points":["Practise replacing 'no family history, so unlikely' with a precise account of what was asked."],"sourceIds":["GL03"]},{"id":"1d","title":"Keep two explanations open","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["A positive infection result need not explain everything. Classic galactosaemia can present with liver dysfunction and bacterial sepsis, including E. coli infection. Thus, sepsis and an inherited disorder may coexist. For a neonate with infection plus unexplained jaundice, bleeding or persistent liver dysfunction, discuss whether a second process requires investigation while infection care continues."],"points":["PG reasoning: state which finding your current diagnosis explains least well."],"sourceIds":["E04"]},{"id":"1e","title":"Make the concern actionable","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Try this handover: 'Meera is drowsy after poor intake, with a similar previous episode. I am concerned about a metabolic or endocrine cause alongside infection. She needs urgent senior assessment.' Faculty can ask learners to separate facts from hypotheses and explain the next safe action. Assess recognition and communication, as well as diagnostic knowledge."],"points":["Reflect: which detail would you put in the first sentence of your referral?"],"sourceIds":[]}],"takeaway":"Recognise the unusual course, keep alternatives open and escalate a concrete concern.","check":{"id":"lc1","stem":"Meera has recurrent illness-related drowsiness and no known affected relatives. What is the best next approach?","options":[{"text":"Escalate urgently and investigate metabolic or endocrine causes alongside the current illness.","feedback":"Correct. Recurrent deterioration needs explanation; a negative family history cannot exclude an inherited disorder."},{"text":"Reassure because inherited disorders always affect another relative.","feedback":"Incorrect. The family may have no recognised previous case."},{"text":"Wait for another episode before assessing the pattern.","feedback":"Incorrect. The current altered consciousness requires prompt assessment."},{"text":"Diagnose MCAD deficiency from the history alone.","feedback":"Incorrect. The history raises a possibility; biochemical and confirmatory evaluation are still needed."}],"answer":0,"critical":true,"sourceIds":["GL03","GL05"]},"evaluation":[{"id":"lc1","stem":"Meera has recurrent illness-related drowsiness and no known affected relatives. What is the best next approach?","options":[{"text":"Escalate urgently and investigate metabolic or endocrine causes alongside the current illness.","feedback":"Correct. Recurrent deterioration needs explanation; a negative family history cannot exclude an inherited disorder."},{"text":"Reassure because inherited disorders always affect another relative.","feedback":"Incorrect. The family may have no recognised previous case."},{"text":"Wait for another episode before assessing the pattern.","feedback":"Incorrect. The current altered consciousness requires prompt assessment."},{"text":"Diagnose MCAD deficiency from the history alone.","feedback":"Incorrect. The history raises a possibility; biochemical and confirmatory evaluation are still needed."}],"answer":0,"critical":true,"sourceIds":["GL03","GL05"]},{"id":"lc1-2","stem":"Which feature most strongly supports urgent metabolic consideration?","options":[{"text":"Recurrent deterioration during poor intake","feedback":"Correct. The recurrent, trigger-linked pattern is the useful signal."},{"text":"A single loose stool","feedback":"Incorrect. The recurrent, trigger-linked pattern is the useful signal."},{"text":"Normal birth weight","feedback":"Incorrect. The recurrent, trigger-linked pattern is the useful signal."},{"text":"No affected relative","feedback":"Incorrect. The recurrent, trigger-linked pattern is the useful signal."}],"answer":0,"critical":true,"sourceIds":["GL03","GL05"]},{"id":"lc1-3","stem":"How should a negative family history be interpreted?","options":[{"text":"It excludes recessive disease","feedback":"Incorrect. Many inherited disorders present without a recognised family history."},{"text":"It lowers urgency","feedback":"Incorrect. Many inherited disorders present without a recognised family history."},{"text":"It does not exclude an inherited disorder","feedback":"Correct. Many inherited disorders present without a recognised family history."},{"text":"It proves a new mutation","feedback":"Incorrect. Many inherited disorders present without a recognised family history."}],"answer":2,"critical":false,"sourceIds":["GL03","GL05"]},{"id":"lc1-4","stem":"A culture is positive but several findings remain unexplained. What is best?","options":[{"text":"Stop the differential","feedback":"Incorrect. Coexisting infection and metabolic disease are possible."},{"text":"Continue infection care and investigate the unexplained pattern","feedback":"Correct. Coexisting infection and metabolic disease are possible."},{"text":"Ignore the culture","feedback":"Incorrect. Coexisting infection and metabolic disease are possible."},{"text":"Wait for discharge","feedback":"Incorrect. Coexisting infection and metabolic disease are possible."}],"answer":1,"critical":false,"sourceIds":["GL03","GL05"]},{"id":"lc1-5","stem":"Which referral statement is most useful?","options":[{"text":"The child looks odd","feedback":"Incorrect. A useful handover states the pattern, urgency and requested action."},{"text":"Please rule out everything","feedback":"Incorrect. A useful handover states the pattern, urgency and requested action."},{"text":"Recurrent drowsiness follows poor intake; urgent metabolic or endocrine assessment is needed alongside infection care","feedback":"Correct. A useful handover states the pattern, urgency and requested action."},{"text":"The family is anxious","feedback":"Incorrect. A useful handover states the pattern, urgency and requested action."}],"answer":2,"critical":false,"sourceIds":["GL03","GL05"]}]},{"id":2,"title":"The sick neonate","subtitle":"Investigate infection and metabolic disease in parallel.","minutes":12,"outcomes":["Recognise an initially well newborn who deteriorates.","Prioritise assessment and first-line tests.","Avoid false reassurance from a pending newborn screen."],"sections":[{"id":"2a","title":"A well start can precede illness","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Fictional case: Aarav fed normally after an uncomplicated birth. On day four he has a weak suck, increasing sleepiness and rapid breathing. Some severe urea-cycle disorders become apparent after birth as ammonia accumulates. Other IEMs can follow a similar early course. An initially well interval is a clue to retain, not proof of a metabolic diagnosis."],"points":["Write the timeline: birth, normal feeds, first change and present condition."],"sourceIds":["GL04"]},{"id":"2b","title":"Assess the baby before the label","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["A neonate who is difficult to wake, feeds poorly or has abnormal breathing needs prompt senior assessment. Fever can be absent in serious infection. Assess airway, breathing, circulation, neurological state, temperature and glucose while considering infection, cardiac disease, surgical illness and endocrine causes."],"points":["UG action: call the supervising clinician and assist with observation and documentation."],"sourceIds":["E06"]},{"id":"2c","title":"Run the first investigations in parallel","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["The supervised initial work-up commonly brings together bedside glucose, blood gas, lactate, ammonia and ketone assessment, with blood counts, electrolytes, liver tests and infection investigations according to presentation. Arrange collection with the laboratory. Do not postpone stabilisation for a complete sample set. Sepsis evaluation and indicated treatment proceed alongside metabolic investigation; no trial of waiting for antibiotic response is required."],"points":["A pending or reported normal newborn screen does not replace assessment of a symptomatic baby."],"sourceIds":["IN01","GL03"]},{"id":"2d","title":"Let a new finding broaden the differential","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Consider a separate teaching vignette: a newborn with poor feeding, jaundice and bleeding. A culture later identifies E. coli. Classic galactosaemia belongs in the differential because sepsis and hepatic involvement may occur together. This does not mean every infected or jaundiced infant has galactosaemia. The team integrates examination, laboratory results and specialist advice to choose confirmatory investigations."],"points":["Explain why a positive culture may answer only part of the case."],"sourceIds":["E04"]},{"id":"2e","title":"Do not wait for a signature sign","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Good to Know"},"paragraphs":["MSUD can also produce neonatal feeding difficulty followed by encephalopathy. Specialist amino-acid testing, including alloisoleucine, helps investigate that possibility. A characteristic odour should never become an entry requirement for assessment. Ask which information changes urgency and which information refines diagnosis: these are related but different questions."],"points":["Aarav's deterioration establishes urgency before the diagnosis."],"sourceIds":["E05"]}],"takeaway":"An unexplained sick neonate needs immediate assessment, with sepsis and metabolic pathways running together.","check":{"id":"lc2","stem":"Aarav is deteriorating, antibiotics have just started and his screening result is pending. What should happen next?","options":[{"text":"Review for IEM only if antibiotics fail over the next two days.","feedback":"Incorrect. Progressive illness already warrants concurrent assessment; a waiting period risks delay."},{"text":"Continue stabilisation and sepsis care while arranging urgent metabolic tests and specialist discussion.","feedback":"Correct. The clinical trajectory justifies parallel investigation and early escalation."},{"text":"Wait for the newborn screen before requesting ammonia.","feedback":"Incorrect. Severe illness can develop before screening results, and screening does not detect every IEM."},{"text":"Exclude infection because there was a symptom-free interval.","feedback":"Incorrect. The timing is a clue, not a test that rules infection out."}],"answer":1,"critical":true,"sourceIds":["IN01","GL03","E06"]},"evaluation":[{"id":"lc2","stem":"Aarav is deteriorating, antibiotics have just started and his screening result is pending. What should happen next?","options":[{"text":"Review for IEM only if antibiotics fail over the next two days.","feedback":"Incorrect. Progressive illness already warrants concurrent assessment; a waiting period risks delay."},{"text":"Continue stabilisation and sepsis care while arranging urgent metabolic tests and specialist discussion.","feedback":"Correct. The clinical trajectory justifies parallel investigation and early escalation."},{"text":"Wait for the newborn screen before requesting ammonia.","feedback":"Incorrect. Severe illness can develop before screening results, and screening does not detect every IEM."},{"text":"Exclude infection because there was a symptom-free interval.","feedback":"Incorrect. The timing is a clue, not a test that rules infection out."}],"answer":1,"critical":true,"sourceIds":["IN01","GL03","E06"]},{"id":"lc2-2","stem":"What does an initially well interval in a deteriorating neonate mean?","options":[{"text":"It proves an IEM","feedback":"Incorrect. The interval is informative but not diagnostic."},{"text":"It is a clue that belongs in the timeline","feedback":"Correct. The interval is informative but not diagnostic."},{"text":"It excludes infection","feedback":"Incorrect. The interval is informative but not diagnostic."},{"text":"It permits observation at home","feedback":"Incorrect. The interval is informative but not diagnostic."}],"answer":1,"critical":true,"sourceIds":["IN01","GL03","E06"]},{"id":"lc2-3","stem":"Which bedside test should never be delayed in an unresponsive neonate?","options":[{"text":"Glucose","feedback":"Correct. Glucose is an immediate physiological priority."},{"text":"Electrophoresis","feedback":"Incorrect. Glucose is an immediate physiological priority."},{"text":"Sweat chloride","feedback":"Incorrect. Glucose is an immediate physiological priority."},{"text":"Bone age","feedback":"Incorrect. Glucose is an immediate physiological priority."}],"answer":0,"critical":false,"sourceIds":["IN01","GL03","E06"]},{"id":"lc2-4","stem":"How should sepsis and metabolic evaluation proceed?","options":[{"text":"One after the other","feedback":"Incorrect. Parallel pathways prevent avoidable delay."},{"text":"Only after screening","feedback":"Incorrect. Parallel pathways prevent avoidable delay."},{"text":"In parallel while stabilisation continues","feedback":"Correct. Parallel pathways prevent avoidable delay."},{"text":"Only after transfer","feedback":"Incorrect. Parallel pathways prevent avoidable delay."}],"answer":2,"critical":false,"sourceIds":["IN01","GL03","E06"]},{"id":"lc2-5","stem":"A newborn screen is reported normal. The baby is now symptomatic. What next?","options":[{"text":"Exclude IEM","feedback":"Incorrect. Screening does not cover every disorder and is not a diagnostic test for a sick baby."},{"text":"Assess the baby urgently on clinical grounds","feedback":"Correct. Screening does not cover every disorder and is not a diagnostic test for a sick baby."},{"text":"Repeat screening next month","feedback":"Incorrect. Screening does not cover every disorder and is not a diagnostic test for a sick baby."},{"text":"Reassure without examination","feedback":"Incorrect. Screening does not cover every disorder and is not a diagnostic test for a sick baby."}],"answer":1,"critical":false,"sourceIds":["IN01","GL03","E06"]}]},{"id":3,"title":"Read the metabolic pattern","subtitle":"Use biochemistry to direct the next question, without declaring a diagnosis.","minutes":12,"outcomes":["Combine acid–base state, glucose, ketones, lactate and ammonia.","Name a provisional disease family.","Identify a result needing urgent verification and escalation."],"sections":[{"id":"3a","title":"High ammonia with respiratory alkalosis","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Fictional learning results for Aarav: blood-gas pH 7.49, carbon dioxide 27 mmHg and bicarbonate 20 mmol/L, alongside ammonia flagged urgently high by the laboratory. The gas supports respiratory alkalosis. In this clinical setting a urea-cycle disorder is a concern, but the pattern is not confirmation. Hyperventilation can accompany hyperammonaemic brain dysfunction."],"points":["State both conclusions: 'urgent hyperammonaemia' and 'a provisional differential that includes a urea-cycle disorder'."],"sourceIds":["GL04"]},{"id":"3b","title":"Acidosis with ketones","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["A second fictional infant has metabolic acidosis, an increased anion gap, ketones and raised ammonia. Organic acidaemias belong in the differential; isolated methylmalonic acidaemia is one example. An anion gap reflects unmeasured ions, not a disease label. Interpret it using the laboratory's method and reference interval, and consider other causes of acidosis."],"points":["Specialised metabolite and confirmatory tests distinguish related disorders; a pattern table cannot."],"sourceIds":["GL06"]},{"id":"3c","title":"Low glucose with too few ketones","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["During low glucose, interpret ketones in relation to fasting, illness and treatment already received. Inappropriately low ketones raise concern for impaired fat utilisation or ketone production, while endocrine causes remain possible. MCAD deficiency is one exemplar. 'Hypoketotic' does not require absolute absence of ketones, and detected urine ketones cannot by themselves exclude a fatty-acid oxidation disorder."],"points":["Applied recall: explain why glucose and ketones are more informative together than separately."],"sourceIds":["GL05"]},{"id":"3d","title":"Check context before closing the case","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["An elevated lactate can reflect impaired perfusion or other secondary processes; it does not automatically establish mitochondrial disease. Ammonia can also rise in acquired illness. Check the sample conditions, current treatment and clinical trajectory. When a result is implausible, contact the laboratory promptly about recollection while the team continues assessment and necessary care."],"points":["PG task: give one biological explanation and one collection-related explanation for an unexpected result."],"sourceIds":["GL14"]},{"id":"3e","title":"Build a provisional map","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Good to Know"},"paragraphs":["Use three columns in your notes: observed pattern, plausible mechanisms and next discriminating information. For suspected MSUD, an amino-acid profile with alloisoleucine contributes information that a blood gas cannot supply. Faculty should reward explicit uncertainty: 'This supports X, but we must check Y.' Revisit the map after new results rather than forcing every value to match the first hypothesis."],"points":["These fictional numbers are not treatment thresholds."],"sourceIds":["E05"]}],"takeaway":"A biochemical pattern narrows the differential; urgency and confirmation are separate decisions.","check":{"id":"lc3","stem":"A sick neonate has respiratory alkalosis and an urgently high ammonia result. Which interpretation is best?","options":[{"text":"Normal glucose would exclude a metabolic emergency.","feedback":"Incorrect. Hyperammonaemia can be dangerous without hypoglycaemia."},{"text":"The pattern confirms a specific urea-cycle enzyme defect.","feedback":"Incorrect. Several causes remain possible and specific testing is needed."},{"text":"This is an emergency pattern warranting immediate escalation, with a urea-cycle disorder among the possibilities.","feedback":"Correct. Act on the danger while refining the diagnosis and checking specimen validity."},{"text":"The ammonia result is irrelevant unless there is severe metabolic acidosis.","feedback":"Incorrect. Urea-cycle presentations may lack that acid–base pattern."}],"answer":2,"critical":true,"sourceIds":["GL04","GL14"]},"evaluation":[{"id":"lc3","stem":"A sick neonate has respiratory alkalosis and an urgently high ammonia result. Which interpretation is best?","options":[{"text":"Normal glucose would exclude a metabolic emergency.","feedback":"Incorrect. Hyperammonaemia can be dangerous without hypoglycaemia."},{"text":"The pattern confirms a specific urea-cycle enzyme defect.","feedback":"Incorrect. Several causes remain possible and specific testing is needed."},{"text":"This is an emergency pattern warranting immediate escalation, with a urea-cycle disorder among the possibilities.","feedback":"Correct. Act on the danger while refining the diagnosis and checking specimen validity."},{"text":"The ammonia result is irrelevant unless there is severe metabolic acidosis.","feedback":"Incorrect. Urea-cycle presentations may lack that acid–base pattern."}],"answer":2,"critical":true,"sourceIds":["GL04","GL14"]},{"id":"lc3-2","stem":"Marked hyperammonaemia with respiratory alkalosis should raise concern for which family?","options":[{"text":"Urea-cycle disorders","feedback":"Correct. That combination is a classic urgent pattern for a possible urea-cycle disorder."},{"text":"Isolated renal stones","feedback":"Incorrect. That combination is a classic urgent pattern for a possible urea-cycle disorder."},{"text":"Iron deficiency","feedback":"Incorrect. That combination is a classic urgent pattern for a possible urea-cycle disorder."},{"text":"Coeliac disease","feedback":"Incorrect. That combination is a classic urgent pattern for a possible urea-cycle disorder."}],"answer":0,"critical":true,"sourceIds":["GL04","GL14"]},{"id":"lc3-3","stem":"Hypoglycaemia with inappropriately low ketones after poor intake suggests difficulty with what process?","options":[{"text":"Fatty-acid oxidation","feedback":"Correct. Fatty-acid oxidation disorders can produce hypoketotic hypoglycaemia."},{"text":"Platelet production","feedback":"Incorrect. Fatty-acid oxidation disorders can produce hypoketotic hypoglycaemia."},{"text":"Calcium absorption","feedback":"Incorrect. Fatty-acid oxidation disorders can produce hypoketotic hypoglycaemia."},{"text":"Bilirubin conjugation","feedback":"Incorrect. Fatty-acid oxidation disorders can produce hypoketotic hypoglycaemia."}],"answer":0,"critical":false,"sourceIds":["GL04","GL14"]},{"id":"lc3-4","stem":"High anion-gap acidosis with ketosis most directly suggests which broad group?","options":[{"text":"Organic acid disorders","feedback":"Correct. Organic acid disorders are an important metabolic consideration in this pattern."},{"text":"Pure respiratory disease","feedback":"Incorrect. Organic acid disorders are an important metabolic consideration in this pattern."},{"text":"Isolated anaemia","feedback":"Incorrect. Organic acid disorders are an important metabolic consideration in this pattern."},{"text":"Structural heart disease only","feedback":"Incorrect. Organic acid disorders are an important metabolic consideration in this pattern."}],"answer":0,"critical":false,"sourceIds":["GL04","GL14"]},{"id":"lc3-5","stem":"What is the safest use of a biochemical pattern?","options":[{"text":"Declare a final diagnosis","feedback":"Incorrect. Patterns guide prioritisation; they do not provide confirmation alone."},{"text":"Direct urgent action and discriminating tests","feedback":"Correct. Patterns guide prioritisation; they do not provide confirmation alone."},{"text":"Replace examination","feedback":"Incorrect. Patterns guide prioritisation; they do not provide confirmation alone."},{"text":"Ignore timing and treatment","feedback":"Incorrect. Patterns guide prioritisation; they do not provide confirmation alone."}],"answer":1,"critical":false,"sourceIds":["GL04","GL14"]}]},{"id":4,"title":"The first hour","subtitle":"Coordinate stabilisation, expert help and a safe transfer pathway.","minutes":12,"outcomes":["Identify concurrent first-hour priorities.","Explain why nutrition and treatment must be individualised.","Give a complete escalation handover."],"sections":[{"id":"4a","title":"Assign responsibility for coordination","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Aarav becomes less responsive while samples are being arranged. The team immediately reassesses airway, breathing and circulation, checks glucose and addresses seizures or shock under the neonatal emergency protocol. One clinician coordinates care; others arrange monitoring, sampling and specialist contact. The first hour requires active reassessment."],"points":["The UG learner calls for help and performs only assigned, supervised tasks."],"sourceIds":["IN01","E06"]},{"id":"4b","title":"Support metabolism with a tailored plan","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Acute illness may increase breakdown of the body's own tissues. Energy and fluid support therefore require deliberate planning. The appropriate route, composition and monitoring depend on the suspected disorder and the child's neurological, cardiac and biochemical state. There is no universal instruction to stop all food, restrict all protein or add lipids for every IEM. Ask the metabolic and treating team to specify the plan and reassessment."],"points":["For known disease, locate the child's current emergency letter and confirm its applicability."],"sourceIds":["GL14","GL04"]},{"id":"4c","title":"Escalate hyperammonaemia early","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Hyperammonaemia can injure the brain and needs urgent specialist management. Contact metabolic, neonatal or paediatric intensive-care services early; nephrology may be needed for extracorporeal clearance. Escalation depends on the child's neurological state, ammonia trajectory and response to treatment, alongside local capability. Specialist medicines and clearance methods require an agreed clinical protocol; this lesson supplies neither doses nor treatment cut-offs."],"points":["Do not wait for a molecular diagnosis before discussing time-critical treatment."],"sourceIds":["E01"]},{"id":"4d","title":"Close the communication loop","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["A useful call names the patient, current neurological and cardiorespiratory status, timed results with units, treatment already given and the specific help required. Read back the agreed plan and document who owns each task. If a test is unavailable locally, tell the receiving team immediately and agree where testing and care will occur. A referral request is incomplete until somebody accepts responsibility."],"points":["Rehearse: 'We need urgent advice and transfer assessment; these are our resources.'"],"sourceIds":[]},{"id":"4e","title":"Reassess the system as well as the patient","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Faculty exercise: map the journey from recognising Aarav's deterioration to senior review of his ammonia result. Identify who transports the sample, receives a critical call and accompanies transfer. Remove one resource, such as an overnight assay, and discuss how the pathway changes. A local plan specifies people and alternatives."],"points":["Identify the next review and the person receiving new results."],"sourceIds":[]}],"takeaway":"Stabilise, individualise support, escalate early and make responsibility explicit.","check":{"id":"lc4","stem":"The child is becoming less responsive and specialist biochemical results will take time. What should the team do?","options":[{"text":"Complete all diagnostic sampling before addressing breathing.","feedback":"Incorrect. Diagnostic work must not delay immediate stabilisation."},{"text":"Use the same feeding and lipid instruction for every suspected IEM.","feedback":"Incorrect. Nutritional support depends on the disorder and clinical state."},{"text":"Await genetic confirmation before discussing transfer.","feedback":"Incorrect. Transfer and time-critical care are determined by current need."},{"text":"Continue stabilisation, obtain urgent specialist/ICU advice and arrange transfer as needed while investigations proceed.","feedback":"Correct. Clinical deterioration requires parallel action and an explicit escalation pathway."}],"answer":3,"critical":true,"sourceIds":["IN01","E01","GL14"]},"evaluation":[{"id":"lc4","stem":"The child is becoming less responsive and specialist biochemical results will take time. What should the team do?","options":[{"text":"Complete all diagnostic sampling before addressing breathing.","feedback":"Incorrect. Diagnostic work must not delay immediate stabilisation."},{"text":"Use the same feeding and lipid instruction for every suspected IEM.","feedback":"Incorrect. Nutritional support depends on the disorder and clinical state."},{"text":"Await genetic confirmation before discussing transfer.","feedback":"Incorrect. Transfer and time-critical care are determined by current need."},{"text":"Continue stabilisation, obtain urgent specialist/ICU advice and arrange transfer as needed while investigations proceed.","feedback":"Correct. Clinical deterioration requires parallel action and an explicit escalation pathway."}],"answer":3,"critical":true,"sourceIds":["IN01","E01","GL14"]},{"id":"lc4-2","stem":"What is the first organising principle in a suspected metabolic emergency?","options":[{"text":"Stabilise physiology and escalate while investigating","feedback":"Correct. Immediate clinical priorities and diagnostic work proceed together."},{"text":"Wait for molecular confirmation","feedback":"Incorrect. Immediate clinical priorities and diagnostic work proceed together."},{"text":"Complete every sample before treatment","feedback":"Incorrect. Immediate clinical priorities and diagnostic work proceed together."},{"text":"Search the internet for a diet","feedback":"Incorrect. Immediate clinical priorities and diagnostic work proceed together."}],"answer":0,"critical":true,"sourceIds":["IN01","E01","GL14"]},{"id":"lc4-3","stem":"Who should be contacted early when the child is critically ill?","options":[{"text":"Metabolic and critical-care expertise through the local pathway","feedback":"Correct. Early expert coordination can change testing, treatment and transfer decisions."},{"text":"Only the outpatient clinic","feedback":"Incorrect. Early expert coordination can change testing, treatment and transfer decisions."},{"text":"Only after all results return","feedback":"Incorrect. Early expert coordination can change testing, treatment and transfer decisions."},{"text":"No one until transfer","feedback":"Incorrect. Early expert coordination can change testing, treatment and transfer decisions."}],"answer":0,"critical":false,"sourceIds":["IN01","E01","GL14"]},{"id":"lc4-4","stem":"What should accompany a transfer request?","options":[{"text":"A diagnosis stated as certain","feedback":"Incorrect. A structured handover supports the receiving team's next decision."},{"text":"Time-stamped findings, treatment, response and pending results","feedback":"Correct. A structured handover supports the receiving team's next decision."},{"text":"Only demographic details","feedback":"Incorrect. A structured handover supports the receiving team's next decision."},{"text":"A promise of recovery","feedback":"Incorrect. A structured handover supports the receiving team's next decision."}],"answer":1,"critical":false,"sourceIds":["IN01","E01","GL14"]},{"id":"lc4-5","stem":"Why is repeated reassessment essential?","options":[{"text":"The child's physiology and priorities may change","feedback":"Correct. A metabolic emergency is dynamic; response and deterioration must be detected."},{"text":"It replaces laboratory testing","feedback":"Incorrect. A metabolic emergency is dynamic; response and deterioration must be detected."},{"text":"It confirms inheritance","feedback":"Incorrect. A metabolic emergency is dynamic; response and deterioration must be detected."},{"text":"It removes the need for documentation","feedback":"Incorrect. A metabolic emergency is dynamic; response and deterioration must be detected."}],"answer":0,"critical":false,"sourceIds":["IN01","E01","GL14"]}]},{"id":5,"title":"Send the right sample","subtitle":"Preserve diagnostic information through timing, handling and communication.","minutes":12,"outcomes":["Distinguish urgent physiology tests from specialised diagnostic studies.","Explain the purpose of a critical sample.","Use receiving-laboratory instructions and track results."],"sections":[{"id":"5a","title":"Collect information without delaying care","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["A critical sample records biochemistry during an event such as hypoglycaemia or encephalopathy. Obtain agreed samples promptly when feasible, but never delay stabilisation or treatment. If treatment has started, record what was given and when; discuss which tests remain useful. A partially completed, well-documented set can still help."],"points":["Assign sampling to a team member while the clinical lead manages the child."],"sourceIds":["IN01","E01"]},{"id":"5b","title":"Coordinate urgent ammonia testing","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Collection and processing errors can falsely increase ammonia. Before drawing blood, confirm the receiving laboratory's accepted specimen, minimum volume, processing time and transport conditions. The correct tube and workflow are assay-specific; follow the current local SOP rather than a remembered colour code. Notify the laboratory of urgency and make sure a responsible clinician receives the result."],"points":["An unexpected result needs clinical review and laboratory discussion, not dismissal as artefact."],"sourceIds":["E02"]},{"id":"5c","title":"Match the specimen to the question","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Glucose, gas, lactate and ammonia describe immediate physiology. Amino acids, acylcarnitines and urine organic acids investigate possible pathways. Availability and specimen requirements differ. For urine organic acids, age, illness state and supplements can affect interpretation. Confirm the container, storage, transport and acceptance requirements with the receiving laboratory."],"points":["'Metabolic screen' is not a sufficiently precise request: name the agreed tests."],"sourceIds":["E03","IN03"]},{"id":"5d","title":"Explain a negative result in context","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Metabolic profiles may differ during illness and recovery. For suspected MCAD deficiency, characteristic biochemical findings can become less evident outside decompensation; interpretation and confirmatory investigation need specialist input. A normal report after treatment does not erase a compelling episode. Do not recreate fasting or stop effective treatment to improve diagnostic yield."],"points":["PG task: annotate a report with the child's state and treatment at collection."],"sourceIds":["GL05"]},{"id":"5e","title":"Track requests and results","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Fictional request: 'Aarav, day four; progressive drowsiness; timed initial results attached; treatment began before this specimen; please advise on interpretation and further samples.' Include identifiers, age, relevant family history and a reachable clinician. Verify labels against the request. Track arrival, acceptance and reporting. Faculty should teach ownership of pending results after transfer or discharge."],"points":["Who will contact the family and treating team with the final report?"],"sourceIds":["E03"]}],"takeaway":"A useful sample needs the right timing, local handling instructions, clinical context and a named result owner.","check":{"id":"lc5","stem":"A neonatal ammonia sample has uncertain handling, and the baby is clinically deteriorating. What is the best response?","options":[{"text":"Continue urgent care, discuss the specimen with the laboratory and arrange prompt recollection if advised.","feedback":"Correct. Resolve preanalytical uncertainty while the treating team manages the clinical emergency."},{"text":"Ignore the ammonia result because mishandling is possible.","feedback":"Incorrect. A possible artefact does not remove the risk of real hyperammonaemia."},{"text":"Use the specimen's tube colour to certify that all handling was correct.","feedback":"Incorrect. Tube choice is only one part of a laboratory-specific workflow."},{"text":"Wait for every specialised sample before treating the child.","feedback":"Incorrect. Sampling must never delay necessary stabilisation or treatment."}],"answer":0,"critical":true,"sourceIds":["E02","E01"]},"evaluation":[{"id":"lc5","stem":"A neonatal ammonia sample has uncertain handling, and the baby is clinically deteriorating. What is the best response?","options":[{"text":"Continue urgent care, discuss the specimen with the laboratory and arrange prompt recollection if advised.","feedback":"Correct. Resolve preanalytical uncertainty while the treating team manages the clinical emergency."},{"text":"Ignore the ammonia result because mishandling is possible.","feedback":"Incorrect. A possible artefact does not remove the risk of real hyperammonaemia."},{"text":"Use the specimen's tube colour to certify that all handling was correct.","feedback":"Incorrect. Tube choice is only one part of a laboratory-specific workflow."},{"text":"Wait for every specialised sample before treating the child.","feedback":"Incorrect. Sampling must never delay necessary stabilisation or treatment."}],"answer":0,"critical":true,"sourceIds":["E02","E01"]},{"id":"lc5-2","stem":"Before collecting a specialised metabolic sample, what should the team confirm?","options":[{"text":"The receiving laboratory's current specimen and handling requirements","feedback":"Correct. Laboratory-specific requirements reduce preventable sample failure."},{"text":"The colour of the ward label only","feedback":"Incorrect. Laboratory-specific requirements reduce preventable sample failure."},{"text":"A textbook tube list","feedback":"Incorrect. Laboratory-specific requirements reduce preventable sample failure."},{"text":"That treatment can wait","feedback":"Incorrect. Laboratory-specific requirements reduce preventable sample failure."}],"answer":0,"critical":true,"sourceIds":["E02","E01"]},{"id":"lc5-3","stem":"When should diagnostic samples ideally be collected?","options":[{"text":"During decompensation when feasible, without delaying stabilisation","feedback":"Correct. The abnormal biochemical state may be most informative, but care comes first."},{"text":"Only after complete recovery","feedback":"Incorrect. The abnormal biochemical state may be most informative, but care comes first."},{"text":"Only after genetic counselling","feedback":"Incorrect. The abnormal biochemical state may be most informative, but care comes first."},{"text":"At the next routine visit","feedback":"Incorrect. The abnormal biochemical state may be most informative, but care comes first."}],"answer":0,"critical":false,"sourceIds":["E02","E01"]},{"id":"lc5-4","stem":"Which information improves interpretation of a sample?","options":[{"text":"Clinical state, feeding and treatment timing","feedback":"Correct. Context can materially change biochemical interpretation."},{"text":"The clinician's favourite diagnosis","feedback":"Incorrect. Context can materially change biochemical interpretation."},{"text":"The family's income","feedback":"Incorrect. Context can materially change biochemical interpretation."},{"text":"The brand of syringe alone","feedback":"Incorrect. Context can materially change biochemical interpretation."}],"answer":0,"critical":false,"sourceIds":["E02","E01"]},{"id":"lc5-5","stem":"What completes the specimen pathway?","options":[{"text":"Putting the tube on a tray","feedback":"Incorrect. Ownership and closed-loop follow-up are part of diagnostic safety."},{"text":"Named responsibility for transport, acceptance and result review","feedback":"Correct. Ownership and closed-loop follow-up are part of diagnostic safety."},{"text":"Writing 'urgent' without phoning","feedback":"Incorrect. Ownership and closed-loop follow-up are part of diagnostic safety."},{"text":"Sending without identifiers","feedback":"Incorrect. Ownership and closed-loop follow-up are part of diagnostic safety."}],"answer":1,"critical":false,"sourceIds":["E02","E01"]}]},{"id":6,"title":"From phenotype to diagnosis","subtitle":"Make the clinical story, biochemical pattern and genetic result explain one another.","minutes":10,"outcomes":["Build a concise phenotype before selecting a specialised test.","Use a simple biological map without treating it as a diagnosis.","Explain why a variant of uncertain significance cannot confirm an IEM."],"sections":[{"id":"6a","title":"Write the problem before the test","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["A phenotype is more than a diagnostic label. Describe when the child became unwell, whether development was previously progressing, the organs involved, and any relationship to feeding, fasting or infection. Add the family history and results already available. A useful referral sentence tells the receiving team what happened and when; ‘rule out metabolic disorder’ leaves those decisions hidden.","Practice with this fictional contrast: one child has recurrent illness-associated drowsiness but is active between episodes; another gradually loses skills and develops organ enlargement. Both warrant careful assessment, but the time course changes the questions your next investigation should answer."],"points":[],"sourceIds":["GL03"]},{"id":"6b","title":"Use mechanisms as an organising map","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["For this course, organise possibilities around accumulation of harmful metabolites, failure to supply usable energy, and disturbed processing of cellular material. Urea cycle defects, fatty-acid oxidation defects and lysosomal disorders illustrate different mechanisms. This simplified teaching map helps connect biology to a clinical problem; it is not a replacement for the formal ICIMD classification, and disease mechanisms can overlap.","Ask what the proposed mechanism predicts. Would illness increase the metabolic load? Would a particular organ bear the injury? A prediction becomes useful when you compare it with observations rather than selecting a disease because its name feels familiar."],"points":[],"sourceIds":["GL13","GL04","GL05","T04"]},{"id":"6c","title":"A metabolite is evidence with a context","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["An abnormal metabolite is not automatically a unique disease signature. Elevated methylmalonic acid, for example, needs interpretation alongside cobalamin status and the biochemical differential; it should not immediately be renamed inherited isolated methylmalonic acidaemia. Different biochemical subtypes also change treatment and follow-up.","Separate three questions in your notes: what was measured, what biological processes could explain it, and what would distinguish them. Include whether the child was ill and whether treatment preceded sampling. This preserves the reasoning for the metabolic laboratory and prevents an early provisional label becoming an unquestioned diagnosis."],"points":[],"sourceIds":["GL06"]},{"id":"6d","title":"Read a genetic result in layers","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["First read the laboratory classification: pathogenic, likely pathogenic, uncertain significance, likely benign or benign. Then check whether the gene, inheritance and child's findings fit together. A disease-associated gene name appearing on a report does not, by itself, establish that it explains this child's illness.","A variant of uncertain significance, or VUS, means the evidence is insufficient to classify the finding. It must not be used as the basis for clinical decisions. Management can still follow independently established clinical and biochemical evidence while specialists investigate the uncertain result."],"points":[],"sourceIds":["T01"]},{"id":"6e","title":"Keep an unresolved case active","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Laboratory review, appropriately selected family studies and additional clinical information may help resolve a VUS; classification can change as evidence grows. Agree who will request reinterpretation and explain the result again to the family. Avoid presenting uncertainty as either a confirmed diagnosis or a guarantee of health.","Proposed case-conference exercise: write one statement of what is established, one unresolved question, and one action that could reduce uncertainty. Assign an owner and a review point. This makes an inconclusive report part of a continuing diagnostic process instead of the end of the child's care."],"points":[],"sourceIds":["T01"]}],"takeaway":"A diagnosis must fit the child and the evidence; a VUS is an unresolved finding.","check":{"id":"lc6","stem":"A panel reports a VUS in a disease-associated gene. How should you interpret it?","options":[{"text":"A basis for reproductive decisions.","feedback":"Those decisions require specialist interpretation and stronger evidence."},{"text":"Unresolved; integrate phenotype, biochemistry and inheritance.","feedback":"Correct. The VUS alone is not diagnostic."},{"text":"Confirmed disease.","feedback":"Gene association does not establish variant significance."},{"text":"Disease excluded.","feedback":"Uncertainty cannot establish absence of disease."}],"answer":1,"critical":false,"sourceIds":["T01"]},"evaluation":[{"id":"lc6","stem":"A panel reports a VUS in a disease-associated gene. How should you interpret it?","options":[{"text":"A basis for reproductive decisions.","feedback":"Those decisions require specialist interpretation and stronger evidence."},{"text":"Unresolved; integrate phenotype, biochemistry and inheritance.","feedback":"Correct. The VUS alone is not diagnostic."},{"text":"Confirmed disease.","feedback":"Gene association does not establish variant significance."},{"text":"Disease excluded.","feedback":"Uncertainty cannot establish absence of disease."}],"answer":1,"critical":false,"sourceIds":["T01"]},{"id":"lc6-2","stem":"What is the best role of genomic testing in IEM diagnosis?","options":[{"text":"Integrate it with phenotype and biochemical evidence","feedback":"Correct. Genomic results gain meaning when interpreted with the child's phenotype and biochemistry."},{"text":"Replace the clinical history","feedback":"Incorrect. Genomic results gain meaning when interpreted with the child's phenotype and biochemistry."},{"text":"Treat every VUS as causal","feedback":"Incorrect. Genomic results gain meaning when interpreted with the child's phenotype and biochemistry."},{"text":"Order it only after adulthood","feedback":"Incorrect. Genomic results gain meaning when interpreted with the child's phenotype and biochemistry."}],"answer":0,"critical":true,"sourceIds":["T01"]},{"id":"lc6-3","stem":"A variant of uncertain significance is found. What is appropriate?","options":[{"text":"Declare the diagnosis","feedback":"Incorrect. A VUS is not diagnostic and needs additional evidence."},{"text":"Seek phenotype, biochemical and segregation evidence","feedback":"Correct. A VUS is not diagnostic and needs additional evidence."},{"text":"Tell the family it is definitely inherited","feedback":"Incorrect. A VUS is not diagnostic and needs additional evidence."},{"text":"Ignore all future reclassification","feedback":"Incorrect. A VUS is not diagnostic and needs additional evidence."}],"answer":1,"critical":false,"sourceIds":["T01"]},{"id":"lc6-4","stem":"Why might biochemical confirmation remain valuable after a genetic result?","options":[{"text":"It can show functional concordance and guide care","feedback":"Correct. Concordant biochemical evidence strengthens interpretation and may affect monitoring."},{"text":"It changes the child's age","feedback":"Incorrect. Concordant biochemical evidence strengthens interpretation and may affect monitoring."},{"text":"It guarantees treatment funding","feedback":"Incorrect. Concordant biochemical evidence strengthens interpretation and may affect monitoring."},{"text":"It removes consent needs","feedback":"Incorrect. Concordant biochemical evidence strengthens interpretation and may affect monitoring."}],"answer":0,"critical":false,"sourceIds":["T01"]},{"id":"lc6-5","stem":"What makes a diagnostic explanation coherent?","options":[{"text":"Phenotype, pathway and variant point in the same direction","feedback":"Correct. Concordance across evidence is stronger than any isolated label."},{"text":"The longest laboratory report","feedback":"Incorrect. Concordance across evidence is stronger than any isolated label."},{"text":"A single abnormal value without context","feedback":"Incorrect. Concordance across evidence is stronger than any isolated label."},{"text":"A famous disease name","feedback":"Incorrect. Concordance across evidence is stronger than any isolated label."}],"answer":0,"critical":false,"sourceIds":["T01"]}]},{"id":7,"title":"The child beyond the NICU","subtitle":"Recognise progression, connect organs, and select treatable possibilities.","minutes":10,"outcomes":["Distinguish delay from loss of established skills.","Recognise selected neurological, hepatic and cardiac clues.","Choose a phenotype-led assessment rather than a universal metabolic panel."],"sections":[{"id":"7a","title":"Revisit the developmental story","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Developmental delay describes slower acquisition of abilities; regression means losing an ability the child had reliably achieved. Confirm examples and timing with caregivers: independent walking, meaningful words, feeding or school tasks. New seizures, episodic confusion, progressive movement difficulty or findings in another organ make a fresh diagnostic review particularly important.","An existing label such as cerebral palsy should not prevent reassessment when the trajectory changes. Equally, developmental delay or autism alone does not identify an IEM. Ask what is new, progressive or unexplained, while continuing developmental support and considering common acquired and non-metabolic causes."],"points":[],"sourceIds":["T09","IN05"]},{"id":"7b","title":"A treatable neurological clue: biotinidase deficiency","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Biotinidase deficiency can present after the neonatal period with seizures, hypotonia or ataxia, sometimes alongside alopecia, rash, hearing or visual problems. The combination should prompt consideration of a biotinidase enzyme assay with specialist input. Biotin treatment can prevent manifestations when started early; established sensory or developmental injury may not fully reverse.","In a fictional clinic case, a child with seizures and hair loss has previously received only symptomatic treatment. The teaching task is to notice a potentially connecting diagnosis and arrange appropriate assessment, while continuing urgent seizure care. ‘Treatable’ describes an opportunity, not a promise of complete recovery."],"points":[],"sourceIds":["T02"]},{"id":"7c","title":"Connect liver and neurological findings","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Wilson disease is an example of an inherited metabolic disorder that may first appear in older children with hepatic disease. Movement, behavioural or psychiatric changes may accompany liver involvement, but the complete classic combination is not required. Diagnosis draws on clinical, biochemical and sometimes genetic evidence; one isolated result should not carry the entire conclusion.","Consider a schoolchild with unexplained persistent liver abnormalities and deteriorating handwriting. Reviewing both problems together is more informative than opening two unrelated diagnostic lists. Prompt specialist evaluation matters, and acute liver failure requires an emergency pathway rather than a routine genetics appointment."],"points":[],"sourceIds":["T03"]},{"id":"7d","title":"A weak infant with a large heart","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Infantile-onset Pompe disease illustrates why cardiac and neuromuscular examination belong together. Hypotonia, weakness, feeding or respiratory difficulty with hypertrophic cardiomyopathy raise this possibility. Later-onset Pompe disease often has a different pattern, particularly muscle and respiratory involvement; absence of infantile cardiomyopathy does not exclude that phenotype.","Enzyme activity and molecular testing contribute to confirmation. Disease-specific enzyme replacement exists, but assessment and treatment planning require expertise. For the referring clinician, the immediate lesson is to communicate both the weakness and the cardiac findings, assess respiratory safety, and obtain timely specialist care."],"points":[],"sourceIds":["T04"]},{"id":"7e","title":"Choose a question that a test can answer","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Proposed reasoning exercise: draw two columns headed ‘finding that changes the differential’ and ‘action it changes’. For regression, document the lost skill; for organ enlargement, describe its pattern; for weakness, record cardiac and respiratory findings. Then choose the most informative next assessment with the relevant specialist.","A long panel can still miss the explanation if its methods do not address the clinical question. Build a plan that accommodates infection, nutrition, endocrine disease and other treatable acquired causes as well as inherited disease. Record who will review the result and whether the child needs reassessment before it returns."],"points":[],"sourceIds":[]}],"takeaway":"Age does not exclude an IEM. Progression and connected organ findings guide targeted assessment.","check":{"id":"lc7","stem":"A child with an existing motor-disability label now loses previously established skills. Which response is most appropriate?","options":[{"text":"Reassess the trajectory and examine for neurological, systemic and acquired causes.","feedback":"Correct. New regression changes the clinical question and warrants renewed evaluation."},{"text":"Assume the new changes are already explained by the old label.","feedback":"A prior label should not prevent evaluation of a changing course."},{"text":"Diagnose an IEM from regression alone.","feedback":"Regression is a reason to investigate, not a disease-specific diagnosis."},{"text":"Stop developmental therapy until every metabolic test is complete.","feedback":"Diagnostic assessment and developmental support can proceed together."}],"answer":0,"critical":false,"sourceIds":["T09","IN05"]},"evaluation":[{"id":"lc7","stem":"A child with an existing motor-disability label now loses previously established skills. Which response is most appropriate?","options":[{"text":"Reassess the trajectory and examine for neurological, systemic and acquired causes.","feedback":"Correct. New regression changes the clinical question and warrants renewed evaluation."},{"text":"Assume the new changes are already explained by the old label.","feedback":"A prior label should not prevent evaluation of a changing course."},{"text":"Diagnose an IEM from regression alone.","feedback":"Regression is a reason to investigate, not a disease-specific diagnosis."},{"text":"Stop developmental therapy until every metabolic test is complete.","feedback":"Diagnostic assessment and developmental support can proceed together."}],"answer":0,"critical":false,"sourceIds":["T09","IN05"]},{"id":"lc7-2","stem":"Which developmental history most needs renewed investigation?","options":[{"text":"Loss of previously acquired skills","feedback":"Correct. Regression is a red flag and differs from static delay."},{"text":"Stable school performance","feedback":"Incorrect. Regression is a red flag and differs from static delay."},{"text":"A transient dislike of food","feedback":"Incorrect. Regression is a red flag and differs from static delay."},{"text":"Normal variation in height","feedback":"Incorrect. Regression is a red flag and differs from static delay."}],"answer":0,"critical":true,"sourceIds":["T09","IN05"]},{"id":"lc7-3","stem":"Why should clinicians connect findings across organs?","options":[{"text":"Multisystem patterns can reveal a shared metabolic mechanism","feedback":"Correct. A linked multisystem pattern may be more informative than isolated labels."},{"text":"Every symptom has one cause","feedback":"Incorrect. A linked multisystem pattern may be more informative than isolated labels."},{"text":"It replaces examination","feedback":"Incorrect. A linked multisystem pattern may be more informative than isolated labels."},{"text":"It confirms one named disorder","feedback":"Incorrect. A linked multisystem pattern may be more informative than isolated labels."}],"answer":0,"critical":false,"sourceIds":["T09","IN05"]},{"id":"lc7-4","stem":"What is the value of identifying treatable mimics early?","options":[{"text":"Some require time-sensitive action","feedback":"Correct. A treatable possibility may change urgency even before confirmation."},{"text":"They are always common","feedback":"Incorrect. A treatable possibility may change urgency even before confirmation."},{"text":"They eliminate genetic testing","feedback":"Incorrect. A treatable possibility may change urgency even before confirmation."},{"text":"They never recur","feedback":"Incorrect. A treatable possibility may change urgency even before confirmation."}],"answer":0,"critical":false,"sourceIds":["T09","IN05"]},{"id":"lc7-5","stem":"A child labelled with developmental delay begins losing words and gait skills. What is best?","options":[{"text":"Keep the old label unchanged","feedback":"Incorrect. A changing trajectory demands a new diagnostic review."},{"text":"Document regression and reassess the differential","feedback":"Correct. A changing trajectory demands a new diagnostic review."},{"text":"Wait until adulthood","feedback":"Incorrect. A changing trajectory demands a new diagnostic review."},{"text":"Attribute it to motivation","feedback":"Incorrect. A changing trajectory demands a new diagnostic review."}],"answer":1,"critical":false,"sourceIds":["T09","IN05"]}]},{"id":8,"title":"Living with a diagnosis","subtitle":"Treat the biochemical problem while supporting growth, development and family life.","minutes":10,"outcomes":["Describe why IEM treatments differ by mechanism.","Explain the purpose of an individual nutrition and illness plan.","Review growth, daily functioning and practical barriers alongside laboratory results."],"sections":[{"id":"8a","title":"Start with the purpose of treatment","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["IEM treatment is disease-specific. Examples include replacing a deficient cofactor in biotinidase deficiency, controlling phenylalanine exposure in PAH deficiency, and enzyme replacement for Pompe disease. These approaches address different mechanisms and cannot be substituted for one another. Availability, eligibility and expected benefit must be assessed for the actual child.","A useful explanation links each intervention to its purpose: what harm is it intended to reduce, how will response be assessed, and what limitations remain? A medicine or formula list without that explanation makes changes difficult for families to understand."],"points":[],"sourceIds":["T02","T05","T04"]},{"id":"8b","title":"Nutrition must support the growing child","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["In PAH deficiency, dietary treatment balances phenylalanine control with adequate nutrition; specialist medical foods may be part of that prescription. Growth failure and nutritional deficiencies are possible when treatment is poorly balanced. The lesson is not that every child with an IEM should receive a low-protein diet. Requirements differ by disease, age, growth and treatment.","For a family eating locally available foods, the metabolic dietitian must translate the individual prescription into workable meals. Proposed consultation practice: invite a caregiver to describe an ordinary day of feeding and identify where the written prescription is hard to carry out. Do not improvise substitutions from this course."],"points":[],"sourceIds":["T05"]},{"id":"8c","title":"Prepare for illness before it happens","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["In disorders such as MSUD, infection can increase breakdown of the body's own protein and precipitate metabolic deterioration. A personalised sick-day plan explains when to contact the team, what prescribed changes are appropriate, how response is monitored, and when hospital assessment is required. Persistent vomiting, inability to take the prescribed intake, or altered consciousness require urgent assessment.","Have caregivers demonstrate how they would find and use their child's current plan. The plan must be accessible to the treating clinician during an emergency. Do not turn a general lesson into a home recipe or advise prolonged blanket withdrawal of protein or other nutrients."],"points":[],"sourceIds":["T06"]},{"id":"8d","title":"Look beyond a satisfactory laboratory value","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Follow-up should assess the child's functioning as well as the disease marker. PAH deficiency care, for example, includes developmental, educational and psychosocial concerns alongside biochemical and nutritional monitoring. A treatment programme can meet a laboratory target while the family still struggles with feeding, school participation or treatment burden.","Proposed review exercise: compare today's growth trajectory, daily intake, developmental progress, medicine or formula supply, and caregiver concerns with the previous visit. Explain any change in plain language. A trend can reveal a problem that one isolated measurement or a hurried ‘doing well’ misses."],"points":[],"sourceIds":["T05"]},{"id":"8e","title":"Make the plan usable at home and school","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Proposed shared-care exercise: create a brief, individual summary with the family and specialist team. Include the confirmed diagnosis, current prescription, emergency plan location, responsible clinical team and arrangements for review. Ask who provides care when the usual caregiver is unavailable and how the child reaches hospital during illness.","Invite the child to participate at a developmentally appropriate level. Explore cost, travel, language and supply interruptions without treating difficulty as a moral failure. Use a teach-back conversation to test the clarity of your explanation: the caregiver describes the next action in their own words, and you correct gaps supportively."],"points":[],"sourceIds":[]}],"takeaway":"Successful long-term care protects growth and everyday life as well as metabolic stability.","check":{"id":"lc8","stem":"A child with known MSUD is repeatedly vomiting and becoming drowsy during an infection. What is the best next action?","options":[{"text":"Wait for the next scheduled outpatient amino-acid result.","feedback":"A scheduled result must not delay assessment of an unwell child."},{"text":"Use a generic online diet until the vomiting stops.","feedback":"Emergency nutrition must follow the child's prescribed plan and clinical assessment."},{"text":"Assume avoiding dietary protein completely will stop catabolism.","feedback":"Illness also mobilises the body's own protein; blanket restriction is not an adequate emergency response."},{"text":"Arrange urgent hospital assessment and activate the child's specialist emergency plan.","feedback":"Correct. Poor intake and neurological change can signal deterioration and exceed routine home management."}],"answer":3,"critical":true,"sourceIds":["T06"]},"evaluation":[{"id":"lc8","stem":"A child with known MSUD is repeatedly vomiting and becoming drowsy during an infection. What is the best next action?","options":[{"text":"Wait for the next scheduled outpatient amino-acid result.","feedback":"A scheduled result must not delay assessment of an unwell child."},{"text":"Use a generic online diet until the vomiting stops.","feedback":"Emergency nutrition must follow the child's prescribed plan and clinical assessment."},{"text":"Assume avoiding dietary protein completely will stop catabolism.","feedback":"Illness also mobilises the body's own protein; blanket restriction is not an adequate emergency response."},{"text":"Arrange urgent hospital assessment and activate the child's specialist emergency plan.","feedback":"Correct. Poor intake and neurological change can signal deterioration and exceed routine home management."}],"answer":3,"critical":true,"sourceIds":["T06"]},{"id":"lc8-2","stem":"What should long-term IEM care monitor besides biochemical targets?","options":[{"text":"Growth, development, nutrition and family functioning","feedback":"Correct. Good chronic care follows the whole child and family."},{"text":"Only clinic attendance","feedback":"Incorrect. Good chronic care follows the whole child and family."},{"text":"Only genetic terminology","feedback":"Incorrect. Good chronic care follows the whole child and family."},{"text":"Only the latest laboratory value","feedback":"Incorrect. Good chronic care follows the whole child and family."}],"answer":0,"critical":true,"sourceIds":["T06"]},{"id":"lc8-3","stem":"Who should create a disorder-specific emergency plan?","options":[{"text":"The treating metabolic team with the family and local clinicians","feedback":"Correct. Individual emergency plans require specialist and local coordination."},{"text":"An unsupervised learner","feedback":"Incorrect. Individual emergency plans require specialist and local coordination."},{"text":"A generic website","feedback":"Incorrect. Individual emergency plans require specialist and local coordination."},{"text":"The family alone","feedback":"Incorrect. Individual emergency plans require specialist and local coordination."}],"answer":0,"critical":false,"sourceIds":["T06"]},{"id":"lc8-4","stem":"Why is a generic restrictive diet unsafe?","options":[{"text":"Nutritional treatment is diagnosis-specific and must support growth","feedback":"Correct. Metabolic diets require precise diagnosis and specialist dietetic oversight."},{"text":"All protein is harmful","feedback":"Incorrect. Metabolic diets require precise diagnosis and specialist dietetic oversight."},{"text":"Families cannot learn diets","feedback":"Incorrect. Metabolic diets require precise diagnosis and specialist dietetic oversight."},{"text":"Diet never matters","feedback":"Incorrect. Metabolic diets require precise diagnosis and specialist dietetic oversight."}],"answer":0,"critical":false,"sourceIds":["T06"]},{"id":"lc8-5","stem":"Which transition is most likely to fail without explicit ownership?","options":[{"text":"Emergency information reaching school and local services","feedback":"Correct. Plans must travel with the child and be understood where emergencies occur."},{"text":"Measuring height","feedback":"Incorrect. Plans must travel with the child and be understood where emergencies occur."},{"text":"Recording date of birth","feedback":"Incorrect. Plans must travel with the child and be understood where emergencies occur."},{"text":"Naming the hospital","feedback":"Incorrect. Plans must travel with the child and be understood where emergencies occur."}],"answer":0,"critical":false,"sourceIds":["T06"]}]},{"id":9,"title":"Screening and the next pregnancy","subtitle":"Communicate uncertainty accurately and make counselling specific to the family.","minutes":10,"outcomes":["Explain the difference between a screening result and a diagnosis.","Act on symptoms even after a reported normal screen.","Distinguish autosomal recessive, X-linked and mitochondrial counselling questions."],"sections":[{"id":"9a","title":"A screen changes probability","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Newborn screening identifies babies who may need further assessment for selected conditions. An out-of-range result is not a confirmed diagnosis, and a result within range cannot exclude every screened condition. False-positive and false-negative results occur. A child who becomes symptomatic needs clinical assessment even after a reported normal screen.","Ask to see the actual report. ‘Screening done’ does not tell you which conditions were included or whether follow-up was completed. Record the result and what happened next. The biological limits described here apply broadly; programme panels and operational arrangements must be checked locally."],"points":[],"sourceIds":["T07"]},{"id":"9b","title":"Close the loop after an abnormal result","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["An abnormal result needs timely, condition-specific follow-up. Some infants need immediate specialist-directed care while confirmation proceeds. Contact the family in clear language, establish whether the baby is currently well, and arrange the recommended assessment.","Proposed communication practice: ‘This result means your baby needs another assessment; it does not yet prove the condition. Here is the next step and when it must happen.’ Then document a named clinician responsible for reviewing confirmation. A collected sample or a sent referral is not evidence that the baby reached care."],"points":[],"sourceIds":["T07"]},{"id":"9c","title":"Do not give every family the same recurrence risk","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["For an autosomal recessive disorder such as biotinidase deficiency, when both parents are confirmed carriers, each pregnancy has a one-in-four probability of an affected child. Previous affected or unaffected births do not change that probability for the next conception.","That explanation cannot be transferred to every IEM. Ornithine transcarbamylase deficiency is X-linked, whereas many other urea cycle disorders are autosomal recessive. Counselling must consider the specific diagnosis, parental findings and who is at risk. Avoid blame: inheritance describes biological transmission, not an action that a parent caused."],"points":[],"sourceIds":["T02","GL04"]},{"id":"9d","title":"Mitochondrial does not always mean maternal","depth":{"UG":"Nice to Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Primary mitochondrial disorders can result from mitochondrial DNA or nuclear DNA variants. The latter may follow autosomal recessive, autosomal dominant or X-linked inheritance. For mitochondrial DNA disorders, maternal transmission and the proportion and distribution of altered mitochondrial DNA can complicate prediction of clinical expression.","Before offering a recurrence estimate, identify which genetic system is involved and what has actually been established in the family. A generic label such as ‘mitochondrial disease’ is insufficient. Specialist counselling should explain both available reproductive options and the uncertainty that testing may leave, without predicting an identical course in every child."],"points":[],"sourceIds":["T08"]},{"id":"9e","title":"Plan before pregnancy when possible","depth":{"UG":"Good to Know","PG":"Nice to Know","Faculty":"Must Know"},"paragraphs":["Where a causative familial variant is established, disorder-specific prenatal or preimplantation genetic testing may be possible. A genetics consultation before pregnancy allows review of the affected child's diagnosis, relevant parental testing and the family's preferences. The appropriate test and its interpretation need individual planning.","Proposed counselling exercise: prepare a family summary distinguishing confirmed findings from unanswered questions, then explain the options without steering the family's decision. Include a plan for the next newborn when indicated; routine screening alone may not be the right strategy for a known familial risk. Document understanding, consent and a route back for further discussion."],"points":[],"sourceIds":["T02","GL04"]}],"takeaway":"Screening requires follow-through; recurrence counselling requires the family's actual diagnosis.","check":{"id":"lc9","stem":"A lethargic baby has a reported normal newborn screen. What should you do?","options":[{"text":"Wait for a repeat screening card.","feedback":"Do not postpone clinical assessment."},{"text":"Guarantee absence of inherited disease.","feedback":"A screen cannot provide that guarantee."},{"text":"Assess promptly and investigate the symptoms.","feedback":"Correct. Symptoms require assessment regardless of screening."},{"text":"Exclude IEM.","feedback":"Screening misses some affected babies."}],"answer":2,"critical":true,"sourceIds":["T07","GL04"]},"evaluation":[{"id":"lc9","stem":"A lethargic baby has a reported normal newborn screen. What should you do?","options":[{"text":"Wait for a repeat screening card.","feedback":"Do not postpone clinical assessment."},{"text":"Guarantee absence of inherited disease.","feedback":"A screen cannot provide that guarantee."},{"text":"Assess promptly and investigate the symptoms.","feedback":"Correct. Symptoms require assessment regardless of screening."},{"text":"Exclude IEM.","feedback":"Screening misses some affected babies."}],"answer":2,"critical":true,"sourceIds":["T07","GL04"]},{"id":"lc9-2","stem":"What does an out-of-range newborn screen mean?","options":[{"text":"A confirmed diagnosis","feedback":"Incorrect. Screening identifies risk; it does not confirm disease."},{"text":"A need for timely recall and confirmatory assessment","feedback":"Correct. Screening identifies risk; it does not confirm disease."},{"text":"A lifelong treatment order","feedback":"Incorrect. Screening identifies risk; it does not confirm disease."},{"text":"That the baby must be symptomatic","feedback":"Incorrect. Screening identifies risk; it does not confirm disease."}],"answer":1,"critical":true,"sourceIds":["T07","GL04"]},{"id":"lc9-3","stem":"What is the correct response when a screened baby appears well?","options":[{"text":"Ignore the result","feedback":"Incorrect. Some screened disorders are treatable before symptoms appear."},{"text":"Follow the condition-specific recall pathway promptly","feedback":"Correct. Some screened disorders are treatable before symptoms appear."},{"text":"Wait for symptoms","feedback":"Incorrect. Some screened disorders are treatable before symptoms appear."},{"text":"Repeat only at school age","feedback":"Incorrect. Some screened disorders are treatable before symptoms appear."}],"answer":1,"critical":false,"sourceIds":["T07","GL04"]},{"id":"lc9-4","stem":"How should recurrence risk be discussed?","options":[{"text":"Using the confirmed diagnosis and family-specific genetic information","feedback":"Correct. Counselling must be specific to inheritance and the family's evidence."},{"text":"Using one universal percentage","feedback":"Incorrect. Counselling must be specific to inheritance and the family's evidence."},{"text":"Only after another affected pregnancy","feedback":"Incorrect. Counselling must be specific to inheritance and the family's evidence."},{"text":"Without documenting uncertainty","feedback":"Incorrect. Counselling must be specific to inheritance and the family's evidence."}],"answer":0,"critical":false,"sourceIds":["T07","GL04"]},{"id":"lc9-5","stem":"What closes the screening loop?","options":[{"text":"A phone call alone","feedback":"Incorrect. Closed-loop tracking prevents children being lost after recall."},{"text":"Confirmation that assessment occurred and results were reviewed","feedback":"Correct. Closed-loop tracking prevents children being lost after recall."},{"text":"Posting a letter","feedback":"Incorrect. Closed-loop tracking prevents children being lost after recall."},{"text":"Assuming another service followed up","feedback":"Incorrect. Closed-loop tracking prevents children being lost after recall."}],"answer":1,"critical":false,"sourceIds":["T07","GL04"]}]},{"id":10,"title":"IEM care in India","subtitle":"Build a reliable path from first recognition to specialist and continuing care.","minutes":10,"outcomes":["Match referral urgency to the child's clinical needs.","Prioritise investigations with the receiving laboratory and specialist.","Explain dated rare-disease policy information without promising eligibility or funding."],"sections":[{"id":"10a","title":"Choose the destination the child needs now","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["A district clinician's first decision is whether the child needs emergency stabilisation and transfer, urgent specialist discussion, or planned outpatient evaluation. A sick child should reach a centre with the necessary clinical capability; a genetics clinic listing does not establish emergency intensive-care capacity.","Proposed district teaching pathway: stabilise, contact the appropriate receiving clinical team, agree essential investigations and transport arrangements, then send a concise handover. Describe the child's current condition, suspected problem, treatment already given and pending results. Clinical care continues while the diagnosis is being pursued."],"points":[],"sourceIds":["IN01"]},{"id":"10b","title":"Spend the next test on the next decision","depth":{"UG":"Must Know","PG":"Must Know","Faculty":"Must Know"},"paragraphs":["Use a staged investigation plan rather than equating more tests with better care. Start with the urgent clinical question, then choose specialised tests with the laboratory and metabolic team. Confirm specimen type, handling, transport, turnaround and who receives critical results. Do not delay stabilisation to obtain an ideal sample.","Proposed prioritisation exercise: for every test, complete the sentence ‘This result could change…’. Possibilities include immediate management, the next diagnostic step or family counselling. Also identify what a negative result cannot exclude. Ask for an actual local quotation when cost matters; this course does not assign national test prices."],"points":[
